# CD: Präsentationsseite site/ (B-183) von main auf GitHub Pages. Rein statisch, kein Node und kein Build (B-507):
# die Bilder liegen als Kopien in site/img/, tests/pagesSite.test.ts prüft die Referenzen (läuft in ci.yml).
# Einmalig aktivieren: Repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
