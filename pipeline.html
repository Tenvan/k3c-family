<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="pipeline.pageTitle">K3C Grafik-Pipeline</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; --ground: #4b692f; }
      * { box-sizing: border-box; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.4 system-ui, sans-serif; }
      main { padding: max(4.75rem, 70px) 2rem 2rem; max-width: 115rem; margin: 0 auto; }
      h1 { font-size: 2.125rem; margin: 0 0 4px; }
      .sub { color: var(--dim); margin: 0 0 1.5rem; max-width: 62rem; }
      #pairs { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
      .pair { background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.75rem 1rem; max-width: 100%; }
      h2 { font-size: 0.9rem; margin: 0 0 0.5rem; color: var(--on); word-break: break-all; }
      .ground { display: flex; gap: 1rem; align-items: flex-end; border-bottom: 0.5rem solid var(--ground); background: linear-gradient(#2c3350, #4a3a5c); padding: 0.5rem 0.5rem 0; overflow-x: auto; }
      figure { margin: 0; }
      figure img { display: block; image-rendering: pixelated; height: auto; }
      figcaption { font-size: 0.75rem; color: #c9d2e3; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-t="pipeline.title">Grafik-Pipeline: vorher und nachher</h1>
      <p class="sub" data-t="pipeline.sub"></p>
      <div id="pairs"></div>
    </main>
    <script type="module" src="/src/tools/pipeline.ts"></script>
  </body>
</html>
