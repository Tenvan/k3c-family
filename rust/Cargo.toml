[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Fremde Crates nur mit Freigabe von Ralf (RU2 › Anforderungen, Stack fest); Versionen fest.
[workspace.dependencies]
winit = "=0.30.12"
wgpu = "=30.0.2"
pollster = "=1.0.1"
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# RU4 (B-1014, Freigabe Ralf): Schrift, Gamepads, Ton.
fontdue = { version = "=0.9.5", default-features = false, features = ["std"] }
gilrs = "=0.11.2"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "vorbis", "mp3", "wav"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_lines = "deny"
# RU42 (Stabilität): kein Panic im Produktivcode, Fehler weiterreichen (Tests in clippy.toml erlaubt).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
