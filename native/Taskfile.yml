# Namespace `native`: Bevy-Prototyp (Projekt NAT, Sprint NV1, B-776). Eigenes Cargo-Projekt unter native/k3c-proto,
# Bevy exakt gepinnt, Bau nur mit --locked. Grafik kommt aus public/grafik (vorher `task gen:paper`).
version: '3'

vars:
  PROTO: '{{.ROOT_DIR}}/native/k3c-proto'
  EXE: '{{.ROOT_DIR}}/native/k3c-proto/target/release/k3c-proto.exe'
  PAKET: '{{.ROOT_DIR}}/.work/native-proto'

tasks:
  proto:build:
    desc: "Bevy-Prototyp bauen (Release, --locked) nach native/k3c-proto/target/release/"
    dir: '{{.PROTO}}'
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/k3c-proto.exe
    cmds:
      - cargo build --release --locked

  proto:
    desc: "Bevy-Prototyp starten (Spieler 1: Pad 1 oder A/D, Spieler 2: Pad 2 oder ←/→)"
    deps: [proto:build]
    cmds:
      - '"{{.EXE}}" --root "{{.ROOT_DIR}}"'

  measure:
    desc: "FPS und Grafikspeicher messen (Lastfälle level und alle, Vulkan), Bericht nach reports/native-proto-*.json"
    deps: [proto:build]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/native/measure.ps1"

  proto:paket:
    desc: "Paket für den Mini-PC nach .work/native-proto/ (EXE, Messskript, public/grafik); dort messen.cmd starten"
    deps: [proto:build]
    cmds:
      - rm -rf "{{.PAKET}}"
      - mkdir -p "{{.PAKET}}/public"
      - cp "{{.EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.PAKET}}/"
      - cp -r "{{.ROOT_DIR}}/public/grafik" "{{.PAKET}}/public/grafik"
