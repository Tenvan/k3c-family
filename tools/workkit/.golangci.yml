# Grenzen aus docs/arbeitsweise.md › Komplexitäts-Budget, wie im Hauptmodul (.golangci.yml im Repo).
# Dateilänge und Verschachtelung prüfen tests/projectRules.test.ts und engine/internal/rules/nesting_test.go.
version: "2"

linters:
  enable:
    - funlen
    - gocyclo
    - depguard
  settings:
    funlen:
      lines: 60
      statements: -1
    gocyclo:
      min-complexity: 15
    depguard:
      # WZ63: workkit ist der gemeinsame Code von Workbench und Studio und hängt von keinem der beiden ab.
      rules:
        workkit-ohne-werkzeuge:
          deny:
            - pkg: k3c/tools/k3c-workbench
              desc: "workkit importiert die Workbench nicht (WZ63); Workbench-Teile hängen sich über mcpkit.Options ein"
            - pkg: k3c/tools/k3c-studio
              desc: "workkit importiert das Studio nicht (WZ63)"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]
