# Namespace `rust`: Rust-Workspace rust/ (Projekt RSU, Umstieg von Go auf Rust nach G0, B-1014). Workspace, Crates und
# Port-Leitfaden: docs/standards/rust-port.md. Das Spiel: `rust:game:exe`, `:build`, `:run`, `:dev` (RU35); Paket nach PAKET.
version: '3'

vars:
  # Paketordner des Rust-Spiels (RU35.2 stellt auf dist/k3c-game um)
  PAKET: '{{.ROOT_DIR}}/dist/k3c-rust'

tasks:
  build:
    desc: Rust-Workspace bauen (cargo build --workspace)
    dir: rust
    cmds:
      - cargo build --workspace

  test:
    desc: "Rust-Tests des Workspace (cargo test --workspace); Filter: task rust:test -- -p k3c-sim"
    dir: rust
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  lint:
    desc: Rust-Lint (cargo clippy mit -D warnings, alle Ziele)
    dir: rust
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Rust formatieren (cargo fmt --all)
    dir: rust
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Rust-Format prüfen, ohne zu schreiben (cargo fmt --all --check)
    dir: rust
    cmds:
      - cargo fmt --all --check

  # run: startet das Spiel (Hauptmenü, Neues Spiel). Arbeitsordner ist die Repo-Wurzel, damit public/grafik, public/schrift
  # und native/k3c-rig/assets gefunden werden. gen:paper rendert die Grafik, die nicht eingecheckt ist (B-737); es arbeitet
  # nur bei geänderten Quellen. Schalter des Spiels hinter `--`, z. B. `task rust:run -- --saves saves-test`.
  run:
    desc: "Rust-Spiel starten (Release): Hauptmenü, Neues Spiel; rendert die Grafik bei Bedarf (gen:paper); Schalter: task rust:run -- --players 1"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: :gen:paper
      - cargo run --release --manifest-path rust/Cargo.toml -p k3c-game -- {{.CLI_ARGS}}

  # game:*: das Spiel als EXE-Projekt (RU35.1): exe (Release-EXE), build (EXE, Grafik, Paket nach PAKET), run (Paket bauen
  # und starten), dev (Debug-Bau, Start aus der Repo-Wurzel). Kopiert wird mit cmd/sync (nur Geändertes, Ordner
  # zusammengeführt; der Umzug des Werkzeugs gehört zu RU37). Das Rust-Spiel lädt ganz public/grafik (kein --assets-Filter)
  # und die Rig-Teile relativ (native/k3c-rig/assets, DEFAULT_RIG_DIR).
  game:exe:
    desc: "Nur die Release-EXE des Rust-Spiels bauen (cargo build --release -p k3c-game) nach rust/target/release/"
    dir: '{{.ROOT_DIR}}/rust'
    sources:
      - crates/**/*.rs
      - crates/**/Cargo.toml
      - Cargo.lock
    generates:
      - target/release/k3c-game.exe
    cmds:
      - cargo build --release -p k3c-game

  game:build:
    desc: "Rust-Spiel bauen: Release-EXE, Papierschnitt-Grafik (gen:paper) und das Paket (EXE, data, Grafik, Ton, Schrift, Rig-Teile) in den Paketordner (nur Geändertes wird kopiert; laufendes Spiel dort vorher schließen)"
    deps: [game:exe, ':gen:paper', ':tmp']
    cmds:
      - task: game:dist

  game:dist:
    internal: true
    dir: '{{.ROOT_DIR}}'
    env:
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p "{{.PAKET}}"
      - |
        set -e
        p="{{.PAKET}}"
        if [ ! -d public/grafik ]; then echo "❌ public/grafik fehlt: erst task gen:paper"; exit 1; fi
        args="{{.ROOT_DIR}}/rust/target/release/k3c-game.exe=$p/k3c-game.exe {{.ROOT_DIR}}/data=$p/data {{.ROOT_DIR}}/public/grafik=$p/public/grafik {{.ROOT_DIR}}/native/k3c-rig/assets=$p/native/k3c-rig/assets {{.ROOT_DIR}}/public/audio=$p/public/audio"
        if [ -d public/schrift ]; then args="$args {{.ROOT_DIR}}/public/schrift=$p/public/schrift"; fi
        cd native/k3c-game && go run ./cmd/sync $args
        # Spieldaten ohne Go-Quellen und Doku, wie im Go-Paket
        rm -f "$p"/data/*.go "$p"/data/*.md
      - 'echo "✅ Rust-Spiel in {{.PAKET}} (Start: k3c-game.exe; LIZENZEN.txt fehlt noch, Paket nicht weitergebbar)"'

  game:run:
    desc: "Rust-Spiel bauen (game:build) und aus dem Paket-Ordner starten; Schalter: task rust:game:run -- --players 1"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: game:build
      - 'cd "{{.PAKET}}" && ./k3c-game.exe {{.CLI_ARGS}}'

  game:dev:
    desc: "Rust-Spiel im Debug-Bau starten (Arbeitsordner Repo-Wurzel, findet data/ und Grafik direkt); kein Neustart bei Änderungen (cargo-watch wäre ein neues Werkzeug, engine/devrun kennt nur Go)"
    dir: '{{.ROOT_DIR}}'
    deps: [':gen:paper']
    cmds:
      - cargo build --manifest-path rust/Cargo.toml -p k3c-game
      - '"{{.ROOT_DIR}}/rust/target/debug/k3c-game.exe" {{.CLI_ARGS}}'
