# Rust-Kern von K3C (Entscheidung 006, Projekt RST): Cargo-Workspace. Befehle nur über `task rust:*` (rust/Taskfile.yml).
[workspace]
resolver = "3"
members = ["k3c-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort" # ein Panic darf nie über die C-ABI zurück nach Go laufen
