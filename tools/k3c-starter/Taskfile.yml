# Namespace `k3c-starter`: der Windows-Starter für den Server (Wails-Fenster startet bin/k3c-server, B-041).
# Die Oberfläche (React auf Radix Themes, frontend/) steckt gebaut in der EXE (go:embed frontend/dist).
# Entwicklung ohne Fenster-Neubau (Client/Server): `dev` startet zwei Prozesse. `dev:server` ist der Starter mit -dev
# (engine/devrun): baut ihn bei jeder Go-Änderung neu und führt ihn als `-headless` aus (Server starten, Starter-API auf
# 127.0.0.1:K3C_STARTER_API_PORT, Standard 8194, api.go). `dev:ui` ist Vite (Port 5194, Hot Reload, leitet /api an die
# Starter-API weiter). Die Oberfläche im Browser: http://localhost:5194/ (`?mock=1` zeigt erfundene Daten).
# `window` ist das echte Wails-Fenster (`wails dev`) und belegt denselben Vite-Port wie `dev:ui`, beides nicht zusammen.
version: '3'

vars:
  STARTER: '{{.ROOT_DIR}}/tools/k3c-starter'

tasks:
  dev:
    desc: "Client/Server-Entwicklung: Starter ohne Fenster (dev:server, Neubau bei Go-Änderungen) und Oberfläche mit Hot Reload (dev:ui); startet bin/k3c-server, der muss gebaut sein (task k3c-server:build)"
    deps: [dev:server, dev:ui]

  dev:server:
    desc: "Starter als -headless unter devrun: bei jeder Go-Änderung in tools/k3c-starter neu bauen und starten, Starter-API auf Port 8194 (K3C_STARTER_API_PORT)"
    deps: [':tmp', dist]
    cmds:
      # je API-Port eine eigene Supervisor-EXE (und Kind-EXE, dev.go): parallele Dev-Läufe stören sich nicht
      - cd {{.STARTER}} && go build -o build/bin/k3c-starter-dev-{{.K3C_STARTER_API_PORT | default "8194"}}{{exeExt}} .
      - '{{.STARTER}}/build/bin/k3c-starter-dev-{{.K3C_STARTER_API_PORT | default "8194"}}{{exeExt}} -dev'

  dist:
    internal: true
    desc: Stellt nur sicher, dass frontend/dist für go:embed existiert (Platzhalter; die Oberfläche liefert im Entwicklungsmodus Vite, kein Bauen nötig)
    dir: '{{.STARTER}}/frontend'
    status:
      - test -f dist/index.html
    cmds:
      - mkdir -p dist
      - echo '<!doctype html><title>K3C Server</title>' > dist/index.html
      - touch dist/.placeholder

  dev:ui:
    desc: "Oberfläche des Starters mit Hot Reload (Vite, Port 5194); /api geht an die Starter-API (K3C_STARTER_API, Standard http://127.0.0.1:8194)"
    dir: '{{.STARTER}}/frontend'
    cmds:
      - bunx vite

  window:
    desc: "Echtes Wails-Fenster im Entwicklungsmodus (wails dev, Neubau bei Go-Änderungen); nicht zusammen mit dev:ui (derselbe Vite-Port)"
    deps: [':tmp']
    dir: '{{.STARTER}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    cmds:
      - wails dev

  default:
    desc: Kurzform von k3c-starter:dev
    cmds:
      - task: dev

  frontend:
    desc: Oberfläche des Starters bauen (go:embed braucht frontend/dist; nur bei geänderten Quellen)
    dir: '{{.STARTER}}/frontend'
    cmds:
      - bunx tsc --noEmit
      - bunx vite build
    status:
      - test ! -f dist/.placeholder # Platzhalter aus dist: immer echt bauen, nie in die EXE
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - tsconfig.json
      - paths.ts
      - ../../webkit/**/*
    generates:
      - dist/**/*

  exe:
    desc: Nur die EXE bin/k3c-starter bauen (Wails; nur bei geänderten Quellen, `--force` erzwingt; laufenden Starter vorher schließen, sonst scheitert die Kopie)
    deps: [':tmp', frontend]
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    sources:
      - tools/k3c-starter/*.go
      - tools/k3c-starter/frontend/src/**/*
      - tools/k3c-starter/frontend/index.html
      - tools/k3c-starter/frontend/package.json
      - tools/k3c-starter/frontend/vite.config.ts
      - tools/k3c-starter/frontend/paths.ts
      - tools/webkit/**/*
      - tools/k3c-starter/go.mod
      - tools/k3c-starter/go.sum
      - tools/k3c-starter/wails.json
      - tools/k3c-starter/build/appicon.png
      - tools/k3c-starter/build/windows/**/*
      - exclude: '**/*_test.go'
    generates:
      - bin/k3c-starter{{exeExt}}
    cmds:
      - cd {{.STARTER}} && wails build -s
      - mkdir -p bin
      - cp {{.STARTER}}/build/bin/k3c-starter{{exeExt}} bin/k3c-starter{{exeExt}}

  build:
    desc: Windows-Starter bauen, feste EXE bin/k3c-starter (dazu bin/k3c-server und dist/; laufenden Starter vorher schließen, sonst scheitert die Kopie; B-041)
    deps: [':tmp', ':build']
    cmds:
      - task: :k3c-server:build
      - task: exe

  test:
    desc: Windows-Starter testen (Frontend mit Vitest, go test; B-041)
    cmds:
      - task: vitest
      - task: gotest

  vitest:
    desc: Oberfläche des Starters testen (Vitest; check:diff nur bei Änderungen am Frontend, B-619)
    deps: [frontend]
    cmds:
      - cd {{.STARTER}}/frontend && bunx vitest run --config vitest.config.ts

  gotest:
    desc: go test für den Windows-Starter (GO_TEST_FLAGS=-short lässt lange Tests aus, B-619)
    deps: [':tmp', frontend]
    cmds:
      - cd {{.STARTER}} && go test {{.GO_TEST_FLAGS}} ./...

  lint:
    desc: golangci-lint für den Windows-Starter
    deps: [':tmp', frontend]
    cmds:
      - cd {{.STARTER}} && golangci-lint run
