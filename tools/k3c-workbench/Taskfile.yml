# Namespace `k3c-workbench`: die Workbench (Tauri-Fenster, MCP-Server, React-Oberfläche in frontend/). Backend in Rust:
# rust/tools/crates/k3c-workbench (Entscheidung 014).
# `dev` ist der Client-Server-Betrieb: `k3c-workbench --headless` (MCP-Server und Oberflächen-API ohne Fenster) per
# `cargo run`, dazu Vite mit Hot Reload der Oberfläche im Browser (http://localhost:5191) und Proxy /api. Rust-Änderungen
# brauchen einen Neustart. Der MCP-Port im dev ist DEV_MCP_PORT (5190), damit die laufende Workbench (5180) unberührt
# bleibt. `window` ist der Weg im Fenster (`tauri dev`).
version: '3'

vars:
  DEV: '{{.ROOT_DIR}}/tools/k3c-workbench'
  DEV_MCP_PORT: '5190'
  DEV_UI_API_PORT: '8191'

tasks:
  dev:
    desc: "Workbench im Client-Server-Betrieb: Rust-Backend ohne Fenster, Oberfläche mit Hot Reload unter http://localhost:5191"
    deps: [dev:server, dev:ui]

  dev:server:
    desc: "Backend ohne Fenster (cargo run, --headless): MCP auf DEV_MCP_PORT, Oberflächen-API auf DEV_UI_API_PORT; Rust-Änderungen brauchen einen Neustart"
    deps: [':tmp']
    dir: '{{.ROOT_DIR}}/rust/tools'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
      K3C_DEV_PORT: '{{.DEV_MCP_PORT}}'
      # leer = data/ der Wurzel; dev:worktree setzt data/ des Worktrees (Worktree-Wellen)
      K3C_DATA_DIR: '{{.DEV_DATA_DIR}}'
      K3C_DEV_UI_API_PORT: '{{.DEV_UI_API_PORT}}'
    cmds:
      - cargo run -p k3c-workbench -- --headless

  dev:worktree:
    desc: "Eigene Dev-Instanz im Worktree (Worktree-Wellen): Ports aus dem Pfad (MCP 6001-6399, API 8601-8999, Vite 7001-7399), nie 5180/5190/5191; aus dem Worktree starten"
    vars:
      # Versatz 1..399 aus den Zeichen des Worktree-Pfads (nur Shell-Builtins, im Runner fehlen tr/grep/cksum; printf %d "'c" gibt dort 0).
      # Zeichen außerhalb von abc (Umlaute, Sonderzeichen) zählen mit eigenem Gewicht, damit sich solche Pfade unterscheiden.
      WT_SLOT:
        sh: |
          p="{{.ROOT_DIR}}"; abc='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/:-_. '; s=0; i=0
          while [ "$i" -lt "${#p}" ]; do
            c="${p:$i:1}"; rest="${abc%%"$c"*}"; w=${#rest}
            if [ "$w" -eq "${#abc}" ]; then w=$((i * 7 + 101)); fi
            s=$((s + w * (i + 1)))
            i=$((i + 1))
          done
          echo $((s % 399 + 1))
      WT_MCP_PORT: '{{add 6000 (int .WT_SLOT)}}'
      WT_API_PORT: '{{add 8600 (int .WT_SLOT)}}'
      WT_UI_PORT: '{{add 7000 (int .WT_SLOT)}}'
    deps:
      - task: dev:worktree:info
        vars: {WT_MCP_PORT: '{{.WT_MCP_PORT}}', WT_API_PORT: '{{.WT_API_PORT}}', WT_UI_PORT: '{{.WT_UI_PORT}}'}
      - task: dev:server
        vars: {DEV_MCP_PORT: '{{.WT_MCP_PORT}}', DEV_UI_API_PORT: '{{.WT_API_PORT}}', DEV_DATA_DIR: '{{.ROOT_DIR}}/data'}
      - task: dev:ui
        vars: {DEV_UI_API_PORT: '{{.WT_API_PORT}}', DEV_UI_PORT: '{{.WT_UI_PORT}}'}

  dev:worktree:info:
    internal: true
    silent: true
    cmds:
      - echo "🚀 Dev-Workbench dieses Checkouts {{.ROOT_DIR}}"
      - echo "   K3C_DEV_PORT={{.WT_MCP_PORT}} (MCP, .mcp.json nutzt ihn), K3C_DEV_UI_API_PORT={{.WT_API_PORT}}, Vite http://localhost:{{.WT_UI_PORT}}"
      - echo "   MCP-Tools mit checkout=<Worktree> gegen http://127.0.0.1:{{.WT_MCP_PORT}}/mcp; die Wurzel-Workbench (5180) bleibt unberührt"

  dev:ui:
    desc: Oberfläche mit Vite gegen das Backend von dev:server (Proxy /api); öffnet sie im Standard-Browser
    dir: '{{.DEV}}/frontend'
    env:
      K3C_DEV_API: 'http://127.0.0.1:{{.DEV_UI_API_PORT}}'
      K3C_DEV_UI_PORT: '{{.DEV_UI_PORT | default "5191"}}'
    cmds:
      # --open nur hier, nicht in vite.config.ts: die Vorschau im Browser-Pane (launch.json, `bun run dev`) öffnet nichts
      - bunx vite --open

  window:
    desc: "Workbench als Fenster im Entwicklungsmodus (tauri dev): Vite 5191 mit Hot Reload, Neubau bei Rust-Änderungen; MCP 5180, laufende Workbench vorher schließen"
    deps: [':tmp']
    dir: '{{.ROOT_DIR}}/rust/tools/crates/k3c-workbench'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
    cmds:
      - task: ':tools-rust:cli'
      - bunx tauri dev

  default:
    desc: Kurzform von k3c-workbench:dev
    cmds:
      - task: dev

  frontend:
    desc: Frontend von k3c-workbench bauen (Typecheck und vite build nach frontend/dist; nur bei geänderten Quellen)
    dir: '{{.DEV}}/frontend'
    cmds:
      - bunx tsc --noEmit
      - bunx vite build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - paths.ts
      - ../../webkit/**/*
    generates:
      - dist/**/*

  test:
    desc: k3c-workbench testen (Frontend mit Vitest, cargo test -p k3c-workbench)
    deps: [':tmp', frontend]
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
      K3C_TMP: '{{.ROOT_DIR}}/.work/tmp'
    cmds:
      - task: vitest
      - cd '{{.ROOT_DIR}}/rust/tools' && cargo test -p k3c-workbench

  vitest:
    desc: Frontend von k3c-workbench testen (Vitest; check:diff nur bei Änderungen am Frontend, B-619)
    deps: [frontend]
    dir: '{{.DEV}}/frontend'
    cmds:
      - bunx vitest run --config vitest.config.ts {{.VITEST_ARGS}}

  lint:
    desc: cargo clippy für k3c-workbench mit -D warnings, alle Ziele
    deps: [':tmp', frontend]
    dir: '{{.ROOT_DIR}}/rust/tools'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
      K3C_TMP: '{{.ROOT_DIR}}/.work/tmp'
    cmds:
      - cargo clippy -p k3c-workbench --all-targets -- -D warnings

  build:
    desc: "EXE von k3c-workbench bauen, feste EXE bin/k3c-workbench (cargo build --release, Frontend eingebettet; nur bei geänderten Quellen, `--force` erzwingt; laufende Workbench vorher schließen, sonst scheitert die Kopie)"
    deps: [':tmp', frontend]
    dir: '{{.ROOT_DIR}}'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
    sources:
      - rust/rust-toolchain.toml
      - rust/tools/Cargo.toml
      - rust/tools/Cargo.lock
      - rust/tools/crates/k3c-workbench/**/*
      - rust/tools/crates/k3c-kit/**/*
      - rust/tools/crates/k3c-assetkit/**/*
      - tools/k3c-workbench/frontend/src/**/*
      - tools/k3c-workbench/frontend/index.html
      - tools/k3c-workbench/frontend/package.json
      - tools/k3c-workbench/frontend/vite.config.ts
      - tools/k3c-workbench/frontend/paths.ts
      - tools/webkit/**/*
      # von tauri-build erzeugt bzw. nur Tests
      - exclude: 'rust/tools/crates/*/gen/**/*'
      - exclude: 'rust/tools/crates/*/tests/**/*'
      - exclude: 'rust/tools/crates/**/*_tests.rs'
    generates:
      - rust/tools/target/release/k3c-workbench{{exeExt}}
      - bin/k3c-workbench{{exeExt}}
    cmds:
      - cd rust/tools && cargo build --release -p k3c-workbench --features custom-protocol
      - mkdir -p bin
      - cp rust/tools/target/release/k3c-workbench{{exeExt}} bin/k3c-workbench{{exeExt}}

  run:
    desc: EXE von k3c-workbench bauen (nur bei geänderten Quellen) und starten
    deps: [build]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bin/k3c-workbench{{exeExt}}
