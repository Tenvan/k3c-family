# Namespace `balance`: der Balancing-Tester k3c-balance (tools/k3c-workbench/internal/balance, feste EXE bin/k3c-balance).
# Autonome Läufe starten Agenten nur über `sim_test` der Workbench (CLAUDE.md); die Tasks hier sind der Handweg.
version: '3'

vars:
  DEV: '{{.ROOT_DIR}}/tools/k3c-workbench'

tasks:
  build:
    desc: EXE bin/k3c-balance bauen
    deps: [':tmp']
    dir: '{{.DEV}}'
    cmds:
      - go build -o ../../bin/k3c-balance{{exeExt}} ./internal/balance/cmd

  targets:
    desc: 'Zielkorridore prüfen: 100 feste Seeds, Bericht reports/balance-<Zeit>.json und .md, Vergleich mit testdata/balance/baseline.json (z. B. `task balance -- --seeds 10`; kein Teil von `task check`)'
    cmds:
      - task: build
      - ./bin/k3c-balance{{exeExt}} --targets --baseline testdata/balance/baseline.json --replay-dir reports/balance-replays {{.CLI_ARGS}}

  baseline:
    desc: 'Baseline neu schreiben (testdata/balance/baseline.json); nur mit Begründung im Commit, wie bei Golden-Dateien'
    cmds:
      - task: build
      - ./bin/k3c-balance{{exeExt}} --targets --write-baseline --baseline testdata/balance/baseline.json {{.CLI_ARGS}}

  sensitivity:
    desc: 'Sensitivität und Grad-Kurven: Werte aus data/ um ±10/±25 % nur im Speicher ändern, gekippte Ziele und Kurven je Grad nach reports/sensitivity-<Zeit>.json und .md (z. B. `task balance:sensitivity -- --seeds 10 --vary economy.json:purse.startGold`; kein Teil von `task check`)'
    cmds:
      - task: build
      - ./bin/k3c-balance{{exeExt}} --sensitivity --curves {{.CLI_ARGS}}

  run:
    desc: 'Balancing-Tester: Bots spielen eine Szenario-Matrix, Kennzahlen als JSON (z. B. `task balance:run -- --seeds 10 --bots saver --days 5`)'
    cmds:
      - task: build
      - ./bin/k3c-balance{{exeExt}} {{.CLI_ARGS}}

  default:
    desc: Kurzform von balance:targets
    cmds:
      - task: targets
