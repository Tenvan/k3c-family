# Namespace `native`: Bevy-Prototyp (Projekt NAT, Sprint NV1, B-776) und zum Vergleich der Ebitengine-Prototyp.
# Bevy: eigenes Cargo-Projekt unter native/k3c-proto, exakt gepinnt, Bau nur mit --locked. Ebitengine: eigenes Go-Modul
# unter native/k3c-ebiten (nicht Teil des Moduls `k3c`), Version in go.mod festgelegt, ohne cgo.
# Grafik kommt aus public/grafik (vorher `task gen:paper`); die Figuren des Ebitengine-Levels zeichnet er seit NV3.3 aus den
# Rig-Teilen unter native/k3c-rig/assets (Pakete rig und paint per replace eingebunden, `--art sheet` wie vorher).
# Rig-Prototyp (Sprint NV2, B-778): eigenes Go-Modul unter native/k3c-rig; seine Teil-Bilder und Rig-Dateien sind eingecheckt
# (native/k3c-rig/assets, `rig:export` schreibt sie neu), Bauen und Starten braucht keinen Gen-Lauf.
# Natives Spiel (Sprint NG1, B-792): eigenes Go-Modul unter native/k3c-game (`game:build`, `game`), ohne cgo.
version: '3'

vars:
  PROTO: '{{.ROOT_DIR}}/native/k3c-proto'
  EXE: '{{.ROOT_DIR}}/native/k3c-proto/target/release/k3c-proto.exe'
  EBITEN: '{{.ROOT_DIR}}/native/k3c-ebiten'
  EBITEN_EXE: '{{.ROOT_DIR}}/native/k3c-ebiten/bin/k3c-ebiten.exe'
  MEASURE: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/native/measure.ps1"'
  PAKET: '{{.ROOT_DIR}}/.work/native-proto'
  # Rig-Prototyp (Sprint NV2, B-778): eigenes Go-Modul unter native/k3c-rig, Teile und Rig-Dateien eingecheckt in assets/
  RIG: '{{.ROOT_DIR}}/native/k3c-rig'
  RIG_EXE: '{{.ROOT_DIR}}/native/k3c-rig/bin/k3c-rig.exe'
  RIG_PAKET: '{{.ROOT_DIR}}/.work/native-rig'
  # Natives Spiel (Sprint NG1, B-792): eigenes Go-Modul unter native/k3c-game, bindet k3c und k3c-rig per replace ein
  GAME: '{{.ROOT_DIR}}/native/k3c-game'
  GAME_EXE: '{{.ROOT_DIR}}/native/k3c-game/bin/k3c-game.exe'

tasks:
  proto:build:
    desc: "Bevy-Prototyp bauen (Release, --locked) nach native/k3c-proto/target/release/"
    dir: '{{.PROTO}}'
    sources:
      - src/**/*.rs
      - Cargo.toml
      - Cargo.lock
    generates:
      - target/release/k3c-proto.exe
    cmds:
      - cargo build --release --locked

  proto:
    desc: "Bevy-Prototyp starten (Spieler 1: Pad 1 oder A/D, Spieler 2: Pad 2 oder ←/→)"
    deps: [proto:build]
    cmds:
      - '"{{.EXE}}" --root "{{.ROOT_DIR}}"'

  ebiten:build:
    desc: "Ebitengine-Prototyp bauen (Go, ohne cgo) nach native/k3c-ebiten/bin/"
    dir: '{{.EBITEN}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '*.go'
      - go.mod
      - go.sum
      # Pakete rig und paint aus dem Rig-Prototyp (replace in go.mod, NV3.3)
      - ../k3c-rig/rig/*.go
      - ../k3c-rig/paint/*.go
      - ../k3c-rig/go.mod
    generates:
      - bin/k3c-ebiten.exe
    cmds:
      - go build -o bin/k3c-ebiten.exe .

  ebiten:
    desc: "Ebitengine-Prototyp starten (Spieler 1: Pad 1 oder A/D, Spieler 2: Pad 2 oder ←/→)"
    deps: [ebiten:build]
    cmds:
      - '"{{.EBITEN_EXE}}" --root "{{.ROOT_DIR}}"'

  game:build:
    desc: "Natives Spiel bauen (Go, ohne cgo) nach native/k3c-game/bin/"
    dir: '{{.GAME}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      # Simulation und Balancing aus dem Wurzel-Modul (replace k3c => ../..), data per go:embed
      - ../../go.mod
      - ../../engine/sim/*.go
      - ../../engine/level/*.go
      - ../../engine/rng/*.go
      - ../../data/**/*
    generates:
      - bin/k3c-game.exe
    cmds:
      - go build -o bin/k3c-game.exe .

  game:
    desc: "Natives Spiel starten (Platzhalter; Menü: Enter, Spiel: A/D oder Pfeile, Esc Pause)"
    deps: [game:build]
    cmds:
      - '"{{.GAME_EXE}}"'

  measure:
    desc: "Bevy: FPS und Grafikspeicher messen (Lastfälle level und alle, Vulkan), Bericht nach reports/native-proto-*.json"
    deps: [proto:build]
    cmds:
      - '{{.MEASURE}} -Engine bevy'

  measure:ebiten:
    desc: "Ebitengine: FPS und Grafikspeicher messen (Lastfälle level und alle, DirectX 11), Bericht nach reports/native-proto-*.json"
    deps: [ebiten:build]
    cmds:
      - '{{.MEASURE}} -Engine ebiten'

  measure:beide:
    desc: "Beide Prototypen nacheinander messen, ein gemeinsamer Bericht nach reports/native-proto-*.json"
    deps: [proto:build, ebiten:build]
    cmds:
      - '{{.MEASURE}} -Engine beide'

  proto:paket:
    desc: "Paket für den Mini-PC nach .work/native-proto/ (beide EXE, Messskript, public/grafik); dort messen.cmd starten"
    deps: [proto:build, ebiten:build]
    cmds:
      - rm -rf "{{.PAKET}}"
      - mkdir -p "{{.PAKET}}/public"
      - cp "{{.EXE}}" "{{.EBITEN_EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.PAKET}}/"
      - cp -r "{{.ROOT_DIR}}/public/grafik" "{{.PAKET}}/public/grafik"
      # Rig-Figuren des Ebitengine-Levels (--art rig, Standard; NV3.3)
      - mkdir -p "{{.PAKET}}/native/k3c-rig"
      - cp -r "{{.RIG}}/assets" "{{.PAKET}}/native/k3c-rig/assets"

  rig:export:
    desc: "Rig-Prototyp: Teil-PNGs, Rig-Dateien, Elemente und Sollwerte nach native/k3c-rig/assets/ schreiben (eingecheckt; liest Specs und Stil nur)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun native/k3c-rig/export/export.ts

  rig:export:check:
    desc: "Rig-Prototyp: Export wiederholen und byte-genau mit native/k3c-rig/assets/ vergleichen (schreibt nichts)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun native/k3c-rig/export/export.ts --pruefen

  rig:test:
    desc: "Rig-Prototyp prüfen: gofmt, go vet, go test (Rig-Rechnung gegen die Sollwerte aus tools/paper)"
    dir: '{{.RIG}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    cmds:
      # gofmt ohne CR: Unter Windows (core.autocrlf=true) liegt der Arbeitsbaum mit CRLF vor, im Repo steht LF
      - 'bad=""; for f in $(find . -name "*.go"); do test -z "$(tr -d "\r" < "$f" | gofmt -l)" || bad="$bad $f"; done; test -z "$bad" || { echo "❌ gofmt:$bad"; exit 1; }'
      - go vet ./...
      - go test ./...

  rig:build:
    desc: "Rig-Prototyp bauen (Go, ohne cgo) nach native/k3c-rig/bin/"
    dir: '{{.RIG}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '*.go'
      - rig/*.go
      - paint/*.go
      - go.mod
      - go.sum
    generates:
      - bin/k3c-rig.exe
    cmds:
      - go build -o bin/k3c-rig.exe .

  rig:
    desc: "Rig-Prototyp starten: links Sheet, rechts Rig-Teile, zwei Monarchen (Tastatur oder je ein Gamepad; Tasten stehen im Fenster)"
    deps: [rig:build]
    cmds:
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}"'

  rig:shots:
    desc: "Rig-Prototyp: Screenshots aller Zustände nach reports/native-rig-shots/"
    deps: [rig:build]
    cmds:
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}" --shots "{{.ROOT_DIR}}/reports/native-rig-shots"'

  rig:vergleich:
    desc: "Rig-Prototyp: Bildvergleich Rig gegen Sheet (idle, lauf, trab) nach reports/native-rig-vergleich/ (Kennzahlen und Differenzbilder; braucht task gen:paper)"
    deps: [rig:build]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/reports/native-rig-vergleich"
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}" --vergleich "{{.ROOT_DIR}}/reports/native-rig-vergleich"'

  rig:measure:
    desc: "Rig-Prototyp messen: 2, 50 und 200 Reiter als Rig und aus dem Sheet (FPS, GPU-Speicher, RAM), Bericht nach reports/native-rig-*.json"
    deps: [rig:build]
    cmds:
      - '{{.MEASURE}} -Engine rig'

  rig:paket:
    desc: "Paket für den Mini-PC nach .work/native-rig/ (EXE, assets, Messskript, Sheets des Monarchen); dort k3c-rig.exe oder messen.cmd starten"
    deps: [rig:build]
    cmds:
      - rm -rf "{{.RIG_PAKET}}"
      - mkdir -p "{{.RIG_PAKET}}/public/grafik/figuren"
      - cp "{{.RIG_EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.RIG_PAKET}}/"
      - cp -r "{{.RIG}}/assets" "{{.RIG_PAKET}}/assets"
      - cp -r "{{.ROOT_DIR}}/public/grafik/figuren/monarch" "{{.RIG_PAKET}}/public/grafik/figuren/monarch"
