# Namespace `gen`: Generatoren, die Dateien im Repo erzeugen (deterministisch, feste EXEs in bin/).
version: '3'

tasks:
  atlas:
    desc: Figuren-Atlas nach public/atlas/ packen (aus data/sprites.json, deterministisch; feste EXE bin/atlas, B-163)
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    sources:
      - tools/atlas/*.go
      - data/sprites.json
      - public/sprites/**/*.png
    generates:
      - public/atlas/atlas.json
    cmds:
      - go build -o bin/atlas{{exeExt}} ./tools/atlas
      - ./bin/atlas{{exeExt}}

  gebaeude:
    desc: Gebäude-PNGs aus public/grafik/gebaeude/*.json rendern (16/32/64/128 px je Kachel, deterministisch; feste EXE bin/gebaeude, GEB1)
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    sources:
      - tools/buildings/*.go
      - public/grafik/gebaeude/*.json
      - exclude: public/grafik/gebaeude/index.json
    generates:
      - public/grafik/gebaeude/*.png
      - public/grafik/gebaeude/index.json
    cmds:
      - go build -o bin/gebaeude{{exeExt}} ./tools/buildings
      - ./bin/gebaeude{{exeExt}}

  pipeline:
    desc: Grafiken aus docs/assets/pipeline-liste.json auf DB32 und 16 px umrechnen (public/grafik → public/grafik-db32, deterministisch; feste EXE bin/pipeline, B-331)
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    sources:
      - tools/pipeline/*.go
      - docs/assets/pipeline-liste.json
      - public/grafik/**/*.png
    generates:
      - public/grafik-db32/**/*.png
    cmds:
      - go build -o bin/pipeline{{exeExt}} ./tools/pipeline
      - ./bin/pipeline{{exeExt}}

  rules:
    desc: "Regeltabelle Hub-Stufe → Gebäude (docs/rules/materialien-gebaeude.md § 3) aus data/hub.json erzeugen (deterministisch; feste EXE bin/regeltabelle, WZ15.2, B-462)"
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    cmds:
      - go build -o bin/regeltabelle{{exeExt}} ./tools/ruletable
      - ./bin/regeltabelle{{exeExt}}

  soundatlas:
    desc: Sound-Atlas public/audio/atlas.{ogg,mp3,json} aus den Effekt-Slots in data/assets.json packen (erste Präferenz je Slot, ffmpeg; feste EXE bin/soundatlas, SO6.2, B-494)
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
      - sh: command -v ffmpeg
        msg: ffmpeg fehlt (requirements.md)
    sources:
      - tools/soundatlas/*.go
      - data/assets.json
    generates:
      - public/audio/atlas.json
    cmds:
      - go build -o bin/soundatlas{{exeExt}} ./tools/soundatlas
      - ./bin/soundatlas{{exeExt}}
