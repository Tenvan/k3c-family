# Release: Tag v* (z.B. v0.2.0) → Build als Zip und k3c-server für Windows, Linux amd64 und arm64 am GitHub-Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: k3c-server bauen (Windows, Linux amd64, Linux arm64)
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"               -o "k3c-server-${os}-${arch}${ext}" ./cmd/k3c-server
          done
      - name: Paket schnüren (dist + Server)
        run: zip -r "k3c-${GITHUB_REF_NAME}.zip" dist server package.json README.md
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "k3c-${GITHUB_REF_NAME}.zip" k3c-server-* --generate-notes --title "K3C $GITHUB_REF_NAME"
