# Einstieg für alle Aufgaben: `task --list` (Voraussetzung: Go Task, requirements.md).
# Die Werkzeuge laufen direkt (npx, go, wails); package.json hält nur noch Abhängigkeiten.
#
# Aufbau: Dieses Taskfile hält die Kernbefehle ohne Namensraum (Workspace) und die Prüf-Aggregate `check:*`.
# Alles andere liegt als eigenes Taskfile im Ordner des Projekts und erscheint hier unter dem Namen des Projekts
# (die Workbench gruppiert nach dem Namensraum vor dem Doppelpunkt):
#
#   go           engine/Taskfile.yml            go test, Lint, Race, Abdeckung, Golden-Dateien
#   k3c-server   cmd/k3c-server/Taskfile.yml    Spielserver: build, run, dev (devrun, -dev)
#   k3c-load     cmd/k3c-load/Taskfile.yml      Lasttest
#   k3c-tui      cmd/k3c-tui/Taskfile.yml       Diagnose-Oberfläche
#   k3c-workbench      tools/k3c-workbench/Taskfile.yml     Workbench: dev (Client/Server), window (wails dev), build, frontend, test, lint
#   k3c-studio   tools/k3c-studio/Taskfile.yml  Asset-Studio: dev (Client/Server), window (wails dev), build, frontend, test, lint
#   k3c-starter  tools/k3c-starter/Taskfile.yml Windows-Starter: dev (Client/Server), window (wails dev), build, test, lint
#   balance      tools/k3c-workbench/internal/balance/Taskfile.yml  Balancing-Tester
#   gen          tools/Taskfile.yml             Generatoren: Atlas, Gebäude, Regeltabelle
#   ops          scripts/Taskfile.yml           Betrieb: Aufräumen, Spielstände sichern
#
# Gruppen dieses Taskfiles (in dieser Reihenfolge): Einrichten (install) · Client (dev, lint, typecheck, test) · Bauen und Ausliefern
# (build, buildall, pages) · Spielserver (start, serve) · Prüfen (check, check:go, check:race, check:diff, check:dev, check:studio,
# check:starter, check:all).
#
# Jedes EXE-Projekt kennt dieselben Verben: `build` (EXE bauen), `run` (bauen und starten), `dev` (Backend mit `-dev` baut und startet sich
# bei jeder Go-Änderung selbst neu, engine/devrun; Wails-Apps zeigen die Oberfläche über Vite im Browser). Der Name des Projekts allein (`task k3c-workbench`) startet `dev`.
version: '3'

# Go-Build-Temp (go-build, Test-EXEs) und Wails-Bindings-EXE liegen fest im Projekt statt in %TEMP%:
# Nur so reicht EINE Norton-Ausnahme für `.work/` (Ordner legt `task install` an).
env:
  GOTMPDIR: '{{.ROOT_DIR}}/.work/tmp'
  TMP: '{{.ROOT_DIR}}/.work/tmp'
  TEMP: '{{.ROOT_DIR}}/.work/tmp'

includes:
  go: engine/Taskfile.yml
  k3c-server: cmd/k3c-server/Taskfile.yml
  k3c-load: cmd/k3c-load/Taskfile.yml
  k3c-tui: cmd/k3c-tui/Taskfile.yml
  k3c-workbench: tools/k3c-workbench/Taskfile.yml
  k3c-studio: tools/k3c-studio/Taskfile.yml
  k3c-starter: tools/k3c-starter/Taskfile.yml
  balance: tools/k3c-workbench/internal/balance/Taskfile.yml
  gen: tools/Taskfile.yml
  ops: scripts/Taskfile.yml

tasks:
  # Legt das feste Temp-Verzeichnis an (GOTMPDIR muss existieren, auch in der CI und in frischen Klonen ohne `task install`).
  # Die Taskfiles der Projekte rufen es als `:tmp` auf.
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.ROOT_DIR}}/.work/tmp'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  # --- Einrichten ---------------------------------------------------------------------------------------------------

  install:
    desc: Abhängigkeiten holen (Client, Frontends von k3c-workbench, Asset-Studio und Starter)
    cmds:
      - mkdir -p .work/tmp
      - npm ci
      - npm ci --prefix tools/k3c-workbench/frontend
      - npm ci --prefix tools/k3c-studio/frontend
      - npm ci --prefix tools/k3c-starter/frontend

  # --- Client (Phaser, Vite): entwickeln und prüfen -----------------------------------------------------------------

  dev:
    desc: Dev-Server (LAN, Port 5183); /api und /ws gehen an den Go-Server (Port 8080, `task start`)
    deps: [gen:atlas]
    cmds:
      - npx vite --host {{.CLI_ARGS}}

  preview:
    desc: Produktions-Build lokal ansehen
    cmds:
      - npx vite preview --host

  lint:
    desc: Oxlint
    cmds:
      - npx oxlint

  typecheck:
    desc: tsc für Client und Tests
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tests

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`)
    cmds:
      - npx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - npx vitest

  # --- Bauen und Ausliefern -----------------------------------------------------------------------------------------
  # `build` ist der Web-Build (dist/), `buildall` baut dazu alle EXE nach bin/, `pages` die statische Präsentationsseite.

  build:
    desc: Atlas, Typecheck und Produktions-Build nach dist/
    deps: [gen:atlas]
    cmds:
      - npx tsc --noEmit
      - npx vite build

  buildall:
    desc: Alle EXE bauen und nach bin/ legen (Spielserver, Lasttest, TUI, Workbench, Asset-Studio, Starter samt Web-Build dist/); laufende EXE vorher schließen, sonst scheitert die Kopie
    cmds:
      - task: k3c-workbench:build
      - task: k3c-studio:build
      - task: k3c-server:build
      - task: k3c-load:build
      - task: k3c-tui:build
      - task: k3c-starter:build

  pages:
    desc: GitHub-Pages-Seite nach _site/ (kopiert nur site/, kein Build, B-507; danach z. B. `npx vite preview --outDir _site`)
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r site/. _site/

  # --- Spielserver --------------------------------------------------------------------------------------------------

  start:
    desc: Go-Server ohne Web-Build (feste EXE bin/k3c-server, damit die Firewall-Freigabe bleibt, B-085); Kurzform von k3c-server:run
    cmds:
      - task: k3c-server:run

  serve:
    desc: Build und Go-Server (Port 8080)
    deps: [build]
    cmds:
      - task: start

  # --- Prüfen: ein Name je Projekt, `check` ist der Client -----------------------------------------------------------

  check:
    desc: Lint, Typecheck, Tests des Clients parallel (vor jedem Abschluss)
    deps: [lint, typecheck, test]

  check:go:
    desc: Go-Tests und golangci-lint (nacheinander wegen Wanduhr-Tests, B-284; Race-Detector getrennt in check:race, B-518)
    cmds:
      - task: go:test
      - task: go:lint

  check:race:
    desc: Go-Race-Detector für engine/ (langsam; nur Review-Session, check:all und CI, B-518)
    cmds:
      - task: go:race

  check:diff:
    desc: Nur die Prüfungen, die der Diff zu origin/develop braucht (samt ungespeicherter Änderungen; vor jedem Commit, B-518)
    cmds:
      - cmd: |
          # Nur sh und git: check_run startet task ohne Git-Bash-PATH (kein sort, awk, grep).
          base=$(git merge-base origin/develop HEAD)
          g=; d=; s=; p=
          for f in $(git diff --name-only "$base"; git ls-files --others --exclude-standard); do
            case "$f" in
              engine/*|data/*|go.mod|go.sum) g=1; d=1; s=1; p=1 ;;
              cmd/*|testdata/*|.golangci*|tools/atlas/*|tools/buildings/*|tools/cleanup/*|tools/ruletable/*|Taskfile.yml|.github/*) g=1 ;;
              tools/webkit/*) d=1; s=1; p=1 ;;
              tools/assetkit/*) d=1; s=1 ;;
              tools/k3c-workbench/*) d=1 ;;
              tools/k3c-studio/*) s=1 ;;
              tools/k3c-starter/*) p=1 ;;
            esac
          done
          # check (19 s) immer: Repo-Regeln scannen auch Go, Protokoll-Testdaten und Wails-Frontends.
          run="check"
          [ -z "$g" ] || run="$run check:go"
          [ -z "$d" ] || run="$run check:dev"
          [ -z "$s" ] || run="$run check:studio"
          [ -z "$p" ] || run="$run check:starter"
          echo "🚦 check:diff → $run"
          for t in $run; do task "$t" || exit 1; done

  check:dev:
    desc: k3c-workbench prüfen (Frontend mit Vitest, go test, golangci-lint)
    cmds:
      - task: k3c-workbench:frontend
      - task: k3c-workbench:test
      - task: k3c-workbench:lint

  check:studio:
    desc: Asset-Studio prüfen (Frontend-Vitest; go test und golangci-lint für die Asset-Logik und das Modul tools/k3c-studio samt Backend; B-459, B-507)
    cmds:
      - task: k3c-studio:frontend
      - task: k3c-studio:test
      - task: k3c-studio:lint

  check:starter:
    desc: Windows-Starter prüfen (Frontend-Vitest, go test, golangci-lint; B-041)
    cmds:
      - task: k3c-starter:test
      - task: k3c-starter:lint

  check:all:
    desc: Alles prüfen (Client, Go, k3c-workbench, Asset-Studio, Starter, Build)
    cmds:
      - task: check
      - task: build
      - task: check:go
      - task: check:race
      - task: check:dev
      - task: check:studio
      - task: check:starter
