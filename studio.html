<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3C Asset-Studio</title>
    <style>
      :root { --bg: #11151c; --text: #e8edf4; --dim: #8a97aa; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.4 system-ui, sans-serif; }
      #note { padding: max(4.75rem, 70px) 2rem 2rem; max-width: 60rem; margin: 0 auto; color: var(--dim); }
      iframe { position: fixed; inset: 60px 0 0 0; width: 100%; height: calc(100% - 60px); border: 0; background: var(--bg); }
    </style>
  </head>
  <body>
    <p id="note"></p>
    <script type="module" src="/src/tools/studioPage.ts"></script>
  </body>
</html>
