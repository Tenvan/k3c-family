# Einstieg für alle Aufgaben: `task --list` (Voraussetzung: Go Task, requirements.md).
# Die Werkzeuge laufen direkt (npx, go, wails); package.json hält nur noch Abhängigkeiten.
#
# Aufbau: Dieses Taskfile hält die Kernbefehle ohne Namensraum (Workspace) und die Prüf-Aggregate `check:*`.
# Alles andere liegt als eigenes Taskfile im Ordner des Projekts und erscheint hier unter dem Namen des Projekts
# (die Workbench gruppiert nach dem Namensraum vor dem Doppelpunkt):
#
#   go           engine/Taskfile.yml            go test, Lint, Race, Abdeckung, Golden-Dateien
#   k3c-server   cmd/k3c-server/Taskfile.yml    Spielserver: build, run, dev (Watcher)
#   k3c-load     cmd/k3c-load/Taskfile.yml      Lasttest
#   k3c-tui      cmd/k3c-tui/Taskfile.yml       Diagnose-Oberfläche
#   k3c-dev      tools/k3c-dev/Taskfile.yml     Workbench: dev (wails dev), build, frontend, test, lint
#   k3c-studio   tools/k3c-studio/Taskfile.yml  Asset-Studio: dev (wails dev), build, frontend, test, lint
#   k3c-starter  tools/k3c-starter/Taskfile.yml Windows-Starter: dev (Watcher), build, test, lint
#   balance      tools/k3c-dev/internal/balance/Taskfile.yml  Balancing-Tester
#   gen          tools/Taskfile.yml             Generatoren: Atlas, Gebäude, Regeltabelle
#   ops          scripts/Taskfile.yml           Betrieb: Aufräumen, Spielstände sichern
#   watch        tools/watch/Taskfile.yml       k3c-watch, der Watcher der Tasks `<projekt>:dev`
#
# Jedes EXE-Projekt kennt dieselben Verben: `build` (EXE bauen), `run` (bauen und starten), `dev` (bei jeder Änderung
# neu bauen und starten, ohne das Terminal zu verlassen). Der Name des Projekts allein (`task k3c-dev`) startet `dev`.
version: '3'

# Go-Build-Temp (go-build, Test-EXEs) und Wails-Bindings-EXE liegen fest im Projekt statt in %TEMP%:
# Nur so reicht EINE Norton-Ausnahme für `.work/` (Ordner legt `task install` an).
env:
  GOTMPDIR: '{{.ROOT_DIR}}/.work/tmp'
  TMP: '{{.ROOT_DIR}}/.work/tmp'
  TEMP: '{{.ROOT_DIR}}/.work/tmp'

includes:
  go: engine/Taskfile.yml
  k3c-server: cmd/k3c-server/Taskfile.yml
  k3c-load: cmd/k3c-load/Taskfile.yml
  k3c-tui: cmd/k3c-tui/Taskfile.yml
  k3c-dev: tools/k3c-dev/Taskfile.yml
  k3c-studio: tools/k3c-studio/Taskfile.yml
  k3c-starter: tools/k3c-starter/Taskfile.yml
  balance: tools/k3c-dev/internal/balance/Taskfile.yml
  gen: tools/Taskfile.yml
  ops: scripts/Taskfile.yml
  watch: tools/watch/Taskfile.yml

tasks:
  # Legt das feste Temp-Verzeichnis an (GOTMPDIR muss existieren, auch in der CI und in frischen Klonen ohne `task install`).
  # Die Taskfiles der Projekte rufen es als `:tmp` auf.
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.ROOT_DIR}}/.work/tmp'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  # --- Einrichten ---------------------------------------------------------------------------------------------------

  install:
    desc: Abhängigkeiten holen (Client, Frontends von k3c-dev und Asset-Studio)
    cmds:
      - mkdir -p .work/tmp
      - npm ci
      - npm ci --prefix tools/k3c-dev/frontend
      - npm ci --prefix tools/k3c-studio/frontend

  # --- Client (Phaser, Vite) ----------------------------------------------------------------------------------------

  dev:
    desc: Dev-Server (LAN, Port 5183); /api und /ws gehen an den Go-Server (Port 8080, `task start`)
    deps: [gen:atlas]
    cmds:
      - npx vite --host {{.CLI_ARGS}}

  preview:
    desc: Produktions-Build lokal ansehen
    cmds:
      - npx vite preview --host

  lint:
    desc: Oxlint
    cmds:
      - npx oxlint

  typecheck:
    desc: tsc für Client und Tests
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tests

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`)
    cmds:
      - npx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - npx vitest

  build:
    desc: Atlas, Typecheck und Produktions-Build nach dist/ (dazu die Oberfläche des Asset-Studios nach dist/studio/)
    deps: [gen:atlas]
    cmds:
      - npx tsc --noEmit
      - npx vite build
      - task: k3c-studio:frontend

  pages:
    desc: GitHub-Pages-Seite nach _site/ (Präsentation site/ + Build unter app/; danach z. B. `npx vite preview --outDir _site`)
    deps: [build]
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r dist _site/app
      - cp -r site/. _site/

  # --- Spielserver --------------------------------------------------------------------------------------------------

  start:
    desc: Go-Server ohne Web-Build (feste EXE bin/k3c-server, damit die Firewall-Freigabe bleibt, B-085); Kurzform von k3c-server:run
    cmds:
      - task: k3c-server:run

  serve:
    desc: Build und Go-Server (Port 8080)
    deps: [build]
    cmds:
      - task: start

  # --- Prüfen: ein Name je Projekt, `check` ist der Client -----------------------------------------------------------

  check:
    desc: Lint, Typecheck, Tests des Clients (vor jedem Abschluss)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  check:go:
    desc: Go-Tests, Race-Detector (falls möglich) und golangci-lint
    cmds:
      - task: go:test
      - task: go:race
      - task: go:lint

  check:dev:
    desc: k3c-dev prüfen (Frontend mit Vitest, go test, golangci-lint)
    cmds:
      - task: k3c-dev:frontend
      - task: k3c-dev:test
      - task: k3c-dev:lint

  check:studio:
    desc: Asset-Studio-Frontend und gemeinsame Asset-Logik prüfen (Vitest, go test, golangci-lint; das Studio-Backend engine/studio prüft check:go; B-459)
    cmds:
      - task: k3c-studio:frontend
      - task: k3c-studio:test
      - task: k3c-studio:lint

  check:starter:
    desc: Windows-Starter prüfen (go test, golangci-lint; B-041)
    cmds:
      - task: k3c-starter:test
      - task: k3c-starter:lint

  check:all:
    desc: Alles prüfen (Client, Go, k3c-dev, Asset-Studio, Starter, Build)
    cmds:
      - task: check
      - task: build
      - task: check:go
      - task: check:dev
      - task: check:studio
      - task: check:starter
