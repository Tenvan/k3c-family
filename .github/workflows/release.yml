# Release: Tag v* (z.B. v0.2.0) → Build als Zip und k3c-server für Windows, Linux amd64 und arm64 am GitHub-Release,
# dazu das Docker-Image (amd64 + arm64) in ghcr.io für `docker compose pull` auf dem Raspberry Pi.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - run: task install
      # Vor Paket und Image: Typecheck und Tests (Client und Frontends, wie lokal task check); task test rendert vorher
      # die Papierschnitt-Grafik (gen:paper). Nach dem Pi-Test v0.22.0 wieder eingeschaltet (B-758).
      - run: task typecheck
      - run: task test
      - run: task build
      - name: k3c-server bauen (Windows, Linux amd64, Linux arm64)
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}"               -o "k3c-server-${os}-${arch}${ext}" ./cmd/k3c-server
          done
      - name: Paket schnüren (dist + Server)
        run: zip -r "k3c-${GITHUB_REF_NAME}.zip" dist README.md
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "k3c-${GITHUB_REF_NAME}.zip" k3c-server-* --generate-notes --title "K3C $GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker-Image bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/tenvan/k3c-family:${{ github.ref_name }}
            ghcr.io/tenvan/k3c-family:latest
