# CI: Lint, Typecheck, Tests, Build; Go: Tests (auch Heimnetz-Server), Lint, Cross-Build; k3c-dev: Frontend, Tests, Lint, Wails-Build (Windows). Bei jedem Push und Pull Request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Den Heimnetz-Server prüfen seit SP03 die Go-Tests (engine/net, httptest) im Job go (B-020).

      - uses: actions/upload-artifact@v7
        with:
          name: k3c-dist
          path: dist/
          retention-days: 14

  go:
    name: Go · Tests · Lint · Cross-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...

  k3c-dev:
    name: k3c-dev · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/k3c-dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-dev/go.mod
          cache-dependency-path: tools/k3c-dev/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/k3c-dev/frontend/package-lock.json
      # Der Typecheck des Frontends prüft auch die Tests; deren vitest kommt aus dem Hauptprojekt.
      - run: npm ci
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck).
      - run: npm ci && npm run build
        working-directory: tools/k3c-dev/frontend
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s
