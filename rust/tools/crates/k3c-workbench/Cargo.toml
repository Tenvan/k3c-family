[package]
name = "k3c-workbench"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Entwickler-Werkzeug von K3C: Tauri-Fenster, UI-API und MCP-Server (Port von tools/k3c-workbench, RU69)"
default-run = "k3c-workbench"

[lints]
workspace = true

[lib]
name = "k3c_workbench"

[[bin]]
name = "k3c-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
k3c-kit = { path = "../k3c-kit" }
tauri.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp.workspace = true
axum.workspace = true
# Uhr der Nutzungsstatistik (`k3c_kit::usage` verlangt `DateTime<Local>`).
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
reqwest.workspace = true
tempfile.workspace = true

[features]
# Release ohne Tauri-CLI: Frontend aus dist/ eingebettet statt devUrl.
custom-protocol = ["tauri/custom-protocol"]
