# Einstieg für alle Aufgaben: `task --list`. Voraussetzung: Go Task (requirements.md).
# Die Werkzeuge laufen direkt (npx, go, wails); package.json hält nur noch Abhängigkeiten.
version: '3'

vars:
  DEV: tools/k3c-dev

# Go-Build-Temp (go-build, Test-EXEs) und Wails-Bindings-EXE liegen fest im Projekt statt in %TEMP%:
# Nur so reicht EINE Norton-Ausnahme für `.work/` (Ordner legt `task install` an).
env:
  GOTMPDIR: '{{.ROOT_DIR}}/.work/tmp'
  TMP: '{{.ROOT_DIR}}/.work/tmp'
  TEMP: '{{.ROOT_DIR}}/.work/tmp'

tasks:
  # Legt das feste Temp-Verzeichnis an (GOTMPDIR muss existieren, auch in der CI und in frischen Klonen ohne `task install`).
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.ROOT_DIR}}/.work/tmp'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  install:
    desc: Abhängigkeiten holen (Client und Frontend von k3c-dev)
    cmds:
      - mkdir -p .work/tmp
      - npm ci
      - npm ci --prefix {{.DEV}}/frontend

  dev:
    desc: Dev-Server (LAN, Port 5173); /api und /ws gehen an den Go-Server (Port 8080, `task start`)
    deps: [atlas]
    cmds:
      - npx vite --host {{.CLI_ARGS}}

  preview:
    desc: Produktions-Build lokal ansehen
    cmds:
      - npx vite preview --host

  lint:
    desc: Oxlint
    cmds:
      - npx oxlint

  typecheck:
    desc: tsc für Client und Tests
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tests

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`)
    cmds:
      - npx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - npx vitest

  check:
    desc: Lint, Typecheck, Tests des Clients (vor jedem Abschluss)
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  atlas:
    desc: Figuren-Atlas nach public/atlas/ packen (aus data/sprites.json, deterministisch; feste EXE bin/atlas, B-163)
    deps: [tmp]
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    sources:
      - tools/atlas/*.go
      - data/sprites.json
      - public/sprites/**/*.png
    generates:
      - public/atlas/atlas.json
    cmds:
      - go build -o bin/atlas{{exeExt}} ./tools/atlas
      - ./bin/atlas{{exeExt}}

  build:
    desc: Atlas, Typecheck und Produktions-Build nach dist/
    deps: [atlas]
    cmds:
      - npx tsc --noEmit
      - npx vite build

  pages:
    desc: GitHub-Pages-Seite nach _site/ (Präsentation site/ + Build unter app/; danach z. B. `npx vite preview --outDir _site`)
    deps: [build]
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r dist _site/app
      - cp -r site/. _site/

  serve:
    desc: Build und Go-Server (Port 8080)
    deps: [build]
    cmds:
      - task: start

  start:
    desc: Go-Server ohne Web-Build (feste EXE bin/k3c-server, damit die Firewall-Freigabe bleibt, B-085)
    deps: [tmp]
    vars:
      VERSION: # steht in /api/health und auf der Landingpage
        sh: git describe --tags --always --dirty || echo dev
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o bin/k3c-server{{exeExt}} ./cmd/k3c-server
      - ./bin/k3c-server{{exeExt}}

  go:test:
    desc: go test ./...
    deps: [tmp]
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    cmds:
      - go test ./...

  saves:backup:
    desc: "Spielstände sichern (B-142): task saves:backup -- <ziel>; Quelle K3C_SAVES_DIR, sonst /data/saves im Compose-Dienst k3c"
    cmds:
      - sh scripts/backup-saves.sh {{.CLI_ARGS}}

  golden:update:
    desc: "testdata/golden/ aus dem Ist-Zustand neu schreiben (B-137): nur bei gewollter Regel- oder Wertänderung, Begründung in den Commit-Text, die Review-Session prüft den Diff; rng.json bleibt"
    deps: [tmp]
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    cmds:
      - go test -count=1 ./engine/sim ./engine/level -run Golden -update

  go:lint:
    desc: golangci-lint
    deps: [tmp]
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint fehlt (requirements.md)
    cmds:
      - golangci-lint run

  check:go:
    desc: Go-Tests, Race-Detector (falls möglich) und golangci-lint
    cmds:
      - task: go:test
      - task: check:race
      - task: go:lint

  check:race:
    desc: go test -race für engine/ (braucht cgo und einen C-Compiler; ohne Compiler nur ein Hinweis, B-077)
    deps: [tmp]
    cmds:
      - cmd: |
          if command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1; then
            CGO_ENABLED=1 go test -race ./engine/...
          else
            echo "check:race übersprungen: kein C-Compiler (gcc oder clang), siehe requirements.md. Die CI prüft -race."
          fi

  dev:frontend:
    desc: Frontend von k3c-dev bauen (go:embed braucht frontend/dist)
    dir: '{{.DEV}}/frontend'
    cmds:
      - npx tsc --noEmit
      - npx vite build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
    generates:
      - dist/**/*

  check:dev:
    desc: k3c-dev prüfen (Frontend, go test, golangci-lint)
    deps: [tmp, dev:frontend]
    dir: '{{.DEV}}'
    cmds:
      - go test ./...
      - golangci-lint run

  k3c-dev:
    desc: Entwickler-Werkzeug k3c-dev als Fenster starten (wails dev)
    deps: [tmp]
    dir: '{{.DEV}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    cmds:
      - wails dev

  load:
    desc: 'Lasttest gegen laufenden Server, Bericht nach reports/ (z. B. `task load -- -url http://pi-gaming:8080 -token … -rooms 2 -players 3 -duration night`; feste EXE bin/k3c-load, B-175)'
    deps: [tmp]
    cmds:
      - go build -o bin/k3c-load{{exeExt}} ./cmd/k3c-load
      - ./bin/k3c-load{{exeExt}} {{.CLI_ARGS}}

  balance:
    desc: 'Zielkorridore prüfen: 100 feste Seeds, Bericht reports/balance-<Zeit>.json und .md, Vergleich mit testdata/balance/baseline.json (z. B. `task balance -- --seeds 10`; kein Teil von `task check`)'
    deps: [tmp]
    cmds:
      - cd {{.DEV}} && go build -o ../../bin/k3c-balance{{exeExt}} ./internal/balance/cmd
      - ./bin/k3c-balance{{exeExt}} --targets --baseline testdata/balance/baseline.json --replay-dir reports/balance-replays {{.CLI_ARGS}}

  balance:baseline:
    desc: 'Baseline neu schreiben (testdata/balance/baseline.json); nur mit Begründung im Commit, wie bei Golden-Dateien'
    deps: [tmp]
    cmds:
      - cd {{.DEV}} && go build -o ../../bin/k3c-balance{{exeExt}} ./internal/balance/cmd
      - ./bin/k3c-balance{{exeExt}} --targets --write-baseline --baseline testdata/balance/baseline.json {{.CLI_ARGS}}

  balance:run:
    desc: 'Balancing-Tester: Bots spielen eine Szenario-Matrix, Kennzahlen als JSON (z. B. `task balance:run -- --seeds 10 --bots saver --days 5`)'
    deps: [tmp]
    cmds:
      - cd {{.DEV}} && go build -o ../../bin/k3c-balance{{exeExt}} ./internal/balance/cmd
      - ./bin/k3c-balance{{exeExt}} {{.CLI_ARGS}}

  k3c-dev:build:
    desc: EXE von k3c-dev bauen (wails build)
    deps: [tmp]
    dir: '{{.DEV}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    cmds:
      - wails build

  check:all:
    desc: Alles prüfen (Client, Go, k3c-dev, Build)
    cmds:
      - task: check
      - task: build
      - task: check:go
      - task: check:dev
