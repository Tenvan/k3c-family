<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="tex.pageTitle">K3C Textur-Grenze</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; --ok: #52b788; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 1.25rem/1.35 system-ui, sans-serif; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      /* Ein Screen (B-773): Seite = Viewport-Höhe, nur die Textfelder scrollen intern; unter 640x480 darf die Seite scrollen */
      body { overflow: hidden; }
      main { height: 100dvh; display: flex; flex-direction: column; padding: max(4.75rem, 56px) 1.25rem 1rem; max-width: 120rem; margin: 0 auto; }
      header { flex: none; margin-bottom: 0.75rem; }
      h1 { font-size: 1.9rem; margin: 0; }
      h2 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .sub { color: var(--dim); margin: 0.25rem 0 0; }
      .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
      .col { min-height: 0; display: flex; flex-direction: column; gap: 0.75rem; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.75rem 1rem; min-height: 0; display: flex; flex-direction: column; }
      section.grow { flex: 1; }
      button { font: inherit; font-size: 1rem; padding: 0.4rem 0.8rem; margin: 0 0.4rem 0.4rem 0; border-radius: 0.625rem; border: 2px solid var(--line); background: #26324a; color: var(--text); }
      button:focus-visible, button:hover { border-color: var(--on); outline: none; }
      button[aria-pressed="true"] { background: var(--on); color: #000; font-weight: 700; }
      button:disabled { opacity: 0.45; }
      dl { font-size: 0.85em; display: grid; grid-template-columns: max-content 1fr; gap: 2px 0.75rem; margin: 0; overflow: auto; min-height: 0; }
      dt { color: var(--dim); }
      dd { margin: 0; word-break: break-all; }
      pre { font: 0.9rem/1.3 ui-monospace, monospace; background: #0b0e13; border-radius: 8px; padding: 0.5rem; flex: 1; min-height: 3rem; overflow: auto; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      #stage { flex: 1; min-height: 0; display: flex; }
      #stage canvas { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; background: #000; display: block; }
      #result { font-weight: 700; color: var(--ok); margin: 0 0 0.5rem; }
      p { margin: 0; }
      @media (max-aspect-ratio: 1/1) { .cols { grid-template-columns: 1fr 1fr; } .col:last-child { grid-column: 1 / -1; flex-direction: row; } .col:last-child > section { flex: 1; } }
      @media (max-width: 639px), (max-height: 479px) { body { overflow: auto; } main { height: auto; min-height: 100dvh; } .cols { display: block; } .col { margin-bottom: 0.75rem; } section { margin-bottom: 0.75rem; } pre { max-height: 14rem; } #stage canvas { height: auto; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 data-t="tex.pageTitle">K3C Textur-Grenze</h1>
        <p class="sub" data-t="tex.sub">Misst ohne Spiel, wie viel Texturspeicher der Browser verträgt.</p>
      </header>
      <div class="cols">
        <div class="col">
          <section>
            <h2 data-t="tex.h.config">Textur-Größe</h2>
            <div id="sizes"></div>
            <div>
              <button id="btn-start" data-t="tex.btn.start">Messung starten</button>
              <button id="btn-send" data-t="tex.btn.send" disabled>Bericht an Server senden</button>
            </div>
            <p id="state" class="sub"></p>
            <p id="sent" class="sub"></p>
          </section>
          <section class="grow">
            <h2 data-t="tex.h.diag">WebGL-Diagnose</h2>
            <p id="diagResult" class="sub" style="margin-bottom:0.5rem"></p>
            <pre id="diag"></pre>
            <button id="btn-diag" data-t="tex.btn.diag" style="margin-top:0.5rem">Diagnose wiederholen</button>
          </section>
        </div>
        <div class="col">
          <section class="grow">
            <h2 data-t="tex.h.run">Lauf</h2>
            <p id="result"></p>
            <pre id="out"></pre>
          </section>
        </div>
        <div class="col">
          <section style="max-height:50%">
            <h2 data-t="tex.h.device">Gerät</h2>
            <dl id="device"></dl>
          </section>
          <section class="grow"><div id="stage"></div></section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/tools/textureTest.ts"></script>
  </body>
</html>
