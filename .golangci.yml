# Harte Grenzen aus docs/arbeitsweise.md › Komplexitäts-Budget und die Go-Schichtgrenzen.
# Die Dateilänge prüft tests/projectRules.test.ts (golangci-lint hat dafür keinen Linter, B-050).
# Die Verschachtelung prüft engine/internal/rules/nesting_test.go (go/ast), gezählt wie Oxlint max-depth; die Linter aus
# golangci-lint zählen for range bzw. else if anders (B-054, B-057).
version: "2"

linters:
  enable:
    - funlen
    - gocyclo
    - depguard
  settings:
    funlen:
      lines: 60
      statements: -1
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        # Seit RU41 hält engine/ nur conlog und devrun (Sim und Balancing in Rust); beide kennen die Werkzeuge nicht.
        engine-ohne-tools:
          files: ["**/engine/**"]
          deny:
            - pkg: k3c/tools
              desc: "engine/ importiert nichts aus tools/ (docs/arbeitsweise.md › Schichtgrenzen)"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]
