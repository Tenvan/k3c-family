# Grenzen aus docs/arbeitsweise.md › Komplexitäts-Budget, wie im Hauptmodul (.golangci.yml im Repo).
# Dateilänge und Verschachtelung prüfen tests/projectRules.test.ts und engine/internal/rules/nesting_test.go.
version: "2"

linters:
  enable:
    - funlen
    - gocyclo
    - depguard
  settings:
    depguard:
      # RU40.4: Die Workbench rechnet nicht mit der Engine (Läufe über die Spiel-EXE `k3c-game sim`);
      # engine/sim und engine/level nur für Typen. Spielstand-Raum und Netz gehören nicht in die Workbench, engine/devrun
      # nur in den Supervisor in der Wurzel des Pakets. Ausnahme internal/studioview („Im Spiel ansehen“ mit eingebundener Engine).
      rules:
        workbench-ohne-raum:
          files: ["$all", "!**/internal/studioview/**"]
          deny:
            - pkg: k3c/engine/room
              desc: "Räume nur über den Spielserver oder studioview (B-726, B-924)"
            - pkg: k3c/engine/net
              desc: "Protokoll nur über den laufenden Spielserver (B-726)"
            - pkg: k3c/engine/enginetools
              desc: "Engine-Aufrufe über die Spiel-EXE (k3c-game sim, RU40.4)"
            - pkg: k3c/engine/balance
              desc: "Balancing über k3c-game sim balance (RU40.4)"
        workbench-devrun-nur-wurzel:
          files: ["$all", "!**/tools/k3c-workbench/*.go"]
          deny:
            - pkg: k3c/engine/devrun
              desc: "engine/devrun nur im Supervisor in der Wurzel des Pakets (headless.go)"
    funlen:
      lines: 60
      statements: -1
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]
