# Namespace `k3c-studio`: das Asset-Studio als eigenes Fenster (Wails, ohne Spielserver; B-459).
# Die Oberfläche (frontend/) liegt nach `frontend` unter frontend/dist und wird von der EXE zur Laufzeit von der Platte
# geliefert, steckt also nicht in der EXE: eine Änderung an der Oberfläche braucht keinen Neubau der EXE.
# Entwicklung ohne Fenster-Neubau (Client/Server): `dev` startet zwei Prozesse. `dev:server` ist das Studio mit -dev
# (engine/devrun): baut es bei jeder Go-Änderung (tools/k3c-studio, tools/assetkit, tools/ruletable, engine/; nicht data/)
# neu und führt es als `-headless` aus (Backend auf 127.0.0.1:K3C_STUDIO_PORT, im dev 8192). `dev:ui` ist Vite (Port 5192,
# Hot Reload, leitet /api an das Backend weiter). Die Oberfläche im Browser: http://localhost:5192/ (`?mock=1` = erfundene Daten).
# `window` ist das echte Fenster (`wails dev`, Backend 8091, Seiten aus frontend/dist ohne Hot Reload): zum Prüfen des Fensters.
# Supervisor und Kind baut `go build` (Konsole), nicht `wails build`, damit das Kind sauber per CTRL_BREAK endet.
version: '3'

vars:
  STUDIO: '{{.ROOT_DIR}}/tools/k3c-studio'
  # Backend-Port im dev: K3C_STUDIO_PORT, sonst Vite-Port + 3000 (8192); k3c-dev verschiebt K3C_STUDIO_UI_PORT je Worktree,
  # damit landet ein Worktree-Studio nie auf dem Backend der Wurzel.
  DEV_PORT: '{{.K3C_STUDIO_PORT | default (add 3000 (.K3C_STUDIO_UI_PORT | default "5192" | atoi))}}'

tasks:
  dev:
    desc: "Client/Server-Entwicklung: Studio ohne Fenster (dev:server, Neubau bei Go-Änderungen) und Oberfläche mit Hot Reload (dev:ui, http://localhost:5192/)"
    deps: [dev:server, dev:ui]

  dev:server:
    desc: "Studio als -headless unter devrun: bei jeder Go-Änderung neu bauen und starten, Backend auf Port 8192 (K3C_STUDIO_PORT)"
    deps: [':tmp']
    env:
      K3C_STUDIO_PORT: '{{.DEV_PORT}}'
    cmds:
      - cd {{.STUDIO}} && go build -o build/bin/k3c-studio-dev{{exeExt}} .
      - '{{.STUDIO}}/build/bin/k3c-studio-dev{{exeExt}} -dev'

  dev:ui:
    desc: "Oberfläche des Studios mit Hot Reload (Vite, Port 5192); /api geht an das Backend (K3C_STUDIO_API, im dev http://127.0.0.1:8192)"
    dir: '{{.STUDIO}}/frontend'
    env:
      K3C_STUDIO_API: 'http://127.0.0.1:{{.DEV_PORT}}'
    cmds:
      - npx vite

  window:
    desc: "Echtes Fenster prüfen (wails dev, Backend 8091, Seiten aus frontend/dist ohne Hot Reload; Oberfläche entwickeln mit dev)"
    deps: [':tmp', frontend]
    dir: '{{.STUDIO}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    cmds:
      - wails dev

  default:
    desc: Kurzform von k3c-studio:dev
    cmds:
      - task: dev

  run:
    desc: Asset-Studio als Fenster starten, ohne Watcher (baut die EXE bei Bedarf; B-459)
    deps: [build]
    cmds:
      - ./bin/k3c-studio{{exeExt}}

  frontend:
    desc: Frontend des Asset-Studios nach tools/k3c-studio/frontend/dist/ bauen (das Fenster k3c-studio liefert es unter /studio/ aus, nicht der Spielserver; B-507; nur bei geänderten Quellen)
    dir: '{{.STUDIO}}/frontend'
    cmds:
      - npx tsc --noEmit
      - npx vite build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - paths.ts
      - ../../webkit/**/*
    generates:
      - dist/**/*

  build:
    desc: "EXE des Asset-Studios bauen, feste EXE bin/k3c-studio (Wails; nur bei geänderten Go-Quellen, `--force` erzwingt; laufendes Studio vorher schließen, sonst scheitert die Kopie; startet es nicht; B-459)"
    deps: [':tmp', frontend]
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    sources:
      - tools/k3c-studio/*.go
      - tools/k3c-studio/backend/**/*.go
      - tools/k3c-studio/go.mod
      - tools/k3c-studio/go.sum
      - tools/k3c-studio/wails.json
      - tools/k3c-studio/build/appicon.png
      - tools/k3c-studio/build/windows/**/*
      - tools/assetkit/**/*.go
      - tools/assetkit/go.mod
      - tools/ruletable/**/*.go
      - engine/**/*.go
      - data/**/*
      - go.mod
      - go.sum
      - exclude: '**/*_test.go'
    generates:
      - bin/k3c-studio{{exeExt}}
    cmds:
      - cd {{.STUDIO}} && wails build -s
      - mkdir -p bin
      - cp {{.STUDIO}}/build/bin/k3c-studio{{exeExt}} bin/k3c-studio{{exeExt}}

  test:
    desc: Asset-Studio-Frontend und gemeinsame Asset-Logik testen (Vitest, go test; das Backend tools/k3c-studio/backend gehört zum Studio-Modul; B-459, B-507)
    deps: [':tmp', frontend]
    cmds:
      - npx vitest run --config {{.STUDIO}}/frontend/vitest.config.ts
      - cd tools/assetkit && go test ./...
      - cd {{.STUDIO}} && go test ./...

  lint:
    desc: golangci-lint für das Asset-Studio und tools/assetkit
    deps: [':tmp', frontend]
    cmds:
      - cd tools/assetkit && golangci-lint run
      - cd {{.STUDIO}} && golangci-lint run
