# CD: Stand von main auf GitHub Pages: Präsentationsseite site/ (B-183) als Startseite, darunter unter app/ der Build
# mit allem, was ohne Server geht (Testseiten; Spiel-Kacheln erklärt, B-032).
# Einmalig aktivieren: Repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      - run: npm ci
      - run: task test
      - run: task pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
