# Namespace `k3c-studio`: Werkzeug für Game- und Level-Designer (WZ63): Welten, Assets, Hub (Tauri-Fenster, React-Oberfläche
# in frontend/) und der MCP-Server k3c-studio (Vorgabe-Port 5181, K3C_STUDIO_PORT). Backend in Rust:
# rust/tools/crates/k3c-studio (Entscheidung 014); `test`, `gotest` und `lint` prüfen bis RU71.4 noch die Go-Fassung.
# `dev` ist der Client-Server-Betrieb wie in der Workbench: `k3c-studio --headless` (MCP-Server und Oberflächen-API ohne
# Fenster) per `cargo run`, dazu Vite mit Hot Reload der Oberfläche im Browser (http://localhost:5193) und Proxy /api
# (DEV_UI_API_PORT 8193). Rust-Änderungen brauchen einen Neustart. Der MCP-Port im dev ist DEV_MCP_PORT (5182), damit das
# laufende Studio (5181) unberührt bleibt. Ports 5192, 8091 und 8182 gehörten dem alten Asset-Studio und bleiben frei.
# `window` ist der Weg im Fenster (`tauri dev`).
version: '3'

vars:
  STUDIO_DIR: '{{.ROOT_DIR}}/tools/k3c-studio'
  DEV_MCP_PORT: '5182'
  DEV_UI_API_PORT: '8193'
  DEV_UI_PORT: '5193'

tasks:
  default:
    desc: Kurzform von k3c-studio:dev
    cmds:
      - task: dev

  dev:
    desc: "Studio im Client-Server-Betrieb: Rust-Backend ohne Fenster, Oberfläche mit Hot Reload unter http://localhost:5193"
    deps: [dev:server, dev:ui]

  dev:server:
    desc: "Backend ohne Fenster (cargo run, --headless): MCP auf DEV_MCP_PORT (5182), Oberflächen-API auf DEV_UI_API_PORT (8193); Rust-Änderungen brauchen einen Neustart"
    deps: [':tmp']
    dir: '{{.ROOT_DIR}}/rust/tools'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
      K3C_STUDIO_PORT: '{{.DEV_MCP_PORT}}'
      K3C_STUDIO_UI_API_PORT: '{{.DEV_UI_API_PORT}}'
    cmds:
      - cargo run -p k3c-studio -- --headless

  dev:ui:
    desc: Oberfläche mit Vite gegen das Backend von dev:server (Proxy /api); öffnet sie im Standard-Browser
    dir: '{{.STUDIO_DIR}}/frontend'
    env:
      K3C_STUDIO_API: 'http://127.0.0.1:{{.DEV_UI_API_PORT}}'
      K3C_STUDIO_UI_PORT: '{{.DEV_UI_PORT}}'
    cmds:
      # --open nur hier, nicht in vite.config.ts: die Vorschau im Browser-Pane (launch.json) öffnet nichts
      - bunx vite --open

  window:
    desc: "Studio als Fenster im Entwicklungsmodus (tauri dev): Vite 5193 mit Hot Reload, Neubau bei Rust-Änderungen; MCP 5181, laufendes Studio vorher schließen"
    deps: [':tmp']
    dir: '{{.ROOT_DIR}}/rust/tools/crates/k3c-studio'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
    cmds:
      - task: ':tools-rust:cli'
      - bunx tauri dev

  frontend:
    desc: Frontend von k3c-studio bauen (Typecheck und vite build nach frontend/dist; nur bei geänderten Quellen)
    dir: '{{.STUDIO_DIR}}/frontend'
    cmds:
      - bunx tsc --noEmit
      - bunx vite build
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - paths.ts
      - ../../webkit/**/*
    generates:
      - dist/index.html

  typecheck:
    desc: Typecheck des Studio-Frontends (tsc --noEmit)
    dir: '{{.STUDIO_DIR}}/frontend'
    cmds:
      - bunx tsc --noEmit

  vitest:
    desc: Frontend von k3c-studio testen (Vitest; VITEST_ARGS filtert)
    deps: [frontend]
    dir: '{{.STUDIO_DIR}}/frontend'
    cmds:
      - bunx vitest run --config vitest.config.ts {{.VITEST_ARGS}}

  test:
    desc: k3c-studio testen (Frontend mit Typecheck und Vitest, go test)
    cmds:
      - task: vitest
      - task: gotest

  gotest:
    desc: go test für tools/k3c-studio (ohne Sim-Pakete, CHECK_SIM=1 nimmt sie mit; GO_TEST_FLAGS=-short lässt lange Tests aus)
    deps: [':tmp']
    dir: '{{.STUDIO_DIR}}'
    # Paketliste ohne Sim-Pakete (balance, simrun seit WZ63.5; Sperre, CHECK_SIM=1 nimmt sie mit, B-857) aus
    # tools/checkdiff › simDirs wie bei check:go; STUDIO_PKGS (CI) hat Vorrang. Scheitert die Liste, bricht der Lauf ab,
    # statt auf ./... zurückzufallen.
    vars:
      STUDIO_GO_PKGS:
        sh: cd "{{.ROOT_DIR}}" && go run ./tools/checkdiff -studiopkgs
    cmds:
      - go test {{.GO_TEST_FLAGS}} {{.STUDIO_PKGS | default .STUDIO_GO_PKGS | default "./paketliste-fehlt"}}

  lint:
    desc: golangci-lint für tools/k3c-studio (depguard sperrt Importe aus k3c-workbench)
    deps: [':tmp']
    dir: '{{.STUDIO_DIR}}'
    cmds:
      - golangci-lint run --allow-serial-runners

  build:
    desc: "EXE von k3c-studio bauen, feste EXE bin/k3c-studio (nur bei geänderten Quellen, `--force` erzwingt; laufendes Studio-Fenster vorher schließen, sonst scheitert die Kopie)"
    deps: [compile]
    dir: '{{.ROOT_DIR}}'
    sources:
      - rust/tools/target/release/k3c-studio{{exeExt}}
    generates:
      - bin/k3c-studio{{exeExt}}
    cmds:
      - mkdir -p bin
      - cp rust/tools/target/release/k3c-studio{{exeExt}} bin/k3c-studio{{exeExt}}

  build:headless:
    desc: "Eigene EXE für den Dienst ohne Fenster, bin/k3c-studio-headless (gleicher Bau wie build; so sperrt der laufende Dienst weder build noch buildall)"
    deps: [compile]
    dir: '{{.ROOT_DIR}}'
    sources:
      - rust/tools/target/release/k3c-studio{{exeExt}}
    generates:
      - bin/k3c-studio-headless{{exeExt}}
    cmds:
      - mkdir -p bin
      - cp rust/tools/target/release/k3c-studio{{exeExt}} bin/k3c-studio-headless{{exeExt}}

  compile:
    internal: true
    deps: [':tmp']
    dir: '{{.ROOT_DIR}}'
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/rust/tools/target'
    sources:
      - rust/rust-toolchain.toml
      - rust/tools/Cargo.toml
      - rust/tools/Cargo.lock
      - rust/tools/package.json
      - rust/tools/bun.lock
      - rust/tools/crates/k3c-studio/**/*
      - rust/tools/crates/k3c-kit/**/*
      - rust/tools/crates/k3c-assetkit/**/*
      - tools/k3c-studio/frontend/src/**/*
      - tools/k3c-studio/frontend/index.html
      - tools/k3c-studio/frontend/package.json
      - tools/k3c-studio/frontend/vite.config.ts
      - tools/k3c-studio/frontend/paths.ts
      - tools/webkit/**/*
      # von tauri-build erzeugt bzw. nur Tests
      - exclude: 'rust/tools/crates/*/gen/**/*'
      - exclude: 'rust/tools/crates/*/tests/**/*'
      - exclude: 'rust/tools/crates/**/*_tests.rs'
    generates:
      - rust/tools/target/release/k3c-studio{{exeExt}}
    cmds:
      - task: ':tools-rust:cli'
      # Das Frontend baut tauri selbst (beforeBuildCommand: task k3c-studio:frontend).
      - cd rust/tools/crates/k3c-studio && bunx tauri build --no-bundle

  run:
    desc: EXE von k3c-studio bauen (nur bei geänderten Quellen) und starten
    deps: [build]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bin/k3c-studio{{exeExt}}

  headless:
    desc: "Studio-Backend ohne Fenster starten (bin/k3c-studio-headless --headless): MCP-Server k3c-studio auf K3C_STUDIO_PORT (Vorgabe 5181), Oberflächen-API auf K3C_STUDIO_UI_API_PORT (Vorgabe 8193). Nach geänderten Quellen erst task k3c-studio:build, sonst baut der Start und reißt die 60-s-Frist des Dienstes"
    deps: [build:headless]
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bin/k3c-studio-headless{{exeExt}} --headless
