<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monarch-Rig</title>
<style>
  :root { --bg:#1b1a26; --panel:#252336; --fg:#e8e6f0; --mut:#9a97ad; --acc:#fbf236; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  .wrap { display:flex; flex-wrap:wrap; gap:16px; padding:16px; }
  .stage { flex:1 1 480px; background:#2b2a3d; border-radius:10px; padding:8px; }
  .stage svg { width:100%; height:auto; display:block; }
  .side { flex:0 1 340px; display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--panel); border-radius:10px; padding:12px; }
  h1 { font-size:16px; margin:0 0 8px; } h2 { font-size:13px; margin:0 0 8px; color:var(--mut); font-weight:600; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#3a3852; color:var(--fg); border:1px solid #4b4968; border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button.on { background:var(--acc); color:#222034; border-color:var(--acc); font-weight:600; }
  label { display:flex; align-items:center; gap:8px; margin-top:8px; color:var(--mut); }
  input[type=range] { flex:1; }
  canvas { background:repeating-conic-gradient(#33314a 0 25%, #2a2840 0 50%) 0 0/16px 16px; border-radius:4px; max-width:100%; }
  .pv { display:none; fill:#fbf236; }
  svg.showpv .pv { display:inline; }
  .hint { color:var(--mut); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" style="flex-basis:720px"><svg id="svg" viewBox="-120 -205 240 220" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="side">
    <div class="box">
      <h1>👑 Monarch-Rig</h1>
      <div class="btns" id="poses">
        <button data-p="idle" class="on">Idle</button><button data-p="walk">Lauf</button><button data-p="rideWalk">Schritt</button><button data-p="rideTrot">Trab</button><button data-p="ride">Galopp</button>
      </div>
      <label>Tempo <input id="speed" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label><input id="pv" type="checkbox"> Pivots zeigen</label>
      <label><input id="flip" type="checkbox"> Spiegeln (nach links)</label>
    </div>
    <div class="box">
      <h2>Spritesheet (8 Frames, aktuelle Pose)</h2>
      <label>Frame-Höhe <select id="ph"><option>128</option><option selected>256</option><option>512</option></select> px</label>
      <button id="sheet">Erzeugen</button> <a id="dl" style="color:var(--acc);display:none" download="monarch.png">PNG speichern</a>
      <div style="margin-top:8px"><canvas id="strip"></canvas></div>
    </div>
  </div>
</div>
<script>
const C = { o:'#222034', skin:'#eec39a', skinD:'#d9a066', hair:'#663931', gold:'#fbf236', goldD:'#d9a066',
  red:'#ac3232', redL:'#d95763', tun:'#5b6ee1', tunD:'#3f3f74', pant:'#847e87', pantD:'#595652',
  boot:'#45283c', belt:'#8f563b', horse:'#8f563b', horseD:'#663931', mane:'#45283c' };


// ---- Rig-Bausteine: jede Gruppe dreht um ihren Pivot (px,py), Kinder erben die Drehung ----
const part = (id, px, py, body, kids = '') =>
  `<g id="${id}" data-px="${px}" data-py="${py}">${body}${kids}<circle class="pv" cx="${px}" cy="${py}" r="2.2"/></g>`;

// ===== Styleguide (Papierschnitt) =====
// Keine Konturlinien: jede Fläche ist ein Stück Papier mit schmalem Schlagschatten (Filter ds, 0.5/0.9, Unschärfe 0.45).
// Schattierungen sind aufgeklebte Lagen mit noch kleinerem Schatten (ds2). Innenlinien nur als zarte Falz (Deckkraft ≤ 25 %).
// Papierstruktur: feines Rauschen über der ganzen Figur (Filter paper). Schatten auf den Hintergrund macht später die Engine.
// Licht: von vorn oben (rechts oben). Jedes Material hat genau drei Töne: Licht, Basis, Schatten.
// Proportionen Monarch: Kopf ≈ 1/3,5 der Höhe, Krone ≈ halbe Kopfhöhe, Hände und Füße leicht übergroß.
// Pferd: Rumpf ≈ 2 Kopflängen des Reiters hoch, Beine schlank mit betonten Gelenken.
const PAL = {
  line: '#2a1d2e',
  skin: ['#f8dcc0', '#efc29c', '#d49a74'], hair: ['#8a5a3c', '#6b4128', '#4a2b1a'], gold: ['#ffe36e', '#f2c33a', '#c48a1e'],
  royal: ['#8796f2', '#4f5fd0', '#33368f'], red: ['#e2574c', '#b8312f', '#7c1f2a'], ermine: ['#ffffff', '#ebe8f4', '#c9c4da'],
  leather: ['#a5683f', '#7d4a2b', '#55301d'], cloth: ['#aaa4b2', '#857f8e', '#625c6b'], horse: ['#cf8a52', '#a8622f', '#723f1d'],
  mane: ['#5a362a', '#3e241c', '#26150f'], hoof: '#3a2c2a', eye: '#3b2a20' };
C.o = PAL.line; C.red = PAL.red[1]; C.redL = PAL.red[0]; C.skin = PAL.skin[1];
const shade = (d, fill) => `<path d="${d}" fill="${fill}" stroke="none" filter="url(#ds2)"/>`;
const S = (d, fill, inner = '') => `<path d="${d}" fill="${fill}" filter="url(#ds)"/>${inner}`;
const L = (d, w = 0.9, col = PAL.line, op = 0.6) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity="${(op * 0.3).toFixed(2)}"/>`;
const dot = (x, y, r, f) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="none"/>`;
const ermineSpot = (x, y) => `<path d="M${x} ${y - 1.4}L${x + 0.8} ${y + 1.4}L${x - 0.8} ${y + 1.4}Z" fill="${PAL.line}" stroke="none"/>`;

// ---- Monarch ----
const leg = (s, far) => { const c = far ? [PAL.cloth[1], PAL.cloth[2], PAL.cloth[2]] : PAL.cloth, b = far ? [PAL.leather[1], PAL.leather[2], PAL.leather[2]] : PAL.leather;
  return part('thigh' + s, 0, -50,
    S('M-7 -55C-8 -45 -7 -35 -5 -27L5 -27C7 -35 8 -45 7 -55Z', c[1], shade('M-7 -55C-8 -45 -7 -35 -5 -27L-1.5 -27C-3 -36 -3.5 -46 -3 -55Z', c[2])
      + L('M4.5 -50C5.5 -42 5 -35 3.5 -29', 1.2, c[0], 0.9)),
    part('shin' + s, 0, -28,
      S('M-5.2 -31L5.2 -31L5.2 -24L-5.2 -24Z', c[1])
      + S('M-5.6 -24C-5.6 -17 -5.2 -11 -5.2 -6L-6.2 -1C-6.4 1 -5.2 1.6 -3 1.6L11 1.6C14 1.6 14.6 -1.6 12 -3.2L5.2 -6.2C5.2 -12 5.6 -18 5.6 -24Z', b[1],
          shade('M-5.6 -24C-5.6 -17 -5.2 -11 -5.2 -6L-6.2 -1C-6.4 1 -5.2 1.6 -3 1.6L0 1.6L-1.5 -6C-1.8 -12 -2 -18 -2 -24Z', b[2])
          + L('M3.8 -21C4 -15 4 -10 3.6 -7', 1.2, b[0], 0.9) + L('M-6 -0.2H12.8', 1.2))
      + S('M-6.6 -27L6.6 -27L6.1 -21.5L-6.1 -21.5Z', b[0], L('M-5 -23.5H5'))));
};
const arm = (s, far) => { const c = far ? [PAL.royal[1], PAL.royal[2], PAL.royal[2]] : PAL.royal, k = far ? [PAL.skin[2], PAL.skin[2], PAL.skin[2]] : PAL.skin;
  return part('upper' + s, 0, -84,
    S('M-6.2 -90C-8 -84 -6.5 -74 -4.6 -68L4.6 -68C6.5 -74 8 -84 6.2 -90C2 -93.5 -2 -93.5 -6.2 -90Z', c[1],
      shade('M-6.2 -90C-8 -84 -6.5 -74 -4.6 -68L-1 -68C-2.5 -75 -3.5 -84 -2.5 -92Z', c[2]) + L('M4 -87C5 -81 4.5 -75 3.2 -71', 1.3, c[0], 0.9)),
    part('fore' + s, 0, -70,
      S('M-4.9 -72.5C-4.7 -66 -4.1 -60 -3.9 -56L3.9 -56C4.1 -60 4.7 -66 4.9 -72.5Z', c[1], shade('M-4.9 -72.5C-4.7 -66 -4.1 -60 -3.9 -56L-1 -56L-1.3 -72.5Z', c[2]))
      + S('M-5.6 -58.5H5.6L5.2 -53.5H-5.2Z', PAL.ermine[0], shade('M-5.6 -58.5H-2L-2.2 -53.5H-5.2Z', PAL.ermine[2]) + ermineSpot(2, -56))
      + S('M-4.2 -53.8C-5.4 -50 -4.4 -45.8 0 -45.2C4.2 -45.6 5.4 -49 4.3 -53.8Z', k[1], shade('M-4.2 -53.8C-5.4 -50 -4.4 -45.8 0 -45.2L-1 -53.8Z', k[2]))
      + `<path d="M3.6 -52.2C6.6 -52.4 7 -49 4.4 -48" fill="${k[1]}"/>` + L('M-1.6 -49.5H2.2') + `<circle id="hand${s}" cx="0" cy="-50" r="0.1" fill="none" stroke="none"/>`));
};
// Umhang: Kette aus Punkten (Verlet), oben am Kragen verankert, Schwerkraft + Fahrtwind, als Band mit wachsender Breite gezeichnet.
const capeAnchor = `<circle id="capeAnchor" cx="-4" cy="-91" r="0.1" fill="none"/>`;
const CAPE_N = 8, CAPE_SEG = 7.6;
const cloth = {
  pts: null, time: 0,
  anchor() { const ride = $('ride'), el = $('capeAnchor'); return new DOMPoint(-4, -91).matrixTransform(ride.getCTM().inverse().multiply(el.getCTM())); },
  step(dt, st) {
    if (dt <= 0) return; const A = this.anchor(); this.time += dt;
    if (!this.pts) this.pts = Array.from({ length: CAPE_N }, (_, i) => ({ x: A.x - i * 1.5, y: A.y + i * CAPE_SEG, px: A.x - i * 1.5, py: A.y + i * CAPE_SEG }));
    // Seitenwind nur im Stand: langsam an- und abschwellende Böe (22..46 Einheiten/s, Galopp-Fahrtwind ≈ 240),
    // damit der Umhang sichtbar hinter der Figur weht. Kollisionsregeln unten bleiben unverändert.
    const gust = st.scroll ? 0 : 22 + 18 * (0.5 + 0.5 * Math.sin(this.time * 1.1)) + 6 * Math.sin(this.time * 2.9);
    const air = -(st.scroll || 0) * 0.8 - 8 - 6 * Math.sin(this.time * 1.7) - gust, floor = st.horse ? -103 : 0;
    for (let i = 1; i < CAPE_N; i++) { const p = this.pts[i], vx = (p.x - p.px) / dt, vy = (p.y - p.py) / dt;
      const ax = 2.4 * (air - vx), ay = 260 - 1.2 * vy, nx = p.x + (p.x - p.px) * 0.99 + ax * dt * dt, ny = p.y + (p.y - p.py) * 0.99 + ay * dt * dt;
      p.px = p.x; p.py = p.y; p.x = nx; p.y = ny; }
    for (let it = 0; it < 8; it++) { this.pts[0].x = A.x; this.pts[0].y = A.y;
      for (let i = 1; i < CAPE_N; i++) { const a = this.pts[i - 1], b = this.pts[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = (d - CAPE_SEG) / d;
        if (i > 1) { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; } else { b.x -= dx * k; b.y -= dy * k; }
        if (b.x > A.x + 2) b.x = A.x + 2; // nicht durch den Körper nach vorn
        if (b.y > floor) b.y = floor; } }
  },
  draw() {
    if (!this.pts) return; const P = this.pts, n = P.length, L = [], R = [], I = [];
    for (let i = 0; i < n; i++) { const a = P[Math.max(i - 1, 0)], b = P[Math.min(i + 1, n - 1)], tx = b.x - a.x, ty = b.y - a.y, d = Math.hypot(tx, ty) || 1;
      const nx = ty / d, ny = -tx / d, w = 4 + i * 1.9; // Normale zeigt nach "rechts" der Laufrichtung
      L.push([P[i].x - nx * w, P[i].y - ny * w]); R.push([P[i].x + nx * w * 0.6, P[i].y + ny * w * 0.6]); I.push([P[i].x - nx * w * 0.35, P[i].y - ny * w * 0.35]); }
    $('capeP').setAttribute('d', crPath(L) + crPath([...R].reverse(), true) + 'Z');
    $('capeIn').setAttribute('d', crPath(L.slice(2)) + crPath([...I.slice(2)].reverse(), true) + 'Z');
    $('capeHi').setAttribute('d', crPath(R.slice(1, -1).map(([x, y], i) => [x - (x - P[i + 1].x) * 0.35, y - (y - P[i + 1].y) * 0.35])));
    const l = L[n - 1], r = R[n - 1], l2 = L[n - 2], r2 = R[n - 2], m = (u, v, k) => [u[0] + (v[0] - u[0]) * k, u[1] + (v[1] - u[1]) * k];
    const a = m(l, l2, 0.45), b = m(r, r2, 0.45);
    $('capeHem').setAttribute('d', `M${l[0]} ${l[1]}L${r[0]} ${r[1]}L${b[0]} ${b[1]}L${a[0]} ${a[1]}Z`);
  },
};
// Catmull-Rom durch Punkte als kubische Bézier-Kurven (cont = an vorhandenen Pfad anschließen)
function crPath(pts, cont = false) {
  const f = v => v.toFixed(2); let d = (cont ? 'L' : 'M') + f(pts[0][0]) + ' ' + f(pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`; }
  return d;
}
let trim = ''; for (let x = -15; x <= 15; x += 5) trim += `<path d="M${x} -42.6L${x + 1.6} -41L${x} -39.4L${x - 1.6} -41Z" fill="${PAL.red[1]}" stroke="none"/>`;
const sword = S('M-9 -53L-25 -29.5L-22 -27.5L-6 -51Z', PAL.leather[2], L('M-11 -49L-20 -35', 0.9, PAL.leather[0], 0.8))
  + S('M-24.5 -30L-26 -26.5L-22.5 -26L-21.5 -28Z', PAL.gold[1]) + S('M-12 -58L-4.5 -50.5L-3.5 -51.5L-11 -59Z', PAL.gold[1]) + dot(-6.8, -55.8, 1.6, PAL.gold[2]);
const torso = S('M-12 -91C-15 -80 -16 -60 -16 -43L16 -43C16 -59 15 -78 12 -91C4 -94.5 -4 -94.5 -12 -91Z', PAL.royal[1],
    shade('M-12 -91C-15 -80 -16 -60 -16 -43L-5 -43C-6 -60 -6 -78 -4 -93Z', PAL.royal[2]) + shade('M8 -89C11 -78 12.5 -62 13 -46L14.6 -46C14.5 -62 13.6 -78 11 -90Z', PAL.royal[0])
    + `<path d="M3 -89V-58" stroke="${PAL.gold[1]}" stroke-width="2.4"/>` + dot(3, -80, 1.1, PAL.gold[2]) + dot(3, -70, 1.1, PAL.gold[2]))
  + S('M-17 -44H17L18.5 -38H-18.5Z', PAL.gold[1], shade('M-17 -44H-6L-6 -38H-18.5Z', PAL.gold[2]) + trim)
  + S('M-15.5 -58.5H15.5V-53H-15.5Z', PAL.leather[1], shade('M-15.5 -55.2H15.5V-53H-15.5Z', PAL.leather[2]))
  + S('M2.5 -60H9.5V-51.5H2.5Z', PAL.gold[1], S('M4.6 -58H7.4V-53.5H4.6Z', PAL.leather[2]))
  + S('M-15.5 -93C-6 -99 6 -99 15.5 -92.5C14.5 -84 6 -82 0 -83C-8 -82 -14.5 -84 -15.5 -88.5Z', PAL.ermine[0],
      shade('M-15.5 -93C-12 -95 -8 -96.5 -5 -97C-6 -91 -6 -86 -6 -82.6C-11 -83 -14.5 -84.5 -15.5 -88.5Z', PAL.ermine[2])
      + ermineSpot(-9, -88) + ermineSpot(-2, -86.5) + ermineSpot(5, -88) + ermineSpot(11, -88.5) + ermineSpot(1, -93));
const head = part('head', 0, -90,
  S('M-4.5 -98H5.5V-89H-4.5Z', PAL.skin[2])
  + S('M-12 -104C-13 -116 -6 -123 3 -122.5C12 -122 17 -115 17.2 -107.5C17.4 -100 13 -95 6 -94.2C-2 -93.5 -11 -97 -12 -104Z', PAL.skin[1],
      shade('M-12 -104C-13 -116 -6 -123 3 -122.5C-2 -118 -4 -110 -2 -95C-7 -96 -11 -99 -12 -104Z', PAL.skin[2])
      + shade('M10 -119C14 -116 16 -112 16.4 -108C14.6 -110 12.8 -114 10 -119Z', PAL.skin[0]))
  + S('M-12 -104.5C-15.5 -112 -12.5 -121 -3.5 -123.5C3.5 -125 10 -123 13.5 -119.5C6.5 -118.5 0.5 -116.5 -3.5 -112.5C-6 -108.5 -6 -103 -4 -99C-8 -99 -11 -101 -12 -104.5Z', PAL.hair[1],
      shade('M-12 -104.5C-15.5 -112 -12.5 -121 -3.5 -123.5C-7 -118 -8 -110 -6.5 -101C-9 -101 -11 -102 -12 -104.5Z', PAL.hair[2])
      + L('M-8 -118C-6 -114 -5 -110 -5 -106', 0.9, PAL.hair[0], 0.9) + L('M-2 -121C0 -119 2 -118.5 6 -118.5', 0.9, PAL.hair[0], 0.9))
  + S('M-6 -106.5C-9 -107.5 -9.5 -101.5 -6 -101.5Z', PAL.skin[1], L('M-7.2 -105.2C-6.4 -104.4 -6.4 -103.4 -7.2 -102.6'))
  + S('M-4.5 -100C-2 -94.5 2 -89.5 8 -86.8C12.5 -85.6 16.5 -88.8 17.4 -94C17.8 -97 17.2 -99.4 16 -100.4C14 -98.4 10 -97.4 6 -98.4C2 -99.4 -1.5 -100.4 -4.5 -100Z', PAL.hair[1],
      shade('M-4.5 -100C-2 -94.5 2 -89.5 8 -86.8C4 -90 1.5 -94 0.5 -99.4C-1.5 -100 -3 -100.2 -4.5 -100Z', PAL.hair[2])
      + L('M5 -96C6 -93 7.5 -90.5 9.5 -88.5', 0.9, PAL.hair[0], 0.9) + L('M10.5 -96.5C11.5 -94 12.5 -92 14 -90.5', 0.9, PAL.hair[0], 0.9))
  + S('M7.5 -101C10.5 -103.8 14 -103.4 16 -101.6C18 -103.4 20.2 -102.4 20.8 -100.2C18.4 -99 16.4 -99.4 15.2 -100.6C13 -99 10 -98.8 7.5 -101Z', PAL.hair[1])
  + S('M14.6 -109.5C17.2 -106.4 19 -104.2 17.6 -102.4C16.6 -101.6 15.2 -102 14.4 -102.8Z', PAL.skin[1], shade('M14.6 -103.4C15.4 -102.6 16.4 -102.2 17.4 -102.6L17 -103.6Z', PAL.skin[2]))
  + `<path d="M6.8 -111C8.8 -113.4 12.2 -113.6 13.8 -110.8C11.8 -109.2 8.8 -109 6.8 -111Z" fill="#ffffff" stroke-width="0.9"/>`
  + dot(10.9, -111, 1.5, PAL.eye) + dot(11.4, -111.5, 0.5, '#ffffff')
  + L('M6.6 -111.2C8.8 -113.8 12.4 -114 14 -111', 1.5, PAL.line, 1) + L('M5.8 -115.8C8.8 -117.4 12 -117 14.4 -115.2', 2, PAL.hair[2], 1)
  + dot(11.5, -105.5, 2.6, PAL.red[0]).replace('stroke="none"', 'stroke="none" opacity="0.35"'),
  part('crown', 2, -120,
    S('M-6.5 -122C-6 -131.5 10 -131.5 10.5 -122Z', PAL.red[1], shade('M-6.5 -122C-6 -128 -2 -131 2 -131.5C-1 -128 -2 -125 -2 -122Z', PAL.red[2]))
    + S('M-10.5 -124.5L-11.5 -134C-9.5 -132 -7.5 -131 -6 -128C-4 -133 -1 -137 2 -141C5 -137 8 -133 10 -128C11.5 -131 13.5 -132 15.5 -134L14.5 -124.5Z', PAL.gold[1],
        shade('M-10.5 -124.5L-11.5 -134C-9.5 -132 -7.5 -131 -6 -128C-4.6 -131.6 -2.6 -134.6 -0.6 -137.6L-1 -124.5Z', PAL.gold[2])
        + L('M5 -131L7.5 -128', 1.2, PAL.gold[0], 1))
    + S('M-11 -125H15V-118.5H-11Z', PAL.gold[1], shade('M-11 -125H-2V-118.5H-11Z', PAL.gold[2]) + L('M-1 -123.6H13.5', 1, PAL.gold[0], 1))
    + dot(-11.5, -134.5, 1.7, PAL.ermine[0]) + dot(15.5, -134.5, 1.7, PAL.ermine[0])
    + S('M1.2 -141.5V-146.5M-1 -144.5H3.4', 'none').replace('fill="none"/>', 'fill="none" stroke-width="1.6"/>')
    + `<g stroke-width="0.9">${S('M-6.5 -122.6L-4.5 -120.6L-6.5 -118.8L-8.5 -120.6Z', PAL.red[0])}${S('M2 -123.2L4.4 -121.6L2 -119.4L-0.4 -121.6Z', '#5fcde4')}${S('M10.5 -122.6L12.5 -120.6L10.5 -118.8L8.5 -120.6Z', PAL.red[0])}</g>`));
const monarch = `<g id="mon">${capeAnchor}${arm('B', true)}${leg('B', true)}${sword}${leg('F', false)}${torso}${head}${arm('F', false)}</g>`;

// ---- Pferd ----
// Pferdebein: Knochen (Gruppen hu/hl/hh) liefern nur die Winkel. Sichtbar ist ein einziger Pfad über Schulter, Knie und

  const r = st.ride || [0, 0];
  $('ride').setAttribute('transform', `translate(0 ${r[0].toFixed(2)}) rotate(${r[1].toFixed(2)} 0 -80)`);
  for (const id of ['horseBack', 'horseFront']) $(id).style.display = st.horse ? '' : 'none';
  $('thighB').style.display = st.horse ? 'none' : '';
  for (const g of svg.querySelectorAll('.hindQ')) g.setAttribute('transform', `rotate(${(st.spine || 0).toFixed(2)} 0 -66)`);
  if (st.horse) drawLegs(st.a);
  $('shadow').setAttribute('rx', st.horse ? 62 : 18);
  $('reins').style.display = st.horse ? '' : 'none';
  if (st.horse) { const ride = $('ride'), pt = (el, x, y) => new DOMPoint(x, y).matrixTransform(ride.getCTM().inverse().multiply(el.getCTM()));
    const h = pt($('handF'), 0, -50), m = pt($('mouth'), 60, -91);
    $('reins').setAttribute('d', `M${h.x.toFixed(1)} ${h.y.toFixed(1)}Q${((h.x + m.x) / 2).toFixed(1)} ${((h.y + m.y) / 2 + 8).toFixed(1)} ${m.x.toFixed(1)} ${m.y.toFixed(1)}`); }
  $('ticks').setAttribute('transform', `translate(${(-(time * st.scroll) % 20).toFixed(2)} 0)`);
  $('world').setAttribute('transform', $('flip').checked ? 'scale(-1 1)' : '');
}

// ---- Export: SVG -> PNG in Zielgröße (ohne Quantisierung, Papierschnitt bleibt weich) ----
function rasterize(svgText, w, h) {
  return new Promise(res => { const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); res(c); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText); });
}
function snapshot(w, h) { const c = svg.cloneNode(true); c.classList.remove('showpv'); c.querySelector('#ground').remove(); c.querySelector('#shadow').remove();
  c.querySelectorAll('.pv').forEach(e => e.remove()); // Pivot-Marker: im Export gilt das Seiten-CSS nicht
  c.setAttribute('width', w); c.setAttribute('height', h); return new XMLSerializer().serializeToString(c); }
const size = () => { const h = +$('ph').value; return [Math.round(h * 240 / 220), h]; };

$('sheet').onclick = async () => {
  const [w, h] = size(), P = POSES[pose], texts = [], dt = 1 / 120;
  let tt = 0; const run = d => { for (let n = 0; n < Math.round(d / dt); n++) { tt += dt; apply(pose, tt); cloth.step(dt, stateOf(pose, tt)); } cloth.draw(); };
  run(2); // Umhang einschwingen lassen
  for (let i = 0; i < 8; i++) { run(1 / (8 * P.freq)); texts.push(snapshot(w, h)); }
  const strip = document.createElement('canvas'); strip.width = w * 8; strip.height = h;
  const sx = strip.getContext('2d');
  for (let i = 0; i < 8; i++) sx.drawImage(await rasterize(texts[i], w, h), i * w, 0);
  const out = $('strip'); out.width = strip.width; out.height = strip.height; out.style.width = '100%';
  out.getContext('2d').drawImage(strip, 0, 0);
  $('dl').href = strip.toDataURL('image/png'); $('dl').style.display = 'inline';
};

$('poses').onclick = e => { const b = e.target.closest('button'); if (!b || b.dataset.p === pose) return;
  prevPose = pose; switchAt = performance.now(); pose = b.dataset.p;
  document.querySelectorAll('#poses button').forEach(x => x.classList.toggle('on', x === b)); };
$('pv').onchange = () => svg.classList.toggle('showpv', $('pv').checked);

function frame(now) { t += (now - last) / 1000 * +$('speed').value; last = now;
  apply(pose, t, now); const dt = Math.min(1 / 30, (now - lastStep) / 1000) * +$('speed').value; lastStep = now;
  const st = stateOf(pose, t); for (let n = 0; n < 4; n++) cloth.step(dt / 4, st); cloth.draw(); requestAnimationFrame(frame); }
let lastStep = performance.now();
requestAnimationFrame(frame);
window.rig = { apply, POSES, cloth, setPose: p => { pose = p; } };
</script>
