# Namespace `go`: Tests und Lint des Go-Moduls an der Wurzel (cmd/, engine/, tools/ ohne die eigenen Module k3c-workbench,
# k3c-studio und assetkit). Die Aufgaben laufen im Repo-Wurzelordner. Gesamtprüfung: `task check:go`.
version: '3'

tasks:
  test:
    desc: go test ./...
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    cmds:
      - go test {{.GO_TEST_FLAGS}} {{.GO_PKGS | default "./..."}}

  lint:
    desc: golangci-lint
    deps: [':tmp']
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint fehlt (requirements.md)
    cmds:
      - golangci-lint run --allow-serial-runners {{.GO_LINT_PKGS}}

  race:
    desc: go test -race für engine/ (seit RU41 nur conlog und devrun); braucht cgo und einen C-Compiler, ohne Compiler nur ein Hinweis, B-077
    deps: [':tmp']
    cmds:
      - cmd: |
          if command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1; then
            CGO_ENABLED=1 go test -race -timeout 10m ./engine/...
          else
            echo "go:race übersprungen: kein C-Compiler (gcc oder clang), siehe requirements.md. Die CI prüft -race."
          fi

  # golden und cover entfallen mit RU41: Die Go-Sim ist entfernt, die Golden unter testdata/golden/ sind eingefroren und
  # werden nur noch von den Rust-Tests gelesen (Schreibweg in Rust: eigenes Ticket).
  golden-setup:
    desc: "Einmal je Klon: git zeigt Diffs der gepackten Golden-Dateien (*.json.gz) als JSON-Text (GD1, B-624)"
    cmds:
      - git config diff.gzip.textconv "gzip -dc"
