<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="dm.pageTitle">K3C Dungeon Master</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; --bad: #ff6b6b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
      main { padding: 12px; max-width: 48rem; margin: 0 auto; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      h2 { font-size: 1.1rem; margin: 16px 0 6px; }
      .dim { color: var(--dim); font-size: 0.9rem; }
      .bad { color: var(--bad); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 6px; }
      button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 10px 8px; min-height: 44px; width: 100%; }
      button:disabled { opacity: 0.4; }
      button.on { border-color: var(--on); }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 4px 6px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      td:first-child { color: var(--dim); width: 40%; }
    </style>
  </head>
  <body>
    <main>
      <h1>🐛 Dungeon Master</h1>
      <p id="mode" class="dim" data-t="monitor.connecting">Verbinde …</p>
      <section id="list"></section>
      <section id="room" hidden>
        <button id="back" data-t="dm.back">← Raumliste</button>
        <h2 id="title"></h2>
        <table id="diag"></table>
        <h2 data-t="dm.actions">Aktionen</h2>
        <label class="dim"><span data-t="dm.monarchLabel">Monarch</span> <select id="slot"></select></label>
        <div id="actions" class="grid"></div>
        <p id="msg" class="dim"></p>
      </section>
    </main>
    <script type="module" src="/src/tools/dm.ts"></script>
  </body>
</html>
