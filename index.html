<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Three Crowns</title>
    <style>
      :root {
        --night-1: #0b1026; --night-2: #1b2550; --night-3: #3b3a6b;
        --gold: #ffd166; --gold-deep: #e0a526; --text: #f1f3f9; --dim: #a9b3cf;
        --card: rgba(20, 28, 58, 0.72); --card-line: rgba(255, 255, 255, 0.10);
        --a-green: #3fb950;
      }
      * { box-sizing: border-box; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      html, body { margin: 0; min-height: 100%; }
      body {
        color: var(--text);
        font: 1.375rem/1.4 "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%) fixed;
        overflow-x: hidden;
      }

      /* ---------- Hintergrund: Sterne + Berge ---------- */
      .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
      .stars {
        position: absolute; inset: 0 0 35% 0;
        background-image:
          radial-gradient(2px 2px at 8% 12%, #fff, transparent), radial-gradient(1.5px 1.5px at 22% 30%, #fff, transparent),
          radial-gradient(2px 2px at 37% 8%, #fff, transparent), radial-gradient(1px 1px at 48% 26%, #fff, transparent),
          radial-gradient(2px 2px at 63% 14%, #fff, transparent), radial-gradient(1.5px 1.5px at 76% 34%, #fff, transparent),
          radial-gradient(1px 1px at 88% 10%, #fff, transparent), radial-gradient(2px 2px at 94% 28%, #fff, transparent),
          radial-gradient(1px 1px at 15% 44%, #fff, transparent), radial-gradient(1.5px 1.5px at 56% 40%, #fff, transparent);
        animation: twinkle 6s ease-in-out infinite alternate;
      }
      .moon { position: absolute; top: 9%; right: 11%; width: 6.875rem; height: 6.875rem; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fffbe6, #f3e3a1 60%, #d9c47c); box-shadow: 0 0 5rem 1.25rem rgba(255, 238, 170, 0.25); }
      .mountains { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42vh; }
      @keyframes twinkle { from { opacity: 0.55; } to { opacity: 1; } }

      /* ---------- Layout ---------- */
      .wrap { position: relative; z-index: 1; max-width: 100rem; margin: 0 auto; padding: 3rem 4rem 8.75rem; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; margin-bottom: 2.25rem; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 1.375rem; }
      .brand svg { width: 5.75rem; height: 5.75rem; filter: drop-shadow(0 6px 1.125rem rgba(255, 209, 102, 0.45)); }
      h1 { margin: 0; font: 700 3.75rem/1.05 Georgia, "Times New Roman", serif; letter-spacing: 1px;
        background: linear-gradient(180deg, #fff6d5, var(--gold) 55%, var(--gold-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .tagline { margin: 6px 0 0; color: var(--dim); font-size: 1.375rem; }
      .version { margin: 4px 0 0; color: var(--dim); font-size: 1rem; opacity: .8; }
      .version.mismatch { color: var(--gold); opacity: 1; font-weight: 700; }
      .status { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; border-radius: 62.4375rem; background: var(--card);
        border: 1px solid var(--card-line); font-size: 1.25rem; color: var(--dim); backdrop-filter: blur(6px); }
      .status .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #6b7280; }
      .status.on .dot { background: var(--a-green); box-shadow: 0 0 0.625rem var(--a-green); }
      .status.on { color: var(--text); }

      .top-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
      .fs-btn {
        display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.375rem; border-radius: 62.4375rem; cursor: pointer;
        font: inherit; font-size: 1.25rem; font-weight: 600; line-height: 1; color: var(--text); background: var(--card);
        border: 2px solid var(--card-line); outline: none; backdrop-filter: blur(6px);
        transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      }
      .fs-btn svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .fs-btn.focus { transform: scale(1.06); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25); }
      .fs-btn.active svg { color: var(--gold); }
      .glyph.y { background: #e3b341; color: #1b1b1b; border-radius: 50%; padding: 0; }
      .toast {
        position: fixed; left: 50%; bottom: 6rem; z-index: 20; max-width: min(56.25rem, calc(100% - 2rem));
        translate: -50% 1.25rem; opacity: 0; pointer-events: none; padding: 1rem 1.5rem; border-radius: 0.875rem;
        background: rgba(12, 16, 36, 0.95); border: 1px solid var(--gold); font-size: 1.25rem;
        transition: opacity 200ms ease, translate 200ms ease;
      }
      .toast.show { opacity: 1; translate: -50% 0; }

      /* ---------- Shell: geöffnete Unterseite (iframe wird von landing.ts erzeugt) ---------- */
      #frame { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; border: 0; background: #000; display: none; }
      body.page-open #frame { display: block; }
      body.page-open .wrap, body.page-open .hints, body.page-open .sky { visibility: hidden; }
      body.page-open { overflow: hidden; }

      h2 { margin: 2rem 0 1rem; font-size: 1.25rem; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(20.625rem, 1fr)); gap: 1.375rem; }

      /* ---------- Kacheln ---------- */
      .card {
        position: relative; display: flex; gap: 1.25rem; align-items: center; padding: 1.625rem 1.75rem; min-height: 8.75rem;
        border-radius: 1.375rem; background: var(--card); border: 2px solid var(--card-line);
        color: inherit; text-decoration: none; outline: none; backdrop-filter: blur(8px);
        transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
      }
      .card .icon { font-size: 3.375rem; line-height: 1; flex: none; width: 4.5rem; text-align: center; }
      .card .title { font-size: 1.75rem; font-weight: 700; margin: 0 0 4px; }
      .card .desc { color: var(--dim); font-size: 1.1875rem; margin: 0; }
      .card.disabled { opacity: 0.5; }
      .card.primary { grid-column: span 2; min-height: 12.5rem;
        background: linear-gradient(135deg, rgba(255, 209, 102, 0.20), rgba(20, 28, 58, 0.78) 60%); }
      .card.primary .icon { font-size: 5.25rem; width: 6.5rem; }
      .card.primary .title { font-size: 2.5rem; }
      /* Kleine Kachel zur Entwicklerseite (B-335): unauffällig, nur eine Zeile hoch */
      .card.small { min-height: 0; padding: 0.75rem 1.25rem; gap: 0.75rem; opacity: 0.75; align-self: center; }
      .card.small .icon { font-size: 1.75rem; width: 2.25rem; }
      .card.small .title { font-size: 1.25rem; margin: 0; }
      .card.small .desc { font-size: 0.9375rem; }
      .card.small.focus { opacity: 1; }
      .card:focus, .card.focus {
        transform: scale(1.04); border-color: var(--gold); background-color: rgba(34, 44, 88, 0.85);
        box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25), 0 1.125rem 2.5rem rgba(0, 0, 0, 0.45);
      }
      .card.focus::after {
        content: "A"; position: absolute; right: 1.375rem; top: 50%; translate: 0 -50%;
        width: 2.75rem; height: 2.75rem; border-radius: 50%; display: grid; place-items: center;
        background: var(--a-green); color: #fff; font-weight: 800; font-size: 1.375rem; box-shadow: 0 4px 0.75rem rgba(0,0,0,.4);
      }
      .card.launch { transform: scale(0.97); transition-duration: 80ms; }

      /* ---------- Fußleiste mit Controller-Hinweisen ---------- */
      .hints { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; justify-content: center; gap: 2.75rem; flex-wrap: wrap;
        padding: 1.25rem 2rem; background: linear-gradient(0deg, rgba(8, 11, 28, 0.95), rgba(8, 11, 28, 0)); color: var(--dim); font-size: 1.25rem; }
      .hint { display: flex; align-items: center; gap: 0.75rem; }
      .glyph { display: inline-grid; place-items: center; min-width: 2.375rem; height: 2.375rem; padding: 0 0.625rem; border-radius: 1.1875rem;
        background: #2b3558; color: var(--text); font-weight: 700; font-size: 1.0625rem; }
      .glyph.a { background: var(--a-green); color: #fff; border-radius: 50%; padding: 0; }

      @media (max-width: 760px) {
        body { font-size: 1.125rem; }
        .wrap { padding: 1.75rem 1rem 9.375rem; }
        h1 { font-size: 2.5rem; }
        .brand svg { width: 4rem; height: 4rem; }
        .card.primary { grid-column: auto; }
        .card.primary .title { font-size: 1.875rem; }
        .hints { gap: 1.125rem; font-size: 1rem; }
      }
      @media (orientation: portrait) {
        html { font-size: clamp(12px, 3.6vw, 16px); }
        .hints, .card.focus::after { display: none; }
        .wrap { padding-bottom: 2rem; }
        .moon { width: 4.5rem; height: 4.5rem; top: 3%; right: 6%; opacity: .6; }
        .card.primary { min-height: 9rem; }
        .card.primary .icon { font-size: 3.5rem; width: 4.5rem; }
        .card.primary .title { font-size: 1.9rem; }
        .card:focus, .card.focus { transform: none; }
      }
      @media (prefers-reduced-motion: reduce) { .stars { animation: none; } .card { transition: none; } }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="moon"></div>
      <svg class="mountains" viewBox="0 0 1600 400" preserveAspectRatio="none">
        <path fill="#2a2f5c" d="M0 260 L120 170 L230 230 L380 110 L520 220 L640 150 L790 240 L930 120 L1080 230 L1220 140 L1380 220 L1500 160 L1600 210 L1600 400 L0 400 Z" />
        <path fill="#1c2146" d="M0 320 L150 250 L290 300 L430 220 L600 300 L760 240 L900 310 L1060 230 L1230 300 L1380 250 L1600 300 L1600 400 L0 400 Z" />
        <path fill="#121632" d="M0 370 Q200 330 400 360 T800 355 T1200 360 T1600 350 L1600 400 L0 400 Z" />
      </svg>
    </div>

    <div class="wrap">
      <header>
        <div class="brand">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M8 46 L4 18 L20 30 L32 10 L44 30 L60 18 L56 46 Z" fill="#ffd166" stroke="#8a5a00" stroke-width="2.5" stroke-linejoin="round" />
            <rect x="8" y="46" width="48" height="9" rx="2" fill="#e0a526" stroke="#8a5a00" stroke-width="2.5" />
            <circle cx="32" cy="10" r="4" fill="#ff6b6b" /><circle cx="4" cy="18" r="3.5" fill="#4dabf7" /><circle cx="60" cy="18" r="3.5" fill="#4dabf7" />
          </svg>
          <div>
            <h1>Family Three Crowns</h1>
            <p class="tagline" data-t="landing.tagline"></p>
            <p class="version" id="version"></p>
          </div>
        </div>
        <div class="top-right">
          <div class="status" id="pad-status"><span class="dot"></span><span id="pad-status-text" data-t="landing.padNone"></span></div>
          <button class="fs-btn" id="fullscreen" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
            <span id="fullscreen-label" data-t="landing.fullscreen"></span>
          </button>
        </div>
      </header>

      <main id="menu"></main>
    </div>

    <footer class="hints">
      <span class="hint"><span class="glyph">✚</span> <span data-t="landing.hintSelect"></span></span>
      <span class="hint"><span class="glyph a">A</span> <span data-t="landing.hintOpen"></span></span>
      <span class="hint"><span class="glyph y">Y</span> <span data-t="landing.fullscreen"></span></span>
      <span class="hint"><span class="glyph">View</span>+<span class="glyph">Menu</span> <span data-t="landing.hintBack"></span></span>
    </footer>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/src/landing/landing.ts"></script>
  </body>
</html>
