# Cargo-Workspace der Rust-Werkzeuge (Entscheidung 014, Leitfaden docs/standards/rust-werkzeuge.md): gemeinsamer Code
# `k3c-kit`, später Asset-Logik, Studio und Workbench. Eigener Workspace neben rust/, damit `cargo test --workspace` des
# Spiels die Tauri-Crates nicht mitbaut. Toolchain und rustfmt erbt er aus rust/rust-toolchain.toml und rust/rustfmt.toml.
[workspace]
resolver = "3"
members = ["crates/*"]
# Der Spike RU65.1 hat einen eigenen Workspace und bleibt nur als Referenz (RU71 löscht ihn).
exclude = ["spike"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Versionen fest (Leitfaden › Abhängigkeiten).
[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
# proc: Prozesse async, weil alle Aufrufer in tokio laufen (RU66.2).
tokio = { version = "=1.54.1", features = ["process", "rt", "macros", "sync", "time", "io-util", "net"] }
# mcp: HTTP-Server (RU66.4) und PNG in Tool-Ergebnissen; reqwest nur in Tests.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
# Nur Windows: Job-Objekt (proc), Features je Crate.
windows = { version = "=0.62.2", default-features = false }
# Nur Tests, Ordner unter .work/ (testutil.rs).
tempfile = "=3.27.0"
# mcp: nur Modelltypen (RU66.3); Server und Streamable HTTP nutzt RU66.4.
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "=1.2.3"
# uikit: TS-Schnittstelle lesen und Ereignisstrom (RU66.5).
regex = "=1.13.2"
tokio-stream = { version = "=0.1.19", features = ["sync"] }
# k3c-assetkit: Stand des Slot-Registers (RU67.1).
sha2 = "=0.10.9"

[workspace.lints.rust]
# deny statt forbid (wie rust/): proc (Job-Objekt) und winicon brauchen je ein Windows-Modul mit #[allow(unsafe_code)],
# jede Stelle mit `// SAFETY:` (Muster rust/crates/k3c-devwin).
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"
# Kein Panic im Produktivcode, Fehler weiterreichen (Tests in clippy.toml erlaubt).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
