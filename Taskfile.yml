# Einstieg für alle Aufgaben: `task --list` (Voraussetzung: Go Task, requirements.md).
# Die Werkzeuge laufen direkt (bunx, go, wails); package.json hält nur noch Abhängigkeiten.
#
# Aufbau: Dieses Taskfile hält die Kernbefehle ohne Namensraum (Workspace) und die Prüf-Aggregate `check:*`.
# Alles andere liegt als eigenes Taskfile im Ordner des Projekts und erscheint hier unter dem Namen des Projekts
# (die Workbench gruppiert nach dem Namensraum vor dem Doppelpunkt):
#
#   go           engine/Taskfile.yml            go test, Lint, Race, Abdeckung, Golden-Dateien
#   k3c-sim      cmd/k3c-sim/Taskfile.yml       Engine-CLI: Simulation, Balancing, Level (B-726)
#   k3c-workbench      tools/k3c-workbench/Taskfile.yml     Workbench: dev (Client/Server), window (wails dev), build, frontend, test, lint
#   balance      tools/k3c-workbench/internal/balance/Taskfile.yml  Balancing-Tester
#   gen          tools/Taskfile.yml             Generatoren: Atlas, Gebäude, Grafik-Pipeline, Regeltabelle
#   ops          scripts/Taskfile.yml           Betrieb: Aufräumen, Spielstände sichern
#   native       native/Taskfile.yml            Natives Spiel und Prototypen (Projekt NAT, Entscheidung 008): game, ebiten, rig, measure
#
# Gruppen dieses Taskfiles (in dieser Reihenfolge): Einrichten (install) · Werkzeuge und Tests (lint, typecheck, test) · Bauen und Ausliefern
# (build, buildall, pages) · Prüfen (check, check:go, check:race, check:diff, check:dev, check:all).
#
# Jedes EXE-Projekt kennt dieselben Verben: `build` (EXE bauen), `run` (bauen und starten), `dev` (Backend mit `-dev` baut und startet sich
# bei jeder Go-Änderung selbst neu, engine/devrun; Wails-Apps zeigen die Oberfläche über Vite im Browser). Der Name des Projekts allein (`task k3c-workbench`) startet `dev`.
version: '3'

# Go-Build-Temp (go-build, Test-EXEs, t.TempDir) und Wails-Bindings-EXE liegen an einem festen Ort statt in %TEMP%:
# Nur so reicht EINE Norton-Ausnahme (`%USERPROFILE%\.k3c\tmp`). Der Ort liegt außerhalb des Repos, sonst hasht `go test`
# die wechselnden Temp-Ordner als Eingabe und der Testcache greift nie (B-619). Nicht unter AppData: Die Claude-App (MSIX)
# leitet Schreibzugriffe dorthin um, Git und Go sähen verschiedene Pfade. Ohne USERPROFILE (CI) `.work/tmp`.
vars:
  K3C_TMP: '{{if .USERPROFILE}}{{toSlash .USERPROFILE}}/.k3c/tmp{{else}}{{.ROOT_DIR}}/.work/tmp{{end}}'

env:
  GOTMPDIR: '{{.K3C_TMP}}'
  TMP: '{{.K3C_TMP}}'
  TEMP: '{{.K3C_TMP}}'

includes:
  go: engine/Taskfile.yml
  k3c-sim: cmd/k3c-sim/Taskfile.yml
  k3c-workbench: tools/k3c-workbench/Taskfile.yml
  balance: tools/k3c-workbench/internal/balance/Taskfile.yml
  gen: tools/Taskfile.yml
  ops: scripts/Taskfile.yml
  native: native/Taskfile.yml
  rust: rust/Taskfile.yml

tasks:
  # Legt das feste Temp-Verzeichnis an (GOTMPDIR muss existieren, auch in der CI und in frischen Klonen ohne `task install`).
  # Die Taskfiles der Projekte rufen es als `:tmp` auf.
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.K3C_TMP}}'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  # --- Einrichten ---------------------------------------------------------------------------------------------------

  install:
    desc: Abhängigkeiten holen (Werkzeuge und Tests der Wurzel, Frontend von k3c-workbench)
    cmds:
      - mkdir -p '{{.K3C_TMP}}'
      - bun install --frozen-lockfile
      - bun install --frozen-lockfile --cwd tools/k3c-workbench/frontend

  # --- Werkzeuge und Tests der Wurzel (tests/, tools/paper; der Browser-Client ist entfernt, B-848) ------------------

  lint:
    desc: Oxlint
    cmds:
      - bunx oxlint

  typecheck:
    desc: tsc für tests/ und tools/paper
    cmds:
      - bunx tsc --noEmit

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`); rendert vorher die Papierschnitt-Grafik (gen:paper, B-737)
    deps: [gen:paper]
    cmds:
      - bunx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - bunx vitest

  # --- Bauen und Ausliefern -----------------------------------------------------------------------------------------
  # `build` baut das native Spiel (dist/k3c-game/), `buildall` die Werkzeug-EXE nach bin/, `pages` die statische Präsentationsseite.

  build:
    desc: Natives Spiel bauen (wie native:game:build; EXE, Papierschnitt-Grafik über gen:paper und Paket nach dist/k3c-game/, B-848)
    cmds:
      - task: native:game:build

  buildall:
    desc: Alle EXE bauen (Workbench und Engine-CLI k3c-sim nach bin/, Spiel nach dist/k3c-game/); laufende EXE vorher schließen, sonst scheitert die Kopie
    cmds:
      - task: k3c-workbench:build
      - task: k3c-sim:build
      - task: native:game:build

  pages:
    desc: GitHub-Pages-Seite nach _site/ (kopiert nur site/, kein Build, B-507)
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r site/. _site/

  # --- Prüfen: ein Name je Projekt, `check` ist die Wurzel (Regeln, Planung, Papierschnitt) -----------------------------------------------------------

  check:
    desc: Lint, Typecheck, Tests der Wurzel (tests/, tools/paper) parallel (vor jedem Abschluss)
    deps: [lint, typecheck, test]

  check:go:
    desc: Go-Tests ohne Sim-, Balance- und Lasttest-Pakete (Sperre, CHECK_SIM=1 nimmt sie mit, B-832) und golangci-lint (nacheinander wegen Wanduhr-Tests, B-284; Race-Detector getrennt in check:race, B-518)
    # Die Paketliste kommt aus tools/checkdiff › simDirs (eine Quelle, ohne grep und tr, die dem Runner der Workbench fehlen);
    # scheitert sie, bricht check:go ab, statt auf ./... zurückzufallen.
    vars:
      CHECK_GO_PKGS:
        sh: go run ./tools/checkdiff -gopkgs
    cmds:
      - task: go:test
        vars:
          GO_PKGS: '{{.CHECK_GO_PKGS | default "./paketliste-fehlt"}}'
      - task: go:lint

  check:race:
    desc: Go-Race-Detector für engine/ (langsam; nur Abnahme-Ticket des Sprints, check:all und CI, B-518, B-742)
    cmds:
      - task: go:race

  # check:diff ist das Werkzeug tools/checkdiff (Auswahl als getestete Go-Logik statt Shell). Teilaufgaben: `check:diff:plan` zeigt nur,
  # was laufen würde; `check:diff:js` und `check:diff:go` wiederholen nach einem roten Lauf nur die betroffene Bahn.
  check:diff:
    desc: "Vor jedem Commit: nur was die geänderten Dateien dieses Commits brauchen (Basis HEAD; `CHECK_BASE=origin/main` für den ganzen Sprint). Stufe 1 Regel-Tests, Lint, Typecheck, go vet; Stufe 2 nur nach grüner Stufe 1: Tests der geänderten Pakete (-short), Vitest --changed. Ohne Abnehmer-Tests, Sim, Balance, Gen, Race (B-518, B-730, B-742)"
    deps: [tmp]
    cmds:
      - go run ./tools/checkdiff {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}} {{.CLI_ARGS}}

  check:diff:plan:
    desc: "check:diff trocken: zeigt Basis und Schritte, führt nichts aus"
    cmds:
      - go run ./tools/checkdiff -plan {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:diff:js:
    desc: "check:diff, nur die Bahn JS (Regel-Tests, Oxlint, tsc, Vitest --changed)"
    deps: [tmp]
    cmds:
      - go run ./tools/checkdiff -only js {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:diff:go:
    desc: "check:diff, nur die Bahn Go (go vet, golangci-lint, go test -short der geänderten Pakete)"
    deps: [tmp]
    cmds:
      - go run ./tools/checkdiff -only go {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:diff:rust:
    desc: "check:diff, nur die Bahn Rust (cargo fmt, clippy und Tests der geänderten Crates in rust/)"
    cmds:
      - go run ./tools/checkdiff -only rust {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:dev:
    desc: k3c-workbench prüfen (Frontend mit Vitest, go test, golangci-lint)
    cmds:
      - task: k3c-workbench:frontend
      - task: k3c-workbench:test
      - task: k3c-workbench:lint

  check:all:
    desc: Alles prüfen (Wurzel, Go, k3c-workbench, Build des nativen Spiels)
    cmds:
      - task: check
      - task: build
      - task: check:go
      - task: check:race
      - task: check:dev
