[package]
name = "k3c-platform"
edition.workspace = true
version.workspace = true
publish.workspace = true

# Eigene Lints statt `workspace = true`: der Allokations-Test (tests/alloc.rs) braucht
# einen zählenden Allocator und damit `unsafe`; die Bibliothek selbst bleibt `forbid(unsafe_code)`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
too_many_lines = "deny"

[dependencies]
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
fontdue.workspace = true
gilrs.workspace = true
