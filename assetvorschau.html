<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nur im Dev-Build (B-299): vite.config.ts nimmt Seiten mit diesem Marker aus dem Produktions-Build. -->
    <meta name="k3c-dev-only" content="true" />
    <title data-t="av.pageTitle">K3C Asset-Vorschau</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; --warn: #ff8fa3; }
      * { box-sizing: border-box; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.4 system-ui, sans-serif; }
      main { padding: max(4.75rem, 70px) 2rem 2rem; max-width: 115rem; margin: 0 auto; }
      h1 { font-size: 2.125rem; margin: 0 0 4px; }
      h2 { font-size: 1.5rem; margin: 1rem 0 0.5rem; color: var(--on); }
      h2 small, .dim { color: var(--dim); font-weight: normal; font-size: 1rem; }
      .sub { color: var(--dim); margin: 0 0 1rem; max-width: 62rem; }
      #nav { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 0.75rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      button { font: inherit; color: inherit; background: var(--panel); border: 2px solid var(--line); border-radius: 0.6rem; padding: 0.4rem 1rem; min-height: 3rem; cursor: pointer; }
      button[aria-pressed='true'], button:hover, button:focus-visible { border-color: var(--on); outline: none; }
      #status { color: var(--dim); min-height: 1.5rem; }
      .strip { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; overflow-x: auto; padding: 1rem; border-bottom: 4px solid #5b4a3a; background: linear-gradient(#2c3350, #4a3a5c); border-radius: 0.5rem 0.5rem 0 0; }
      .strip.umgebung { flex-wrap: nowrap; }
      .strip.hud { background: #0b0e13; border-bottom-color: var(--line); }
      figure { margin: 0; flex: 0 0 auto; max-width: 40rem; }
      figure canvas { display: block; image-rendering: pixelated; }
      figcaption { font-size: 0.85rem; margin-top: 0.3rem; word-break: break-all; }
      .nc { color: var(--warn); font-weight: bold; }
      .gap { border: 2px dashed var(--warn); color: var(--warn); padding: 1.5rem 1rem; font-size: 0.9rem; min-width: 8rem; text-align: center; }
      .sound { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; background: var(--panel); border: 2px solid var(--line); border-radius: 0.75rem; padding: 0.6rem 1rem; margin: 0.5rem 0; }
      .sound figcaption { flex: 1 1 24rem; margin: 0; font-size: 1rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); gap: 1rem; }
      article { background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem; padding: 0.75rem; }
      article canvas { width: 100%; aspect-ratio: 320 / 220; display: block; border-radius: 0.5rem; background: linear-gradient(#2c3350, #4a3a5c); }
      article h3 { font-size: 1.15rem; margin: 0.6rem 0 0.2rem; color: var(--on); }
      article p { margin: 0; font-size: 0.95rem; word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-t="av.title">Asset-Vorschau</h1>
      <p class="sub" data-t="av.sub">Aktive Zuordnungen aus dem Slot-Register je Kategorie im Spielmaßstab; nur im Dev-Build.</p>
      <div id="nav"></div>
      <p id="status" role="status"></p>
      <div id="scene"></div>
    </main>
    <script type="module" src="/src/tools/assetvorschau.ts"></script>
  </body>
</html>
