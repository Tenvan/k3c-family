# Namespace `k3c-server`: der Go-Spielserver. Immer die feste EXE bin/k3c-server, damit die Firewall-Freigabe bleibt (B-085).
# Gebaut wird mit dem Go-Cache: ohne Änderung kostet `build` nur das Binden, deshalb ohne `sources`.
version: '3'

vars:
  EXE: 'bin/k3c-server{{exeExt}}'

tasks:
  build:
    desc: EXE bin/k3c-server bauen (Version aus `git describe`, steht in /api/health und auf der Landingpage)
    deps: [':tmp']
    vars:
      VERSION:
        sh: git describe --tags --always --dirty || echo dev
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.EXE}} ./cmd/k3c-server

  run:
    desc: Go-Server ohne Web-Build bauen und starten (Port 8080; `task start` ist die Kurzform)
    cmds:
      - task: build
      - ./{{.EXE}}

  # Der Dev-Lauf baut und startet dieselbe EXE bin/k3c-server wie `build`/`run` (Firewall-Freigabe, B-085); der Supervisor
  # bin/k3c-server-devhost lauscht selbst nicht. Deshalb laufen `k3c-server:dev` und `task start`/`k3c-server:run` nicht gleichzeitig.
  dev:
    desc: Go-Server als Dev-Lauf (`k3c-server -dev`, engine/devrun) - baut bin/k3c-server bei jeder Änderung an Go-Code in cmd/k3c-server, engine/ oder data/ neu und startet ihn neu; data/ und public/ beobachtet der Server selbst (Neustart ohne Neubau); ein Build-Fehler lässt die laufende Version stehen; nicht gleichzeitig mit `task start`
    deps: [':tmp']
    cmds:
      - go build -o bin/k3c-server-devhost{{exeExt}} ./cmd/k3c-server
      - ./bin/k3c-server-devhost{{exeExt}} -dev

  default:
    desc: Kurzform von k3c-server:dev
    cmds:
      - task: dev
