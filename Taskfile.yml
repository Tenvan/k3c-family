# Einstieg für alle Aufgaben: `task --list` (Voraussetzung: Go Task, requirements.md).
# Die Werkzeuge laufen direkt (bunx, go, wails); package.json hält nur noch Abhängigkeiten.
#
# Aufbau: Dieses Taskfile hält die Kernbefehle ohne Namensraum (Workspace) und die Prüf-Aggregate `check:*`.
# Alles andere liegt als eigenes Taskfile im Ordner des Projekts und erscheint hier unter dem Namen des Projekts
# (die Workbench gruppiert nach dem Namensraum vor dem Doppelpunkt):
#
#   go           engine/Taskfile.yml            go test, Lint, Race, Abdeckung, Golden-Dateien
#   k3c-server   cmd/k3c-server/Taskfile.yml    Spielserver: build, run, dev (devrun, -dev)
#   k3c-load     cmd/k3c-load/Taskfile.yml      Lasttest
#   k3c-tui      cmd/k3c-tui/Taskfile.yml       Diagnose-Oberfläche
#   k3c-workbench      tools/k3c-workbench/Taskfile.yml     Workbench: dev (Client/Server), window (wails dev), build, frontend, test, lint
#   k3c-starter  tools/k3c-starter/Taskfile.yml Windows-Starter: dev (Client/Server), window (wails dev), build, test, lint
#   balance      tools/k3c-workbench/internal/balance/Taskfile.yml  Balancing-Tester
#   gen          tools/Taskfile.yml             Generatoren: Atlas, Gebäude, Grafik-Pipeline, Regeltabelle
#   ops          scripts/Taskfile.yml           Betrieb: Aufräumen, Spielstände sichern
#   rust         rust/Taskfile.yml              Rust-Kern k3c-core (Entscheidung 006): build, test, lint
#
# Gruppen dieses Taskfiles (in dieser Reihenfolge): Einrichten (install) · Client (dev, lint, typecheck, test) · Bauen und Ausliefern
# (build, buildall, pages) · Spielserver (start, serve) · Prüfen (check, check:go, check:race, check:diff, check:dev, check:starter,
# check:all).
#
# Jedes EXE-Projekt kennt dieselben Verben: `build` (EXE bauen), `run` (bauen und starten), `dev` (Backend mit `-dev` baut und startet sich
# bei jeder Go-Änderung selbst neu, engine/devrun; Wails-Apps zeigen die Oberfläche über Vite im Browser). Der Name des Projekts allein (`task k3c-workbench`) startet `dev`.
version: '3'

# Go-Build-Temp (go-build, Test-EXEs, t.TempDir) und Wails-Bindings-EXE liegen an einem festen Ort statt in %TEMP%:
# Nur so reicht EINE Norton-Ausnahme (`%USERPROFILE%\.k3c\tmp`). Der Ort liegt außerhalb des Repos, sonst hasht `go test`
# die wechselnden Temp-Ordner als Eingabe und der Testcache greift nie (B-619). Nicht unter AppData: Die Claude-App (MSIX)
# leitet Schreibzugriffe dorthin um, Git und Go sähen verschiedene Pfade. Ohne USERPROFILE (CI) `.work/tmp`.
vars:
  K3C_TMP: '{{if .USERPROFILE}}{{toSlash .USERPROFILE}}/.k3c/tmp{{else}}{{.ROOT_DIR}}/.work/tmp{{end}}'

env:
  GOTMPDIR: '{{.K3C_TMP}}'
  TMP: '{{.K3C_TMP}}'
  TEMP: '{{.K3C_TMP}}'

includes:
  go: engine/Taskfile.yml
  k3c-server: cmd/k3c-server/Taskfile.yml
  k3c-load: cmd/k3c-load/Taskfile.yml
  k3c-tui: cmd/k3c-tui/Taskfile.yml
  k3c-workbench: tools/k3c-workbench/Taskfile.yml
  k3c-starter: tools/k3c-starter/Taskfile.yml
  balance: tools/k3c-workbench/internal/balance/Taskfile.yml
  gen: tools/Taskfile.yml
  ops: scripts/Taskfile.yml
  rust: rust/Taskfile.yml

tasks:
  # Legt das feste Temp-Verzeichnis an (GOTMPDIR muss existieren, auch in der CI und in frischen Klonen ohne `task install`).
  # Die Taskfiles der Projekte rufen es als `:tmp` auf.
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.K3C_TMP}}'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  # --- Einrichten ---------------------------------------------------------------------------------------------------

  install:
    desc: Abhängigkeiten holen (Client, Frontends von k3c-workbench und Starter)
    cmds:
      - mkdir -p '{{.K3C_TMP}}'
      - bun install --frozen-lockfile
      - bun install --frozen-lockfile --cwd tools/k3c-workbench/frontend
      - bun install --frozen-lockfile --cwd tools/k3c-starter/frontend

  # --- Client (Phaser, Vite): entwickeln und prüfen -----------------------------------------------------------------

  dev:
    desc: Dev-Server (LAN, Port 5183); /api und /ws gehen an den Go-Server (Port 8080, `task start`); rendert vorher die Papierschnitt-Grafik (gen:paper, B-737)
    deps: [gen:paper]
    cmds:
      - bunx vite --host {{.CLI_ARGS}}

  preview:
    desc: Produktions-Build lokal ansehen
    cmds:
      - bunx vite preview --host

  lint:
    desc: Oxlint
    cmds:
      - bunx oxlint

  typecheck:
    desc: tsc für Client und Tests
    cmds:
      - bunx tsc --noEmit
      - bunx tsc --noEmit -p tests

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`); rendert vorher die Papierschnitt-Grafik (gen:paper, B-737)
    deps: [gen:paper]
    cmds:
      - bunx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - bunx vitest

  # --- Bauen und Ausliefern -----------------------------------------------------------------------------------------
  # `build` ist der Web-Build (dist/), `buildall` baut dazu alle EXE nach bin/, `pages` die statische Präsentationsseite.

  build:
    desc: Typecheck und Produktions-Build nach dist/ (die Papierschnitt-PNGs in public/grafik/ rendert vorher gen:paper, sie sind nicht eingecheckt, US1, B-737)
    deps: [gen:paper]
    cmds:
      - bunx tsc --noEmit
      - bunx vite build

  buildall:
    desc: Alle EXE bauen und nach bin/ legen (Spielserver, Lasttest, TUI, Workbench, Starter samt Web-Build dist/, dazu die Web-EXE bin/k3c-workbench-web); laufende EXE vorher schließen, sonst scheitert die Kopie
    cmds:
      - task: k3c-workbench:build
      - task: k3c-workbench:web:build
      - task: k3c-server:build
      - task: k3c-load:build
      - task: k3c-tui:build
      - task: k3c-starter:build

  pages:
    desc: GitHub-Pages-Seite nach _site/ (kopiert nur site/, kein Build, B-507; danach z. B. `bunx vite preview --outDir _site`)
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r site/. _site/

  # --- Spielserver --------------------------------------------------------------------------------------------------

  start:
    desc: Go-Server ohne Web-Build (feste EXE bin/k3c-server, damit die Firewall-Freigabe bleibt, B-085); Kurzform von k3c-server:run
    cmds:
      - task: k3c-server:run

  serve:
    desc: Build und Go-Server (Port 8080)
    deps: [build]
    cmds:
      - task: start

  # --- Prüfen: ein Name je Projekt, `check` ist der Client -----------------------------------------------------------

  check:
    desc: Lint, Typecheck, Tests des Clients parallel (vor jedem Abschluss)
    deps: [lint, typecheck, test]

  check:go:
    desc: Go-Tests und golangci-lint (nacheinander wegen Wanduhr-Tests, B-284; Race-Detector getrennt in check:race, B-518)
    cmds:
      - task: go:test
      - task: go:lint

  check:race:
    desc: Go-Race-Detector für engine/ (langsam; nur Review-Session, check:all und CI, B-518)
    cmds:
      - task: go:race

  check:diff:
    desc: Nur die Prüfungen, die der eigene Diff braucht (Basis = nächster Integrations-Branch, samt ungespeicherter Änderungen; nur betroffene Go-Pakete, Go mit -short, parallel; vor jedem Commit, B-518, B-619, B-730)
    cmds:
      - cmd: |
          # Nur sh, git, go und bunx: check_run startet task ohne Git-Bash-PATH (kein sort, awk, grep).
          # Basis: jüngster Merge-Base aus origin/develop und allen origin/feature/*, die in HEAD stecken (CHECK_BASE überschreibt).
          base="{{.CHECK_BASE}}"
          if [ -z "$base" ]; then
            for r in origin/develop $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/feature/*'); do
              mb=$(git merge-base HEAD "$r" 2>/dev/null) || continue
              if [ -z "$base" ] || git merge-base --is-ancestor "$base" "$mb"; then base=$mb; fi
            done
          fi
          [ -n "$base" ] || { echo "❌ check:diff: keine Basis gefunden (origin/develop fehlt? git fetch, oder CHECK_BASE setzen)"; exit 1; }
          # Flags: c Client (Lint, Typecheck, Vitest --changed), a Assets (Golden-Tests), gf Root-Go voll, wf/wv/wa Workbench Go voll/Vitest/assetkit,
          # sp/sl/sv Starter. ch = geänderte Go-Pakete (Importpfade, auch für die Abnehmer in anderen Modulen).
          c=; a=; gf=; wf=; wv=; wa=; sg=; sl=; sv=; ch=; docs=1
          for f in $(git diff --name-only "$base"; git ls-files --others --exclude-standard); do
            case "$f" in
              docs/*|*.md|reports/*) continue ;;
            esac
            docs=
            d=${f%/*}; [ "$d" = "$f" ] && d=.
            d=${d%%/testdata*}
            case "$f" in
              go.mod|go.sum|Taskfile.yml|.golangci*|.github/*|testdata/*) gf=1; wf=1 ;;
              data/*) ch="$ch k3c/data"; c=1 ;;
              engine/*|cmd/*|tools/atlas/*|tools/buildings/*|tools/pipeline/*|tools/cleanup/*|tools/ruletable/*|tools/spritegen/*|tools/soundatlas/*)
                ch="$ch k3c/$d" ;;
              public/grafik/*) a=1 ;;
              tools/webkit/*) wv=1; sv=1 ;;
              tools/assetkit/*) wa=1; ch="$ch k3c/$d" ;;
              tools/k3c-workbench/frontend/*) wv=1 ;;
              tools/k3c-workbench/go.mod|tools/k3c-workbench/go.sum|tools/k3c-workbench/Taskfile.yml|tools/k3c-workbench/.golangci*) wf=1 ;;
              tools/k3c-workbench/*) ch="$ch k3c/$d" ;;
              tools/k3c-starter/frontend/*) sv=1 ;;
              tools/k3c-starter/*) sg=1; sl=1 ;;
              *) c=1 ;;
            esac
          done
          # Betroffene Pakete je Modul: geändertes Paket oder ein Paket, das eines davon importiert.
          t='{''{.ImportPath}} {''{join .Deps " "}}'
          aff() {
            [ -n "$ch" ] || return 0
            go list -f "$t" ./... 2>/dev/null | while read -r p rest; do
              for x in $ch; do case " $p $rest " in *" $x "*) printf '%s ' "$p"; break ;; esac; done
            done
          }
          own() { for x in $ch; do case "$x" in "$1"/*|"$1") printf '%s ' "$x" ;; esac; done; }
          gp=; wp=; [ -n "$gf" ] || gp=$(aff)
          [ -n "$wf" ] || wp=$(cd tools/k3c-workbench && aff)
          [ -n "$wa" ] || wa=$(cd tools/assetkit && aff)
          gl=$(for x in $(own k3c); do case "$x" in k3c/tools/k3c-workbench*|k3c/tools/assetkit*) ;; *) printf './%s/... ' "${x#k3c/}" ;; esac; done)
          wl=$(for x in $(own k3c/tools/k3c-workbench); do printf './%s/... ' "${x#k3c/tools/k3c-workbench/}"; done)
          wl=${wl//.\/k3c\/tools\/k3c-workbench\/.../.\/...}
          scan="tests/planning.test.ts tests/planningProjects.test.ts tests/projectRules.test.ts"
          [ -z "$a" ] || scan="$scan tests/paperAssets.test.ts tools/paper/golden"
          echo "🚦 check:diff Basis $(git rev-parse --short "$base")$([ -n "$docs" ] && echo ' · nur Doku')"
          echo "🚦 Client: ${c:+Lint Typecheck Vitest-changed} Scan · Go: $([ -n "$gf" ] && echo voll || echo "${gp:-–}") · Workbench: $([ -n "$wf" ] && echo voll || echo "${wp:-–}")${wv:+ Vitest}${wa:+ assetkit} · Starter: ${sg}${sl}${sv}"
          # JS und Go laufen parallel; innerhalb nacheinander.
          (
            # Papierschnitt-Bilder sind nicht eingecheckt (B-737): rendern, bei unveränderten Quellen sofort fertig.
            task gen:paper || exit 1
            bunx vitest run $scan || exit 1
            if [ -n "$c" ]; then
              task lint && task typecheck && bunx vitest run --changed "$base" --passWithNoTests || exit 1
            fi
            [ -z "$wv" ] || task k3c-workbench:vitest VITEST_ARGS="--changed $base --passWithNoTests" || exit 1
            [ -z "$sv" ] || task k3c-starter:vitest || exit 1
          ) & js=$!
          (
            if [ -n "$gf" ]; then task go:test GO_TEST_FLAGS=-short && task go:lint || exit 1
            elif [ -n "$gp" ]; then task go:test GO_TEST_FLAGS=-short GO_PKGS="$gp" && { [ -z "$gl" ] || task go:lint GO_LINT_PKGS="$gl"; } || exit 1; fi
            if [ -n "$wf" ]; then task k3c-workbench:gotest GO_TEST_FLAGS=-short && task k3c-workbench:lint || exit 1
            elif [ -n "$wp$wa" ]; then
              k=0; [ -z "$wa" ] || k=1
              { [ -z "$wp" ] || task k3c-workbench:gotest GO_TEST_FLAGS=-short WB_PKGS="$wp" ASSETKIT=$k; } &&
              { [ -z "$wl$wa" ] || task k3c-workbench:lint WB_LINT_PKGS="${wl:-./...}" ASSETKIT=$k; } || exit 1
            fi
            [ -z "$sg" ] || task k3c-starter:gotest GO_TEST_FLAGS=-short || exit 1
            [ -z "$sl" ] || task k3c-starter:lint || exit 1
          ) & gopid=$!
          r1=0; r2=0; wait $js || r1=$?; wait $gopid || r2=$?
          [ $r1 -eq 0 ] && [ $r2 -eq 0 ] || { echo "❌ check:diff fehlgeschlagen (JS $r1, Go $r2)"; exit 1; }
          echo "✅ check:diff grün"

  check:dev:
    desc: k3c-workbench prüfen (Frontend mit Vitest, go test, golangci-lint)
    cmds:
      - task: k3c-workbench:frontend
      - task: k3c-workbench:test
      - task: k3c-workbench:lint

  check:starter:
    desc: Windows-Starter prüfen (Frontend-Vitest, go test, golangci-lint; B-041)
    cmds:
      - task: k3c-starter:test
      - task: k3c-starter:lint

  check:all:
    desc: Alles prüfen (Client, Go, k3c-workbench, Starter, Build)
    cmds:
      - task: check
      - task: build
      - task: check:go
      - task: check:race
      - task: check:dev
      - task: check:starter
