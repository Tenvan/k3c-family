# CI: Lint, Typecheck, Tests der Wurzel (Regeln, Planung, Papierschnitt); Rust-Spiel: fmt, clippy, Tests und Paket dist/k3c-game (EXE ≤ 40 MB, data, Grafik) unter Windows; Rust-Werkzeuge rust/tools samt Tauri-Apps: fmt, clippy, Tests unter Windows; k3c-workbench und k3c-studio: Frontend (Typecheck, Vitest) unter Windows. Tests nur nach dem Merge (Push auf main) oder von Hand (workflow_dispatch); im Pull Request nur Merge-Konflikt-Prüfung, Tests laufen lokal vor dem Push (task check).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull Request: nur prüfen, ob der Branch sauber in die Zielbranch passt. Die übrigen Jobs laufen nur bei Push/Dispatch.
  merge-konflikte:
    name: Merge-Konflikte
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Zielbranch probeweise einmergen
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}"

  check:
    if: github.event_name != 'pull_request'
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      # Wie lokal: Wurzel und Frontend von k3c-workbench, deren Komponententests (React, Radix) laufen in task test mit.
      - run: task install
      - run: task lint
      - run: task typecheck
      # Vitest (Regel-, Planungs- und Papierschnitt-Tests; rendert vorher gen:paper). Der Browser-Build entfällt (B-848),
      # das Rust-Spiel baut der Job rust; die GitHub-Pages-Seite site/ baut nichts (B-507).
      - run: task test

  # Rust-Workspace (Projekt RSU, RU1.3): nur Windows (MSVC), wie das Spiel. `rustup show` installiert die Toolchain aus
  # rust/rust-toolchain.toml; es laufen nur Tests ohne Fenster und GPU. Danach baut `task rust:game:build` das Paket
  # dist/k3c-game (RU35.3): Release-EXE, Grafik (gen:paper), data, LIZENZEN.txt; tools/sync und tools/rustpaket laufen unter bun.
  rust:
    if: github.event_name != 'pull_request'
    name: Rust · fmt · clippy · Tests · Paket (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Cheat-Fenster (RU56, B-1135): eigene EXE neben dem Spiel; Datei und Größe (höchstens 5 MB) prüft `task rust:game:dist:check`
      - run: cargo test -p k3c-devproto -p k3c-devwin
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: task rust:game:build
        working-directory: .
      # Paket prüfen (RU57, B-1137): Pflicht- und verbotene Dateien, EXE höchstens 40 MB (Schwelle G1, B-1016), LIZENZEN.txt
      # mit Crate-Abschnitten. Der Bau ruft dieselbe Prüfung schon; der eigene Schritt macht ein Scheitern sichtbar. Kein Artefakt-Upload.
      - name: Paket prüfen
        working-directory: .
        run: task rust:game:dist:check

  # Rust-Werkzeuge (RU66.1, Entscheidung 014): eigener Workspace rust/tools/ (k3c-kit, später Studio und Workbench mit
  # Tauri). Läuft nur, wenn rust/tools/ oder die Frontends geändert sind (eigener Filter über git diff, keine weitere
  # Action); von Hand (workflow_dispatch), beim ersten Push und nach Force-Push immer. Cache mit eigenem Schlüssel.
  tools-rust:
    if: github.event_name != 'pull_request'
    name: Rust-Werkzeuge · fmt · clippy · Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust/tools
    steps:
      - uses: actions/checkout@v7
      # Einige Tests rufen bun oder task auf oder brauchen die gerenderte Grafik; ohne sie bestehen sie, ohne zu prüfen.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: task gen:paper
        working-directory: .
      # Ohne Pfadfilter: Die Tests lesen auch data/, public/grafik, tools/paper, testdata/, docs/ und Crates aus rust/.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/tools/target
          key: tools-rust-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/tools/Cargo.lock') }}
          restore-keys: tools-rust-${{ runner.os }}-
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Die Apps selbst baut und prüft der Job tools-rust (Tauri, RU66.1); hier nur die Oberflächen.
  k3c-workbench:
    if: github.event_name != 'pull_request'
    name: k3c-workbench · Frontend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      # Der Typecheck des Frontends prüft auch die Tests; vitest kommt aus dem Hauptprojekt, die Konfiguration
      # (Alias @webkit) aus tools/k3c-workbench/frontend/vitest.config.ts.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-workbench/frontend
      - run: task k3c-workbench:frontend
      - run: task k3c-workbench:vitest

  k3c-studio:
    if: github.event_name != 'pull_request'
    name: k3c-studio · Frontend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-studio/frontend
      - run: task k3c-studio:frontend
      - run: task k3c-studio:vitest
