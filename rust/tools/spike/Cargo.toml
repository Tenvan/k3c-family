[package]
name = "k3c-spike-tauri"
version = "0.1.0"
edition = "2024"
publish = false
description = "RU65.1: Spike Tauri 2 mit Workbench-Frontend, Command, Event und MCP-Server (rmcp, Streamable HTTP)"

# Eigener Workspace: der Spike gehört nicht zu rust/.
[workspace]

[lib]
name = "spike_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "macros", "sync", "time"] }
axum = "0.8"
rmcp = { version = "3.11", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# `tauri build` setzt custom-protocol: Frontend aus dist/ eingebettet statt devUrl.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
