# Grenzen aus docs/arbeitsweise.md › Komplexitäts-Budget, wie im Hauptmodul (.golangci.yml im Repo).
# Dateilänge und Verschachtelung prüfen tests/projectRules.test.ts und engine/internal/rules/nesting_test.go.
version: "2"

linters:
  enable:
    - funlen
    - gocyclo
    - depguard
  settings:
    depguard:
      rules:
        # WZ63: Das Studio importiert die Workbench nie; was beide brauchen, liegt in tools/workkit.
        studio-ohne-workbench:
          deny:
            - pkg: k3c/tools/k3c-workbench
              desc: "k3c-studio importiert die Workbench nicht (WZ63); Gemeinsames gehört nach tools/workkit"
        # B-924 (wie in der Workbench): Engine im Prozess nur über engine/simcli und engine/store; Räume nur in
        # internal/studioview („Im Spiel ansehen“ mit eingebundener Engine).
        studio-ohne-raum:
          files: ["$all", "!**/internal/studioview/**"]
          deny:
            - pkg: k3c/engine/room
              desc: "Räume nur über studioview (B-726, B-924)"
            - pkg: k3c/engine/net
              desc: "Protokoll nur über den laufenden Spielserver (B-726)"
            - pkg: k3c/engine/enginetools
              desc: "Engine-Aufrufe über engine/simcli (B-924)"
            - pkg: k3c/engine/balance
              desc: "Balancing über engine/simcli balance (B-924)"
        studio-devrun-nur-wurzel:
          files: ["$all", "!**/tools/k3c-studio/*.go"]
          deny:
            - pkg: k3c/engine/devrun
              desc: "engine/devrun nur im Supervisor in der Wurzel des Pakets (headless.go)"
    funlen:
      lines: 60
      statements: -1
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]
