<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3C Entwicklung</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; }
      * { box-sizing: border-box; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.4 system-ui, sans-serif; }
      main { padding: max(4.75rem, 70px) 2rem 2rem; max-width: 80rem; margin: 0 auto; }
      h1 { font-size: 2.125rem; margin: 0 0 4px; }
      .sub { color: var(--dim); margin: 0 0 1.5rem; max-width: 55rem; }
      section + section { margin-top: 2rem; }
      h2 { font-size: 1.5rem; margin: 0 0 0.75rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; }
      .empty { color: var(--dim); margin: 0; }
      button { font: inherit; color: inherit; text-align: left; cursor: pointer; background: var(--panel); border: 2px solid var(--line); border-radius: 0.75rem; padding: 1rem 1.25rem; }
      button:hover, button:focus-visible { border-color: var(--on); outline: none; }
      button strong { display: block; font-size: 1.5rem; color: var(--on); margin-bottom: 0.25rem; }
      button span { color: var(--dim); font-size: 1rem; }
      #note { min-height: 1.5em; margin-top: 1.5rem; color: var(--on); }
    </style>
  </head>
  <body>
    <main>
      <h1>Entwicklung</h1>
      <p class="sub">Werkzeuge für Entwicklung, Performance und Balancing. Die meisten brauchen den laufenden Go-Server.</p>
      <div id="sections"></div>
      <p id="note"></p>
    </main>
    <script type="module" src="/src/tools/dev.ts"></script>
  </body>
</html>
