# Harte Grenzen aus docs/arbeitsweise.md › Komplexitäts-Budget und die Go-Schichtgrenzen.
# Die Dateilänge prüft tests/projectRules.test.ts (golangci-lint hat dafür keinen Linter, B-050).
# Die Verschachtelung prüft tests/nesting_test.go (go/ast), gezählt wie Oxlint max-depth; die Linter aus
# golangci-lint zählen for range bzw. else if anders (B-054, B-057).
version: "2"

linters:
  enable:
    - funlen
    - gocyclo
    - depguard
  settings:
    funlen:
      lines: 60
      statements: -1
    gocyclo:
      min-complexity: 15
    depguard:
      rules:
        engine-ohne-cmd:
          files: ["**/engine/**"]
          deny:
            - pkg: k3c/cmd
              desc: "engine/ importiert nichts aus cmd/ (docs/arbeitsweise.md › Schichtgrenzen)"
        sim-ohne-netz:
          files: ["**/engine/sim/**", "**/engine/level/**"]
          deny:
            - pkg: k3c/engine/room
              desc: "engine/sim und engine/level kennen keine Räume"
            - pkg: k3c/engine/net
              desc: "engine/sim und engine/level kennen kein Netz"
  exclusions:
    rules:
      - path: _test\.go
        linters: [funlen]
