# Namespace `rust`: Rust-Workspace rust/ (Projekt RSU, Umstieg von Go auf Rust nach G0, B-1014). Workspace, Crates und
# Port-Leitfaden: docs/standards/rust-port.md. Das Spiel: `rust:game:exe`, `:build`, `:run`, `:dev` (RU35); Paket nach PAKET.
version: '3'

vars:
  # Paketordner des Rust-Spiels (RU35.2)
  PAKET: '{{.ROOT_DIR}}/dist/k3c-game'
  # Version des Spiels (B-1138): git describe nur über Versions-Tags v*, sonst zeigte sie Tags wie go-referenz-final (RU56); ohne Git leer (das Menü zeigt dann „unbekannt“)
  VERSION:
    sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || true

tasks:
  build:
    desc: Rust-Workspace bauen (cargo build --workspace)
    dir: rust
    cmds:
      - cargo build --workspace

  test:
    desc: "Rust-Tests des Workspace (cargo test --workspace); Filter: task rust:test -- -p k3c-sim"
    dir: rust
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  lint:
    desc: Rust-Lint (cargo clippy mit -D warnings, alle Ziele)
    dir: rust
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    desc: Rust formatieren (cargo fmt --all)
    dir: rust
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Rust-Format prüfen, ohne zu schreiben (cargo fmt --all --check)
    dir: rust
    cmds:
      - cargo fmt --all --check

  # run: startet das Spiel (Hauptmenü, Neues Spiel). Arbeitsordner ist die Repo-Wurzel, damit public/grafik, public/schrift
  # und public/rig gefunden werden. gen:paper rendert die Grafik, die nicht eingecheckt ist (B-737); es arbeitet
  # nur bei geänderten Quellen. Schalter des Spiels hinter `--`, z. B. `task rust:run -- --saves saves-test`.
  run:
    desc: "Rust-Spiel starten (Release): Hauptmenü, Neues Spiel; rendert die Grafik bei Bedarf (gen:paper); Schalter: task rust:run -- --players 1"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: :gen:paper
      - cargo run --release --manifest-path rust/Cargo.toml -p k3c-game -- {{.CLI_ARGS}}

  # game:*: das Spiel als EXE-Projekt (RU35.1): exe (Release-EXE), build (EXE, Grafik, Paket nach PAKET), run (Paket bauen
  # und starten), dev (Debug-Bau, Start aus der Repo-Wurzel). Kopiert wird mit tools/sync (nur Geändertes, Ordner
  # zusammengeführt; der Umzug des Werkzeugs gehört zu RU37). Das Rust-Spiel lädt ganz public/grafik (kein --assets-Filter)
  # und die Rig-Teile relativ (public/rig, DEFAULT_RIG_DIR).
  game:exe:
    desc: "Nur die Release-EXE des Rust-Spiels bauen (cargo build --release -p k3c-game) nach rust/target/release/"
    dir: '{{.ROOT_DIR}}/rust'
    # ohne sources/generates: Cargo baut selbst inkrementell (Shader, include_str!-Daten, Toolchain wären sonst blinde Flecken)
    # K3C_VERSION liest main.rs per option_env! (Cargo baut bei neuer Version neu, B-1138)
    env:
      K3C_VERSION: '{{.VERSION}}'
    cmds:
      - cargo build --release -p k3c-game

  # devwin:exe: das Cheat-Fenster (RU56, B-1135) als eigene Release-EXE neben dem Spiel; F4 im Spiel startet sie.
  devwin:exe:
    desc: "Cheat-Fenster k3c-devwin.exe bauen (cargo build --release -p k3c-devwin) nach rust/target/release/"
    dir: '{{.ROOT_DIR}}/rust'
    cmds:
      - cargo build --release -p k3c-devwin

  game:build:
    desc: "Rust-Spiel bauen: Release-EXE, Cheat-Fenster, Papierschnitt-Grafik (gen:paper) und das Paket (EXE, data, Grafik, Ton, Schrift, Rig-Teile) in den Paketordner (nur Geändertes wird kopiert; laufendes Spiel dort vorher schließen)"
    deps: [game:exe, devwin:exe, ':gen:paper', ':tmp']
    cmds:
      - task: game:dist

  game:dist:
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - mkdir -p "{{.PAKET}}"
      - |
        set -e
        p="{{.PAKET}}"
        if [ ! -d public/grafik ]; then echo "❌ public/grafik fehlt: erst task gen:paper"; exit 1; fi
        args="{{.ROOT_DIR}}/rust/target/release/k3c-game.exe=$p/k3c-game.exe {{.ROOT_DIR}}/data=$p/data {{.ROOT_DIR}}/public/grafik=$p/public/grafik {{.ROOT_DIR}}/public/rig=$p/public/rig {{.ROOT_DIR}}/public/audio=$p/public/audio {{.ROOT_DIR}}/LICENSE=$p/LICENSE {{.ROOT_DIR}}/LICENSE-ASSETS=$p/LICENSE-ASSETS {{.ROOT_DIR}}/rust/paket/README.txt=$p/README.txt"
        if [ -d public/schrift ]; then args="$args {{.ROOT_DIR}}/public/schrift=$p/public/schrift"; fi
        bun tools/sync/main.ts $args
        # Spieldaten ohne Doku
        rm -f "$p"/data/*.md "$p"/data/*/*.md
      # Cheat-Fenster neben die Spiel-EXE (RU56, B-1135)
      - cp "{{.ROOT_DIR}}/rust/target/release/k3c-devwin.exe" "{{.PAKET}}/k3c-devwin.exe"
      # Lizenzdatei (B-1121): Liste der Lizenz-Seite (`k3c-game licenses`) plus Lizenztexte aller gelinkten Rust-Crates
      # (tools/rustpaket, `cargo metadata`); erst in eine .tmp-Datei, damit ein Abbruch keine halbe Datei hinterlässt
      - 'bun tools/rustpaket/main.ts lizenzen -exe "{{.PAKET}}/k3c-game.exe" -rust rust > "{{.PAKET}}/LIZENZEN.txt.tmp" && mv "{{.PAKET}}/LIZENZEN.txt.tmp" "{{.PAKET}}/LIZENZEN.txt"'
      # Paketliste prüfen (B-1137): Pflichtdateien, keine Go- oder Entwickler-Reste, EXE-Größe; -lokal duldet saves/, reports/
      # und trace/, die beim Spielen aus dem Paketordner entstehen (der strenge Lauf `game:dist:check` und die CI melden sie)
      - bun tools/rustpaket/main.ts pruefen -lokal "{{.PAKET}}"
      - 'echo "✅ Rust-Spiel in {{.PAKET}} (Start: k3c-game.exe)"'

  game:dist:check:
    desc: "Rust-Paket prüfen (ohne Neubau): Pflicht- und verbotene Dateien, EXE höchstens 40 MiB, Lizenzdatei mit Crate-Abschnitten (tools/rustpaket pruefen)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun tools/rustpaket/main.ts pruefen "{{.PAKET}}"

  game:run:
    desc: "Rust-Spiel bauen (game:build) und aus dem Paket-Ordner starten; Schalter: task rust:game:run -- --players 1"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: game:build
      - 'cd "{{.PAKET}}" && ./k3c-game.exe {{.CLI_ARGS}}'

  game:measure:
    desc: "Rust-Spiel messen (Frame-Zeit, Start, Speicher; tools/measure/measure.ps1 -Engine rustgame, Messlauf mit Fenster auf ruhigem Rechner); Schalter: task rust:game:measure -- -Seconds 60"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/tools/measure/measure.ps1" -Engine rustgame {{.CLI_ARGS}}

  game:dev:
    desc: "Rust-Spiel im Debug-Bau starten (Arbeitsordner Repo-Wurzel, findet data/ und Grafik direkt); kein Neustart bei Änderungen (cargo-watch wäre ein neues Werkzeug)"
    dir: '{{.ROOT_DIR}}'
    deps: [':gen:paper']
    cmds:
      - cargo build --manifest-path rust/Cargo.toml -p k3c-game
      - '"{{.ROOT_DIR}}/rust/target/debug/k3c-game.exe" {{.CLI_ARGS}}'
