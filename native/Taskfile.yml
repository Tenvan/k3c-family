# Namespace `native`: natives Spiel in Go + Ebitengine (Projekt NAT, Entscheidung 008) und seine Prototypen.
# Ebitengine-Prototyp (Sprint NV1, B-776): eigenes Go-Modul unter native/k3c-ebiten (nicht Teil des Moduls `k3c`),
# Version in go.mod festgelegt, ohne cgo. Der Rust-Vergleichs-Prototyp ist entfallen (B-779).
# Grafik kommt aus public/grafik (vorher `task gen:paper`); die Figuren des Ebitengine-Levels zeichnet er seit NV3.3 aus den
# Rig-Teilen unter native/k3c-rig/assets (Pakete rig und paint per replace eingebunden, `--art sheet` wie vorher).
# Rig-Prototyp (Sprint NV2, B-778): eigenes Go-Modul unter native/k3c-rig; seine Teil-Bilder und Rig-Dateien sind eingecheckt
# (native/k3c-rig/assets, `rig:export` schreibt sie neu), Bauen und Starten braucht keinen Gen-Lauf.
# Natives Spiel (Sprint NG1, B-792): eigenes Go-Modul unter native/k3c-game (`game:build`, `game`), ohne cgo.
version: '3'

vars:
  EBITEN: '{{.ROOT_DIR}}/native/k3c-ebiten'
  EBITEN_EXE: '{{.ROOT_DIR}}/native/k3c-ebiten/bin/k3c-ebiten.exe'
  MEASURE: 'powershell -NoProfile -ExecutionPolicy Bypass -File "{{.ROOT_DIR}}/native/measure.ps1"'
  PAKET: '{{.ROOT_DIR}}/.work/native-ebiten'
  # Rig-Prototyp (Sprint NV2, B-778): eigenes Go-Modul unter native/k3c-rig, Teile und Rig-Dateien eingecheckt in assets/
  RIG: '{{.ROOT_DIR}}/native/k3c-rig'
  RIG_EXE: '{{.ROOT_DIR}}/native/k3c-rig/bin/k3c-rig.exe'
  RIG_PAKET: '{{.ROOT_DIR}}/.work/native-rig'
  # Natives Spiel (Sprint NG1, B-792): eigenes Go-Modul unter native/k3c-game, bindet k3c und k3c-rig per replace ein
  GAME: '{{.ROOT_DIR}}/native/k3c-game'
  GAME_EXE: '{{.ROOT_DIR}}/native/k3c-game/bin/k3c-game.exe'
  GAME_PAKET: '{{.ROOT_DIR}}/.work/native-game'

tasks:
  ebiten:build:
    desc: "Ebitengine-Prototyp bauen (Go, ohne cgo) nach native/k3c-ebiten/bin/"
    dir: '{{.EBITEN}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '*.go'
      - go.mod
      - go.sum
      # Pakete rig und paint aus dem Rig-Prototyp (replace in go.mod, NV3.3)
      - ../k3c-rig/rig/*.go
      - ../k3c-rig/paint/*.go
      - ../k3c-rig/go.mod
    generates:
      - bin/k3c-ebiten.exe
    cmds:
      - go build -o bin/k3c-ebiten.exe .

  ebiten:
    desc: "Ebitengine-Prototyp starten (Spieler 1: Pad 1 oder A/D, Spieler 2: Pad 2 oder ←/→)"
    deps: [ebiten:build]
    cmds:
      - '"{{.EBITEN_EXE}}" --root "{{.ROOT_DIR}}"'

  game:build:
    desc: "Natives Spiel bauen (Go, ohne cgo) nach native/k3c-game/bin/"
    dir: '{{.GAME}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
      # Simulation und Balancing aus dem Wurzel-Modul (replace k3c => ../..), data per go:embed
      - ../../go.mod
      - ../../engine/sim/*.go
      - ../../engine/level/*.go
      - ../../engine/rng/*.go
      - ../../data/**/*
    generates:
      - bin/k3c-game.exe
    cmds:
      - go build -o bin/k3c-game.exe .

  game:
    desc: "Natives Spiel starten (Platzhalter; Menü: Leertaste/Enter/A, Mitspieler: Bestätigen, Spiel: A/D bzw. Pfeile bzw. Stick, Esc/Menu Pause; direkt ins Spiel: task native:game -- --seed wald)"
    dir: '{{.ROOT_DIR}}'
    deps: [game:build]
    cmds:
      - '"{{.GAME_EXE}}" {{.CLI_ARGS}}'

  game:shots:
    desc: "Natives Spiel, Aufnahme-Modus: Szene vorlaufen lassen, 8 Bilder alle 3 Takte und Streifen nach reports/native-game-shots/ (Schalter anhängen: task native:game:shots -- --seed x --tick 300)"
    dir: '{{.ROOT_DIR}}'
    deps: [game:build]
    cmds:
      - '"{{.GAME_EXE}}" --shots "{{.ROOT_DIR}}/reports/native-game-shots" --tick 90 {{.CLI_ARGS}}'

  game:e2e:
    desc: "Natives Spiel Ende-zu-Ende (NG9.1, B-802): Hauptmenü → Lobby zu zweit → Spiel (laufen, zahlen, bauen, Skill, Nacht) → Pause → Verlassen → Weiter → Niederlage ohne Fenster prüfen, dann zweimal aufnehmen und bildgleich vergleichen; Bilder nach reports/native-game-e2e/"
    dir: '{{.GAME}}'
    deps: [game:build]
    env:
      CGO_ENABLED: '0'
      K3C_GAME_EXE: '{{.GAME_EXE}}'
      K3C_ROOT: '{{.ROOT_DIR}}'
      K3C_E2E_OUT: '{{.ROOT_DIR}}/reports/native-game-e2e'
    cmds:
      - go test -count=1 -run 'TestFlow' ./e2e/

  game:measure:
    desc: "Natives Spiel messen (NG9.2, B-802): Fenster 1920×1080, VSync aus, 2 Spieler, je einmal Tag und Nacht mit Gegnern (FPS, 1-%-Low, Rechenzeit je Bild und Takt, Texturbudget, GPU-Speicher, RAM), Bericht nach reports/native-game-*.json"
    deps: [game:build]
    cmds:
      - '{{.MEASURE}} -Engine game'

  game:paket:
    desc: "Paket für den Mini-PC nach .work/native-game/ (EXE, nur die geladenen Ordner aus public/grafik, public/audio, Rig-Teile, Messskript) und Probe-Aufnahme aus dem Paket-Ordner nach .work/native-game-probe/; dort k3c-game.exe oder messen.cmd starten"
    dir: '{{.ROOT_DIR}}'
    deps: [game:build]
    cmds:
      - rm -rf "{{.GAME_PAKET}}" "{{.GAME_PAKET}}-probe"
      - mkdir -p "{{.GAME_PAKET}}/public/grafik" "{{.GAME_PAKET}}/native/k3c-rig"
      - cp "{{.GAME_EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.GAME_PAKET}}/"
      # nur die Grafik, die das Spiel laden kann (k3c-game --assets: je Zeile gruppe/id aller Level)
      - '"{{.GAME_EXE}}" --assets > "{{.GAME_PAKET}}/assets.txt"'
      - 'for a in $(cat "{{.GAME_PAKET}}/assets.txt"); do mkdir -p "{{.GAME_PAKET}}/public/grafik/${a%/*}" && cp -r "public/grafik/$a" "{{.GAME_PAKET}}/public/grafik/$a" || exit 1; done'
      - cp -r public/audio "{{.GAME_PAKET}}/public/audio"
      - 'if [ -d public/schrift ]; then cp -r public/schrift "{{.GAME_PAKET}}/public/schrift"; fi'
      - cp -r "{{.RIG}}/assets" "{{.GAME_PAKET}}/native/k3c-rig/assets"
      # Probe: die EXE startet aus dem Paket-Ordner (Tag und Nacht mit Gegnern, Aufnahme-Modus)
      - 'cd "{{.GAME_PAKET}}" && ./k3c-game.exe --shots "{{.GAME_PAKET}}-probe/tag" --seed k3c --tick 300 --count 2 && ./k3c-game.exe --shots "{{.GAME_PAKET}}-probe/nacht" --seed k3c --tick 15600 --count 2 --input 0@0=-,1@0=-'

  measure:ebiten:
    desc: "Ebitengine: FPS und Grafikspeicher messen (Lastfälle level und alle, DirectX 11), Bericht nach reports/native-proto-*.json"
    deps: [ebiten:build]
    cmds:
      - '{{.MEASURE}} -Engine ebiten'

  ebiten:paket:
    desc: "Paket für den Mini-PC nach .work/native-ebiten/ (EXE, Messskript, public/grafik); dort messen.cmd starten"
    deps: [ebiten:build]
    cmds:
      - rm -rf "{{.PAKET}}"
      - mkdir -p "{{.PAKET}}/public"
      - cp "{{.EBITEN_EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.PAKET}}/"
      - cp -r "{{.ROOT_DIR}}/public/grafik" "{{.PAKET}}/public/grafik"
      # Rig-Figuren des Ebitengine-Levels (--art rig, Standard; NV3.3)
      - mkdir -p "{{.PAKET}}/native/k3c-rig"
      - cp -r "{{.RIG}}/assets" "{{.PAKET}}/native/k3c-rig/assets"

  rig:export:
    desc: "Rig-Prototyp: Teil-PNGs, Rig-Dateien, Elemente und Sollwerte nach native/k3c-rig/assets/ schreiben (eingecheckt; liest Specs und Stil nur)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun native/k3c-rig/export/export.ts

  rig:export:check:
    desc: "Rig-Prototyp: Export wiederholen und byte-genau mit native/k3c-rig/assets/ vergleichen (schreibt nichts)"
    dir: '{{.ROOT_DIR}}'
    cmds:
      - bun native/k3c-rig/export/export.ts --pruefen

  rig:test:
    desc: "Rig-Prototyp prüfen: gofmt, go vet, go test (Rig-Rechnung gegen die Sollwerte aus tools/paper)"
    dir: '{{.RIG}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    cmds:
      # gofmt ohne CR: Unter Windows (core.autocrlf=true) liegt der Arbeitsbaum mit CRLF vor, im Repo steht LF
      - 'bad=""; for f in $(find . -name "*.go"); do test -z "$(tr -d "\r" < "$f" | gofmt -l)" || bad="$bad $f"; done; test -z "$bad" || { echo "❌ gofmt:$bad"; exit 1; }'
      - go vet ./...
      - go test ./...

  rig:build:
    desc: "Rig-Prototyp bauen (Go, ohne cgo) nach native/k3c-rig/bin/"
    dir: '{{.RIG}}'
    deps: [':tmp']
    env:
      CGO_ENABLED: '0'
    sources:
      - '*.go'
      - rig/*.go
      - paint/*.go
      - go.mod
      - go.sum
    generates:
      - bin/k3c-rig.exe
    cmds:
      - go build -o bin/k3c-rig.exe .

  rig:
    desc: "Rig-Prototyp starten: links Sheet, rechts Rig-Teile, zwei Monarchen (Tastatur oder je ein Gamepad; Tasten stehen im Fenster)"
    deps: [rig:build]
    cmds:
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}"'

  rig:shots:
    desc: "Rig-Prototyp: Screenshots aller Zustände nach reports/native-rig-shots/"
    deps: [rig:build]
    cmds:
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}" --shots "{{.ROOT_DIR}}/reports/native-rig-shots"'

  rig:vergleich:
    desc: "Rig-Prototyp: Bildvergleich Rig gegen Sheet (idle, lauf, trab) nach reports/native-rig-vergleich/ (Kennzahlen und Differenzbilder; braucht task gen:paper)"
    deps: [rig:build]
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/reports/native-rig-vergleich"
      - '"{{.RIG_EXE}}" --root "{{.ROOT_DIR}}" --vergleich "{{.ROOT_DIR}}/reports/native-rig-vergleich"'

  rig:measure:
    desc: "Rig-Prototyp messen: 2, 50 und 200 Reiter als Rig und aus dem Sheet (FPS, GPU-Speicher, RAM), Bericht nach reports/native-rig-*.json"
    deps: [rig:build]
    cmds:
      - '{{.MEASURE}} -Engine rig'

  rig:paket:
    desc: "Paket für den Mini-PC nach .work/native-rig/ (EXE, assets, Messskript, Sheets des Monarchen); dort k3c-rig.exe oder messen.cmd starten"
    deps: [rig:build]
    cmds:
      - rm -rf "{{.RIG_PAKET}}"
      - mkdir -p "{{.RIG_PAKET}}/public/grafik/figuren"
      - cp "{{.RIG_EXE}}" "{{.ROOT_DIR}}/native/measure.ps1" "{{.ROOT_DIR}}/native/messen.cmd" "{{.RIG_PAKET}}/"
      - cp -r "{{.RIG}}/assets" "{{.RIG_PAKET}}/assets"
      - cp -r "{{.ROOT_DIR}}/public/grafik/figuren/monarch" "{{.RIG_PAKET}}/public/grafik/figuren/monarch"
