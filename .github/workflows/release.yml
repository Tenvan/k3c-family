# Release: Tag v* (z.B. v0.2.0) → Rust-Spiel für Windows (task rust:game:build, Paket dist/k3c-game/ mit LIZENZEN.txt, geprüft
# von rust:game:dist:check) als Zip am GitHub-Release (RU57, B-1122). Das Go-Spiel (dist/k3c-game-go) wird nicht mehr
# ausgeliefert. Browser-Client, Spielserver und Docker-Image sind entfernt (B-848, B-887).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Windows (MSVC) wie der CI-Job rust.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe für die Version im Spiel (K3C_VERSION, B-1138)
      - run: rustup show
        working-directory: rust
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Go: cmd/sync (Kopierwerkzeug) und tools/rustpaket (LIZENZEN.txt, Paketprüfung)
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/k3c-game/go.mod
          cache-dependency-path: native/k3c-game/go.sum
      - uses: go-task/setup-task@v2
      # Papierschnitt-Renderer (gen:paper) braucht die Werkzeuge der Wurzel.
      - run: bun install --frozen-lockfile
      # Vor dem Paket: Tests ohne Fenster und GPU (wie CI-Job rust).
      - run: cargo test --workspace
        working-directory: rust
      - run: task rust:game:build
      # streng (ohne -lokal): keine saves/, reports/, trace/, keine Go-Reste
      - run: task rust:game:dist:check
      - name: Paket schnüren (Rust-Spiel)
        shell: pwsh
        run: Compress-Archive -Path dist/k3c-game/* -DestinationPath "k3c-$env:GITHUB_REF_NAME-windows.zip"
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "k3c-${GITHUB_REF_NAME}-windows.zip" --generate-notes --title "K3C $GITHUB_REF_NAME"
