# Release: Tag v* (z.B. v0.2.0) → Build als Zip am GitHub-Release. Spielserver und Docker-Image sind entfernt (B-887).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - run: task install
      # Vor Paket und Image: Typecheck und Tests (Client und Frontends, wie lokal task check); task test rendert vorher
      # die Papierschnitt-Grafik (gen:paper). Nach dem Pi-Test v0.22.0 wieder eingeschaltet (B-758).
      - run: task typecheck
      - run: task test
      - run: task build
      - name: Paket schnüren (dist)
        run: zip -r "k3c-${GITHUB_REF_NAME}.zip" dist README.md
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "k3c-${GITHUB_REF_NAME}.zip" --generate-notes --title "K3C $GITHUB_REF_NAME"
