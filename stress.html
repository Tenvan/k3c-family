<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="stress.pageTitle">K3C Stress-Szene</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: #000; color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
      #menu { position: fixed; inset: 0; overflow: auto; background: var(--bg); padding: max(4.75rem, 70px) 12px 12px; }
      #menu main { max-width: 48rem; margin: 0 auto; }
      h1 { font-size: 1.6rem; margin: 0 0 4px; }
      .dim { color: var(--dim); }
      #buttons { display: grid; gap: 8px; margin: 16px 0; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
      button { font: inherit; color: var(--text); background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 12px; min-height: 56px; cursor: pointer; }
      button:focus-visible, button:hover { border-color: var(--on); outline: none; }
      #back { position: fixed; right: 12px; bottom: 12px; z-index: 5; }
      #error { color: #ff6b6b; }
      [hidden] { display: none !important; }
      #game { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="menu">
      <main>
        <h1>🔥 <span data-t="stress.title">Stress-Szene</span></h1>
        <p class="dim" data-t="stress.sub">Figuren-Dichte testen.</p>
        <div id="buttons"></div>
        <p id="error" role="alert"></p>
      </main>
    </div>
    <button id="back" type="button" hidden data-t="stress.back">Zurück zum Menü</button>
    <script type="module" src="/src/stress/main.ts"></script>
  </body>
</html>
