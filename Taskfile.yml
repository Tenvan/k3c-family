# Einstieg für alle Aufgaben: `task --list` (Voraussetzung: Go Task, requirements.md).
# Die Werkzeuge laufen direkt (bunx, cargo); package.json hält nur noch Abhängigkeiten.
#
# Aufbau: Dieses Taskfile hält die Kernbefehle ohne Namensraum (Workspace) und die Prüf-Aggregate `check:*`.
# Alles andere liegt als eigenes Taskfile im Ordner des Projekts und erscheint hier unter dem Namen des Projekts
# (die Workbench gruppiert nach dem Namensraum vor dem Doppelpunkt):
#
#   k3c-workbench      tools/k3c-workbench/Taskfile.yml     Workbench (Tauri): dev (Client/Server), window (tauri dev), build, run, frontend, test, lint
#   k3c-studio   tools/k3c-studio/Taskfile.yml  Studio (Welten, Assets, Hub; Tauri): dev (Client/Server), window, build, run, headless, frontend, test, lint
#   balance      rust/crates/k3c-balance/Taskfile.yml  Balancing-Tester (Handweg; Läufe rechnet die Spiel-EXE)
#   gen          tools/Taskfile.yml             Generatoren: Atlas, Gebäude, Grafik-Pipeline, Regeltabelle
#   ops          scripts/Taskfile.yml           Betrieb: Aufräumen, Spielstände sichern
#   tools-rust   rust/tools/Taskfile.yml   Rust-Werkzeuge (k3c-kit, Asset-Logik, Workbench, Studio): build, test, lint, fmt
#
# Gruppen dieses Taskfiles (in dieser Reihenfolge): Einrichten (install) · Werkzeuge und Tests (lint, typecheck, test) · Bauen und Ausliefern
# (build, buildall, pages) · Prüfen (check, check:diff, check:dev, check:all).
#
# Jedes EXE-Projekt kennt dieselben Verben: `build` (EXE bauen), `run` (bauen und starten), `dev` (Workbench und Studio: Rust-Backend mit
# `--headless`, die Oberfläche über Vite im Browser). Der Name des Projekts allein (`task k3c-workbench`) startet `dev`.
version: '3'

# Temporäre Dateien von cargo, bun und den Tests liegen im Repo unter `.work/tmp` statt in %TEMP%
# (Regel "Schreiben nur im Repo", Ralf 2026-11-18). Norton-Ausnahme: `<Repo>\.work`.
vars:
  K3C_TMP: '{{.ROOT_DIR}}/.work/tmp'

env:
  TMP: '{{.K3C_TMP}}'
  TEMP: '{{.K3C_TMP}}'

includes:
  k3c-workbench: tools/k3c-workbench/Taskfile.yml
  k3c-studio: tools/k3c-studio/Taskfile.yml
  balance: rust/crates/k3c-balance/Taskfile.yml
  gen: tools/Taskfile.yml
  ops: scripts/Taskfile.yml
  rust: rust/Taskfile.yml
  tools-rust: rust/tools/Taskfile.yml

tasks:
  # Legt das feste Temp-Verzeichnis für cargo, bun und Tests an (auch in der CI und in frischen Klonen ohne `task install`).
  # Die Taskfiles der Projekte rufen es als `:tmp` auf.
  tmp:
    internal: true
    run: once
    cmds:
      - mkdir -p '{{.K3C_TMP}}'

  default:
    desc: Alle Aufgaben anzeigen
    silent: true
    cmds:
      - task --list

  # --- Einrichten ---------------------------------------------------------------------------------------------------

  install:
    desc: Abhängigkeiten holen (Werkzeuge und Tests der Wurzel, Frontends von k3c-workbench und k3c-studio)
    cmds:
      - mkdir -p '{{.K3C_TMP}}'
      - bun install --frozen-lockfile
      - bun install --frozen-lockfile --cwd tools/k3c-workbench/frontend
      - bun install --frozen-lockfile --cwd tools/k3c-studio/frontend

  # Die Golden unter testdata/ sind das Orakel und seit RU41 eingefroren (nur lesend).
  golden-setup:
    desc: "Einmal je Klon: git zeigt Diffs der gepackten Golden-Dateien (*.json.gz) als JSON-Text (GD1, B-624)"
    cmds:
      - git config diff.gzip.textconv "gzip -dc"

  # --- Werkzeuge und Tests der Wurzel (tests/, tools/paper; der Browser-Client ist entfernt, B-848) ------------------

  lint:
    desc: Oxlint
    cmds:
      - bunx oxlint

  typecheck:
    desc: tsc für tests/ und tools/paper
    cmds:
      - bunx tsc --noEmit

  test:
    desc: Vitest (Filter optional, z. B. `task test -- planning`); rendert vorher die Papierschnitt-Grafik (gen:paper, B-737)
    deps: [gen:paper]
    cmds:
      - bunx vitest run {{.CLI_ARGS}}

  test:watch:
    desc: Vitest im Watch-Modus
    cmds:
      - bunx vitest

  # --- Bauen und Ausliefern -----------------------------------------------------------------------------------------
  # `build` baut das Rust-Spiel (dist/k3c-game/), `buildall` die Werkzeug-EXE nach bin/, `pages` die statische Präsentationsseite.

  build:
    desc: Rust-Spiel bauen (wie rust:game:build; Release-EXE, Papierschnitt-Grafik über gen:paper und Paket nach dist/k3c-game/, RU35)
    cmds:
      - task: rust:game:build

  buildall:
    desc: Alle EXE bauen (Workbench und Studio nach bin/, Rust-Spiel nach dist/k3c-game/); laufende EXE vorher schließen, sonst scheitert die Kopie
    cmds:
      - task: k3c-workbench:build
      - task: k3c-studio:build
      - task: rust:game:build

  pages:
    desc: GitHub-Pages-Seite nach _site/ (kopiert nur site/, kein Build, B-507)
    cmds:
      - rm -rf _site
      - mkdir -p _site
      - cp -r site/. _site/

  # --- Prüfen: ein Name je Projekt, `check` ist die Wurzel (Regeln, Planung, Papierschnitt) -----------------------------------------------------------

  check:
    desc: Lint, Typecheck, Tests der Wurzel (tests/, tools/paper) parallel (vor jedem Abschluss)
    deps: [lint, typecheck, test]

  # check:diff ist das Werkzeug tools/checkdiff (TypeScript unter bun, Auswahl als getestete Logik statt Shell, RU71).
  # Teilaufgaben: `check:diff:plan` zeigt nur, was laufen würde; `check:diff:js` und `check:diff:rust` wiederholen nach
  # einem roten Lauf nur die betroffene Bahn.
  check:diff:
    desc: "Vor jedem Commit: nur was die geänderten Dateien dieses Commits brauchen (Basis HEAD; `CHECK_BASE=origin/main` für den ganzen Sprint). Stufe 1 Regel-Tests, Lint, Typecheck, cargo fmt und clippy; Stufe 2 nur nach grüner Stufe 1: Vitest --changed, Tests der geänderten Crates. Ohne Sim, Balance, Gen (B-518, B-730, B-742)"
    deps: [tmp]
    cmds:
      - bun tools/checkdiff/main.ts {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}} {{.CLI_ARGS}}

  check:diff:plan:
    desc: "check:diff trocken: zeigt Basis und Schritte, führt nichts aus"
    cmds:
      - bun tools/checkdiff/main.ts -plan {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:diff:js:
    desc: "check:diff, nur die Bahn JS (Regel-Tests, Oxlint, tsc, Vitest --changed)"
    deps: [tmp]
    cmds:
      - bun tools/checkdiff/main.ts -only js {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:diff:rust:
    desc: "check:diff, nur die Bahn Rust (cargo fmt, clippy und Tests der geänderten Crates in rust/ und rust/tools/)"
    cmds:
      - bun tools/checkdiff/main.ts -only rust {{if .CHECK_BASE}}-base "{{.CHECK_BASE}}"{{end}}

  check:dev:
    desc: k3c-workbench und k3c-studio prüfen (Frontends mit Typecheck und Vitest, Tests und Lint der Rust-Werkzeuge)
    cmds:
      - task: k3c-workbench:frontend
      - task: k3c-workbench:vitest
      - task: k3c-studio:typecheck
      - task: k3c-studio:vitest
      - task: tools-rust:test
      - task: tools-rust:lint

  check:all:
    desc: Alles prüfen (Wurzel, Build des Rust-Spiels, k3c-workbench und k3c-studio samt Rust-Werkzeugen)
    cmds:
      - task: check
      - task: build
      - task: check:dev
