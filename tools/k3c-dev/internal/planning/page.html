<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprints &amp; Backlog</title>
<!-- Erzeugt von k3c-dev (internal/planning/page.go) aus docs/sprints und docs/backlog; nicht von Hand pflegen. -->
<style>
  :root { --bg: #fcfcfd; --card: #fff; --line: #dcdce3; --text: #1c2024; --dim: #6b6f78; --accent: #3e63dd;
    --accent-bg: #3e63dd1a; --ok: #2b9a66; --warn: #c27c00; --err: #dc3e42; --info: #0d74ce; --chip: #f0f0f3; }
  :root.dark { --bg: #111113; --card: #18191b; --line: #2e3135; --text: #edeef0; --dim: #9b9ea4; --accent: #7b96ff;
    --accent-bg: #7b96ff26; --ok: #3dd68c; --warn: #ffc53d; --err: #ff6369; --info: #70b8ff; --chip: #212225; }
  * { box-sizing: border-box; }
  :root { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  :hover { scrollbar-color: var(--dim) transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; }
  code { font: 12px ui-monospace, Consolas, monospace; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .bar input[type=search] { flex: 0 1 260px; min-width: 160px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--text); font: inherit; }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 999px; padding: 2px 10px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.reset { background: none; color: var(--dim); }
  .count { margin-left: auto; color: var(--dim); font-size: 12px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .col { min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .col + .col { border-left: 1px solid var(--line); }
  .right { overflow: hidden; }
  .right > .scroll { flex: 1 1 auto; min-height: 120px; overflow: auto; }
  @media (max-width: 900px) { .grid { display: block; overflow: auto; } .col, .right, .right > .scroll { overflow: visible; }
    #detail { flex: none; } .col + .col { border-left: 0; border-top: 1px solid var(--line); } }
  h2 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  h2 small { color: var(--dim); font-weight: 400; font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px; }
  .card.active { border-color: var(--accent); }
  .card.done { opacity: .65; }
  .card.wt { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok), 0 0 14px color-mix(in srgb, var(--ok) 35%, transparent); }
  .chk { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); cursor: pointer; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .head .t { flex: 1; min-width: 140px; font-weight: 600; }
  .dom { color: var(--dim); font-size: 12px; }
  .badge { --c: var(--dim); font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); white-space: nowrap; }
  .ok { --c: var(--ok); } .warn { --c: var(--warn); } .err { --c: var(--err); } .info { --c: var(--info); }
  .progress { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress div { height: 100%; background: var(--ok); }
  .sessions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .sessions li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 6px; border-radius: 6px; cursor: pointer; }
  .sessions li:hover { background: var(--chip); }
  .sessions li.next { box-shadow: inset 3px 0 var(--accent); }
  .sessions li.sel { background: var(--accent-bg); outline: 1px solid var(--accent); }
  .meta { color: var(--dim); font-size: 12px; }
  .group { margin: 10px 0 2px; font-weight: 600; }
  .group span { color: var(--dim); font-weight: 400; }
  .ticket { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; font-size: 13px; }
  .ticket:hover { background: var(--chip); }
  .ticket.hl { background: var(--accent-bg); }
  .ticket .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--dim); }
  #detail { flex: 0 0 48%; min-height: 0; overflow: auto; border: 1px solid var(--accent); border-radius: 10px;
    background: var(--card); padding: 10px 14px; }
  #detail[hidden] { display: none; }
  #detail .head { position: sticky; top: -10px; background: var(--card); padding: 4px 0 6px; border-bottom: 1px solid var(--line); }
  #detail button { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 18px; cursor: pointer; }
  .md h2, .md h3, .md h4, .md h5 { margin: 1em 0 .3em; font-size: 14px; }
  .md h2 { font-size: 16px; } .md p, .md ul, .md ol { margin: .4em 0; } .md ul, .md ol { padding-left: 20px; }
  .md code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
  .md pre { background: var(--chip); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
  .md table { border-collapse: collapse; margin: .4em 0; } .md td { border: 1px solid var(--line); padding: 2px 8px; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="grid">
  <section class="col" id="sprints"></section>
  <section class="col right"><div class="scroll" id="backlog"></div><aside id="detail" hidden></aside></section>
</div>
<script>
'use strict';
const DATA = /*DATA*/null;
const KEY = 'k3c-planung';
const PRIO = ['hoch', 'mittel', 'niedrig'];

// Hell/dunkel: im iframe von k3c-dev wie die Oberfläche (Radix setzt .dark), sonst wie das System.
try {
  const host = window.parent !== window && window.parent.document.querySelector('.radix-themes');
  const dark = host ? host.classList.contains('dark') : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
} catch { /* fremder Ursprung: hell bleiben */ }

// Filter und Auswahl überleben das Neuladen nach einer Änderung in docs/ (sessionStorage, falls erlaubt).
const state = { q: '', doms: [], quick: [], sel: '', done: false };
try { Object.assign(state, JSON.parse(sessionStorage.getItem(KEY) || '{}')); } catch { /* ohne Speicher */ }
const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch { /* ohne Speicher */ } };

const QUICK = [
  { id: 'aktiv', label: 'Aktive Sprints', sprint: (s) => s.status === 'aktiv' },
  { id: 'agent', label: 'Agent offen', sprint: (s) => s.sessions.some(isNext) },
  { id: 'hoch', label: 'Prio hoch', ticket: (t) => t.prio === 'hoch' },
  { id: 'offen', label: 'Offen', ticket: (t) => t.status === 'offen' },
  { id: 'eingeplant', label: 'Eingeplant', ticket: (t) => t.status === 'eingeplant' },
];

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const isNext = (x) => x.status === 'offen' && x.agent === 'autonom';
const tone = (st) => ({ fertig: 'ok', 'in Arbeit': 'info', blockiert: 'err' })[st] || '';
const has = (q, ...xs) => q === '' || xs.some((x) => String(x ?? '').toLowerCase().includes(q));
const domOk = (d) => state.doms.length === 0 || state.doms.includes(d || '–');
const quickOk = (kind, item) => QUICK.filter((f) => state.quick.includes(f.id) && f[kind]).every((f) => f[kind](item));

function findSession(nr) {
  for (const s of DATA.sprints) for (const x of s.sessions) if (x.nr === nr) return { s, x };
  return null;
}

function renderBar() {
  const doms = [...new Set([...DATA.sprints.map((s) => s.domain), ...DATA.tickets.map((t) => t.domain)].map((d) => d || '–'))].sort();
  const chip = (attr, id, label, on) => `<button class="chip${on ? ' on' : ''}" ${attr}="${esc(id)}">${esc(label)}</button>`;
  const any = state.q || state.doms.length || state.quick.length;
  document.getElementById('bar').innerHTML =
    `<input id="q" type="search" placeholder="Suche: Nr., Titel, Ticket …" value="${esc(state.q)}">` +
    QUICK.map((f) => chip('data-quick', f.id, f.label, state.quick.includes(f.id))).join('') +
    '<span class="sep"></span>' + doms.map((d) => chip('data-dom', d, d, state.doms.includes(d))).join('') +
    (any ? '<button class="chip reset" data-reset>× zurücksetzen</button>' : '') +
    `<span class="sep"></span><label class="chk"><input type="checkbox" id="done"${state.done ? ' checked' : ''}> Erledigte zeigen (${DATA.done})</label>` +
    '<span class="count" id="count"></span>';
}

function sprintCard(s) {
  const done = s.sessions.filter((x) => x.status === 'fertig').length;
  const next = s.sessions.find(isNext);
  const rows = s.sessions.map((x) => `<li data-sel="${esc(x.nr)}" class="${x === next ? 'next ' : ''}${x.nr === state.sel ? 'sel' : ''}">
      <span class="badge ${tone(x.status)}">${esc(x.status)}</span><code>${esc(x.nr)}</code>
      <span>${esc(x.titel || [x.typ, x.agent].filter(Boolean).join(' · '))}</span></li>`).join('');
  const cls = { aktiv: ' active', erledigt: ' done' }[s.status] || '';
  return `<div class="card${cls}${s.worktree ? ' wt' : ''}">
    <div class="head"><strong>${esc(s.id)}</strong><span class="dom">${esc(s.domain)}</span><span class="t">${esc(s.title)}</span>
      ${s.worktree ? `<span class="badge ok" title="Ein Worktree arbeitet gerade an diesem Sprint">⚙ Worktree: ${esc(s.worktree)}</span>` : ''}
      <span class="badge${s.status === 'aktiv' ? ' info' : ''}">${esc(s.status)}</span>
      <span class="badge ${s.spec === 'freigegeben' ? 'ok' : 'warn'}">Spec: ${esc(s.spec || '–')}</span></div>
    ${s.sessions.length ? `<div class="progress" title="${done} von ${s.sessions.length} Sessions fertig"><div style="width:${(done / s.sessions.length) * 100}%"></div></div>` : ''}
    <ul class="sessions">${rows}</ul>
    ${s.tickets.length ? `<div class="meta">Tickets: ${esc(s.tickets.join(', '))}</div>` : ''}</div>`;
}

function renderSprints(q) {
  const list = DATA.sprints.filter((s) => (state.done || s.status !== 'erledigt') && domOk(s.domain) && quickOk('sprint', s) &&
    has(q, s.id, s.title, s.tickets.join(' '), ...s.sessions.map((x) => x.nr + ' ' + x.titel)));
  document.getElementById('sprints').innerHTML =
    `<h2>Sprints <small>${list.length} von ${DATA.sprints.length} · ${DATA.done} erledigt</small></h2>` +
    (list.map(sprintCard).join('') || '<p class="empty">Kein Sprint passt zum Filter.</p>');
  return list.length;
}

function renderBacklog(q) {
  const sel = findSession(state.sel);
  const linked = new Set(sel ? [...sel.s.tickets, ...DATA.tickets.filter((t) => t.sprint === sel.s.id).map((t) => t.nr)] : []);
  const list = DATA.tickets.filter((t) => domOk(t.domain) && quickOk('ticket', t) && has(q, t.nr, t.title, t.sprint));
  const rank = (t) => (PRIO.includes(t.prio) ? PRIO.indexOf(t.prio) : PRIO.length);
  const groups = new Map();
  for (const t of list) groups.set(t.domain || '–', [...(groups.get(t.domain || '–') || []), t]);
  const html = [...groups.entries()].sort(([a], [b]) => (a < b ? -1 : 1)).map(([dom, ts]) =>
    `<div class="group">${esc(dom)} <span>${ts.length}</span></div>` +
    ts.sort((a, b) => rank(a) - rank(b) || (a.nr < b.nr ? -1 : 1)).map((t) =>
      `<div class="ticket${linked.has(t.nr) ? ' hl' : ''}" title="${esc(t.typ)} · Spec: ${esc(t.spec)}"><code>${esc(t.nr)}</code>
        <span class="t">${esc(t.title)}</span><span class="badge${t.prio === 'hoch' ? ' warn' : ''}">${esc(t.prio)}</span>
        <span class="badge${t.status === 'eingeplant' ? ' info' : ''}">${esc(t.status)}${t.sprint && t.sprint !== '–' ? ' · ' + esc(t.sprint) : ''}</span></div>`).join('')).join('');
  document.getElementById('backlog').innerHTML =
    `<h2>Backlog <small>${list.length} von ${DATA.tickets.length} offenen Tickets</small></h2>` + (html || '<p class="empty">Kein Ticket passt zum Filter.</p>');
  return list.length;
}

function renderDetail() {
  const el = document.getElementById('detail');
  const hit = findSession(state.sel);
  el.hidden = !hit;
  if (!hit) return;
  const { s, x } = hit;
  el.innerHTML = `<div class="head"><code>${esc(x.nr)}</code><strong>${esc(x.titel || s.title)}</strong>
      <span class="badge ${tone(x.status)}">${esc(x.status)}</span>${x.typ ? `<span class="meta">${esc(x.typ)} · ${esc(x.agent)}</span>` : ''}
      <button data-close title="Schließen">×</button></div>
    <div class="md">${x.text ? md(x.text) : `<p class="empty">Noch keine Session-Datei – Entwurf im Sprint ${esc(s.id)}.</p>`}</div>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const n = renderSprints(q) + renderBacklog(q);
  renderDetail();
  document.getElementById('count').textContent = `${n} Treffer`;
}

// Kleines Markdown für Session-Dateien: Überschriften, Listen, Häkchen, Tabellen, Code, fett. Mehr nutzen die Vorlagen nicht.
function md(src) {
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/^\[ \] /, '☐ ').replace(/^\[x\] /i, '☑ ');
  const out = [];
  let open = '', code = null;
  const close = () => { if (open) out.push(`</${open}>`); open = ''; };
  const start = (tag) => { if (open !== tag) { close(); out.push(`<${tag}>`); open = tag; } };
  for (const line of src.replace(/\r/g, '').split('\n')) {
    if (code !== null) {
      if (line.startsWith('```')) { out.push(`<pre>${esc(code)}</pre>`); code = null; } else code += line + '\n';
      continue;
    }
    let m;
    if (line.startsWith('```')) { close(); code = ''; }
    else if ((m = /^(#{1,4})\s+(.*)/.exec(line))) { close(); out.push(`<h${m[1].length + 1}>${inline(m[2])}</h${m[1].length + 1}>`); }
    else if (/^\s*\|/.test(line)) {
      if (/^\s*\|[\s|:-]+\|\s*$/.test(line)) continue;
      start('table');
      out.push('<tr>' + line.trim().replace(/^\||\|$/g, '').split('|').map((c) => `<td>${inline(c.trim())}</td>`).join('') + '</tr>');
    }
    else if ((m = /^\s*(\d+\.|[-*])\s+(.*)/.exec(line))) { start(m[1].endsWith('.') ? 'ol' : 'ul'); out.push(`<li>${inline(m[2])}</li>`); }
    else if (line.trim() === '') close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  if (code !== null) out.push(`<pre>${esc(code)}</pre>`);
  return out.join('');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-quick],[data-dom],[data-reset],[data-sel],[data-close]');
  if (!t) return;
  const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
  if (t.dataset.quick) state.quick = toggle(state.quick, t.dataset.quick);
  else if (t.dataset.dom) state.doms = toggle(state.doms, t.dataset.dom);
  else if ('reset' in t.dataset) Object.assign(state, { q: '', doms: [], quick: [] });
  else if (t.dataset.sel) state.sel = state.sel === t.dataset.sel ? '' : t.dataset.sel;
  else state.sel = '';
  save();
  if (!t.dataset.sel && !('close' in t.dataset)) renderBar();
  render();
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'done') return;
  state.done = e.target.checked;
  save();
  render();
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value;
  save();
  render();
});

if (DATA) { renderBar(); render(); }
else document.body.textContent = 'Keine Daten – die Seite entsteht in k3c-dev (internal/planning/page.go).';
</script>
</body>
</html>
