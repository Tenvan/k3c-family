<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="tex.pageTitle">K3C Textur-Grenze</title>
    <style>
      :root { --bg: #11151c; --panel: #1c2330; --line: #2e3a4d; --text: #e8edf4; --dim: #8a97aa; --on: #ffd166; --ok: #52b788; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.4 system-ui, sans-serif; }
      html { font-size: clamp(9px, 0.8334vw, 16px); }
      main { padding: max(4.75rem, 56px) 2rem 1.5rem; max-width: 115rem; margin: 0 auto; }
      h1 { font-size: 2.125rem; margin: 0 0 4px; }
      h2 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      .sub { color: var(--dim); margin: 0 0 1.25rem; max-width: 70rem; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      section { background: var(--panel); border: 1px solid var(--line); border-radius: 0.75rem; padding: 1.125rem 1.375rem; margin-bottom: 1rem; }
      button { font: inherit; font-size: 1.1rem; padding: 0.5rem 1rem; margin: 0 0.5rem 0.5rem 0; border-radius: 0.625rem; border: 2px solid var(--line); background: #26324a; color: var(--text); }
      button:focus-visible, button:hover { border-color: var(--on); outline: none; }
      button[aria-pressed="true"] { background: var(--on); color: #000; font-weight: 700; }
      button:disabled { opacity: 0.45; }
      dl { font-size: 0.85em; display: grid; grid-template-columns: max-content 1fr; gap: 4px 1rem; margin: 0; }
      dt { color: var(--dim); }
      dd { margin: 0; word-break: break-all; }
      pre { font: 1rem/1.35 ui-monospace, monospace; background: #0b0e13; border-radius: 8px; padding: 0.625rem; min-height: 8rem; max-height: 22rem; overflow: auto; margin: 0; }
      #stage canvas { width: 100%; max-width: 40rem; border-radius: 8px; background: #000; display: block; }
      #result { font-weight: 700; color: var(--ok); }
      @media (orientation: portrait) { .cols { display: block; } html { font-size: clamp(12px, 3.4vw, 16px); } }
    </style>
  </head>
  <body>
    <main>
      <h1 data-t="tex.pageTitle">K3C Textur-Grenze</h1>
      <p class="sub" data-t="tex.sub">Misst ohne Spiel, wie viel Texturspeicher der Browser verträgt.</p>
      <div class="cols">
        <div>
          <section>
            <h2 data-t="tex.h.config">Textur-Größe</h2>
            <div id="sizes"></div>
            <button id="btn-start" data-t="tex.btn.start">Messung starten</button>
            <button id="btn-send" data-t="tex.btn.send" disabled>Bericht an Server senden</button>
            <p id="state" class="sub" style="margin:8px 0 0"></p>
            <p id="sent" class="sub" style="margin:4px 0 0"></p>
          </section>
          <section>
            <h2 data-t="tex.h.run">Lauf</h2>
            <p id="result"></p>
            <pre id="out"></pre>
          </section>
        </div>
        <div>
          <section>
            <h2 data-t="tex.h.device">Gerät</h2>
            <dl id="device"></dl>
          </section>
          <section><div id="stage"></div></section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/tools/textureTest.ts"></script>
  </body>
</html>
