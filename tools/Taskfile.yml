# Namespace `gen`: Generatoren, die Dateien im Repo erzeugen (deterministisch, feste EXEs in bin/).
version: '3'

tasks:
  paper:
    desc: 'Papierschnitt-Grafik bereitstellen: rendert nach .work/grafik (nur bei geänderten Quellen) und kopiert fehlende oder geänderte Dateien nach public/grafik (RD1, B-737, B-748)'
    cmds:
      - task: paper-render
      - task: paper-sync

  paper-sync:
    internal: true
    desc: Fehlende Grafiken aus .work/grafik nach public/grafik kopieren, ohne zu rendern (B-748)
    # golden.json und index.paper.json sind eingecheckt und erfüllen `generates` auch ohne PNGs (frischer Checkout, gelöschte Ordner):
    # fehlt zu irgendeiner Spec das Manifest in public/grafik, wird kopiert
    status:
      - bun tools/paper/bin/gen.ts --fehlt public
    cmds:
      - bun tools/paper/bin/gen.ts --nur-kopieren

  paper-render:
    internal: true
    desc: 'Papierschnitt-Grafik rendern (public/grafik/<gruppe>/*.paper.json → .work/grafik, geänderte Dateien nach public/grafik/; PNG und Manifest nicht eingecheckt, index.paper.json und golden.json schon; RD1, B-737)'
    preconditions:
      - sh: command -v bun
        msg: Bun fehlt (requirements.md)
    sources:
      - tools/paper/bin/*.ts
      - tools/paper/cli/*.ts
      - tools/paper/render/*.ts
      - tools/paper/rig/*.ts
      - tools/paper/schema/*.ts
      - tools/paper/schema/*.json
      - exclude: tools/paper/**/*.test.ts
      - public/grafik/stil.paper.json
      - public/grafik/*/*.paper.json
      - exclude: public/grafik/*/index.paper.json
    generates:
      - public/grafik/*/golden.json
      - public/grafik/*/index.paper.json
      - public/grafik/*/*/manifest.json
      - public/grafik/*/*/*.png
    # .work gelöscht (Quellen unverändert): auch dann neu rendern
    status:
      - bun tools/paper/bin/gen.ts --fehlt work
    cmds:
      - bun tools/paper/bin/gen.ts


  rules:
    desc: "Regeltabelle Hub-Stufe → Gebäude (docs/rules/materialien-gebaeude.md § 3) aus data/hub.json erzeugen (deterministisch; feste EXE bin/regeltabelle, WZ15.2, B-462)"
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
    cmds:
      - go build -o bin/regeltabelle{{exeExt}} ./tools/ruletable
      - ./bin/regeltabelle{{exeExt}}

  soundatlas:
    desc: Sound-Atlas public/audio/atlas.{ogg,mp3,json} aus den Effekt-Slots in data/sounds.json packen (erste Präferenz je Slot, ffmpeg; feste EXE bin/soundatlas, SO6.2, B-494)
    deps: [':tmp']
    preconditions:
      - sh: command -v go
        msg: Go fehlt (requirements.md)
      - sh: command -v ffmpeg
        msg: ffmpeg fehlt (requirements.md)
    sources:
      - tools/soundatlas/*.go
      - data/sounds.json
    generates:
      - public/audio/atlas.json
    cmds:
      - go build -o bin/soundatlas{{exeExt}} ./tools/soundatlas
      - ./bin/soundatlas{{exeExt}}
