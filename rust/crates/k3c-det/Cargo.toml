[package]
name = "k3c-det"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Freigabe über die Spec RU3 (RU3.3 nennt flate2 für .json.gz).
flate2 = "=1.1.11"
serde.workspace = true
# float_roundtrip: Zahlen korrekt gerundet lesen wie Gos strconv.ParseFloat (bitgleich).
serde_json = { workspace = true, features = ["float_roundtrip"] }
