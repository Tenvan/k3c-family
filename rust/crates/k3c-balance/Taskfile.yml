# Namespace `balance`: der Balancing-Tester als Handweg. Gerechnet wird seit RU40.4 in der Spiel-EXE
# (`k3c-game sim balance`, docs/standards/k3c-game-laeufe.md); der Leseteil des Studios (Berichte, Insights, Baselines)
# liegt in rust/tools/crates/k3c-studio/src/balance. Autonome Läufe starten Agenten nur über `sim_test` (CLAUDE.md).
version: '3'

tasks:
  build:
    desc: Spiel-EXE rust/target/release/k3c-game bauen (wie rust:game:exe)
    cmds:
      - task: :rust:game:exe

  fullgame:
    desc: 'Vollständiges Spiel mit einem Bot (BS3.4): Rust-Test fullgame_<STUFE> in k3c-balance (#[ignore], seit RU41 statt Go), bewusst nicht in task check; `task balance:fullgame STUFE=4` (Standard 4); K3C_FULLGAME=hilfen|voll (Standard)|boss|ohne'
    dir: '{{.ROOT_DIR}}/rust'
    vars:
      STUFE: '{{.STUFE | default "4"}}'
    cmds:
      - cargo test --release -p k3c-balance --lib fullgame_{{.STUFE}} -- --ignored --nocapture

  milestone:
    desc: 'Meilenstein-Lauf coop2, Welt standard, 40 Tage (BS3.6): Rust-Test meilenstein_coop2 in k3c-balance (#[ignore], seit RU41 statt Go); K3C_VARY="economy.json:dawnGoldPerDepth=10" (Semikolon), K3C_SEEDS=k3c-dev,7'
    dir: '{{.ROOT_DIR}}/rust'
    cmds:
      - cargo test --release -p k3c-balance --lib meilenstein_coop2 -- --ignored --nocapture

  targets:
    desc: 'Zielkorridore prüfen: 100 feste Seeds (seit BAL6 sechs Szenarien, geschätzt 35–40 min; zum Entwickeln `task balance -- --seeds 10`), Bericht reports/balance-<Zeit>.json und .md, Vergleich mit testdata/balance/baseline.json (kein Teil von `task check`)'
    cmds:
      - task: build
      - ./rust/target/release/k3c-game{{exeExt}} sim balance --data data --targets --baseline testdata/balance/baseline.json --replay-dir reports/balance-replays {{.CLI_ARGS}}

  baseline:
    desc: 'Baseline neu schreiben (testdata/balance/baseline.json); nur mit Begründung im Commit, wie bei Golden-Dateien'
    cmds:
      - task: build
      - ./rust/target/release/k3c-game{{exeExt}} sim balance --data data --targets --write-baseline --baseline testdata/balance/baseline.json {{.CLI_ARGS}}

  sensitivity:
    desc: 'Sensitivität und Grad-Kurven: Werte aus data/ um ±10/±25 % nur im Speicher ändern, gekippte Ziele und Kurven je Grad nach reports/sensitivity-<Zeit>.json und .md (z. B. `task balance:sensitivity -- --seeds 10 --vary economy.json:purse.startGold`; kein Teil von `task check`)'
    cmds:
      - task: build
      - ./rust/target/release/k3c-game{{exeExt}} sim balance --data data --sensitivity --curves {{.CLI_ARGS}}

  run:
    desc: 'Balancing-Tester: Bots spielen eine Szenario-Matrix, Kennzahlen als JSON-Zeile result (z. B. `task balance:run -- --seeds 10 --bots saver --days 5 --out matrix.json`)'
    cmds:
      - task: build
      - ./rust/target/release/k3c-game{{exeExt}} sim balance --data data {{.CLI_ARGS}}

  default:
    desc: Kurzform von balance:targets
    cmds:
      - task: targets
