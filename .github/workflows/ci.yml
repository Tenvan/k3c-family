# CI: Lint, Typecheck, Tests, Build (auch GitHub-Pages-Seite); Go: Tests (auch Heimnetz-Server), Lint, Cross-Build; Docker: Image amd64/arm64 mit Smoke-Test; k3c-workbench, Asset-Studio und Windows-Starter: Frontend, Tests, Lint, Wails-Build (Windows). Tests nur nach dem Merge (Push auf develop/main) oder von Hand (workflow_dispatch); im Pull Request nur Merge-Konflikt-Prüfung, Tests laufen lokal vor dem Push (task check).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull Request: nur prüfen, ob der Branch sauber in die Zielbranch passt. Die übrigen Jobs laufen nur bei Push/Dispatch.
  merge-konflikte:
    name: Merge-Konflikte
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Zielbranch probeweise einmergen
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}"

  check:
    if: github.event_name != 'pull_request'
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/k3c-workbench/frontend/package-lock.json
            tools/k3c-studio/frontend/package-lock.json
            tools/k3c-starter/frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      # Wie lokal: Client und Frontends von k3c-workbench, Asset-Studio und Starter, deren Komponententests (React, Radix) laufen in task test mit.
      - run: task install
      - run: task lint
      - run: task typecheck
      - run: task test
      # Produktions-Build (dist/); die GitHub-Pages-Seite site/ baut nichts (B-507).
      - run: task build

      # Den Heimnetz-Server prüfen seit SP03 die Go-Tests (engine/net, httptest) im Job go (B-020).

      - uses: actions/upload-artifact@v7
        with:
          name: k3c-dist
          path: dist/
          retention-days: 14

  go:
    if: github.event_name != 'pull_request'
    name: Go · Tests · Lint · Cross-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      - run: task go:test
      - name: Race-Detector für engine/ (B-077)
        run: task go:race
      # Abdeckung je Paket unter engine/ (B-019): nur Anzeige in der Job-Zusammenfassung, kein Mindestwert.
      - name: Abdeckung (engine/)
        run: |
          set -o pipefail
          task go:cover | tee coverage.txt
          {
            echo '### Abdeckung engine/'
            echo '| Paket | Abdeckung |'
            echo '|---|---|'
            awk '/coverage:/ { pkg = ($1 == "ok" ? $2 : $1); for (i = 1; i <= NF; i++) if ($i == "coverage:") print "| " pkg " | " $(i+1) " |" }' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      # Balance-Bericht mit 10 Seeds (B-157, BAL2.3): kein Gate. Verletzte Ziele ergeben Exit 0, nur ein Fehler des Werkzeugs färbt den Job rot.
      - name: Balance-Bericht (10 Seeds)
        run: task balance -- --seeds 10
      - uses: actions/upload-artifact@v7
        with:
          name: k3c-balance
          path: reports/balance-*
          retention-days: 14

  # Golden-Tests auf arm64 (Raspberry Pi, B-071): Go darf dort x*y + z zu FMA fusionieren, dann weichen Gleitkommawerte
  # ab. Nativer GitHub-Runner (Repo öffentlich), Rückfall wäre qemu-Emulation.
  go-arm64:
    if: github.event_name != 'pull_request'
    name: Go · Tests arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v1
      - run: go env GOARCH
      - run: task go:test

  docker:
    if: github.event_name != 'pull_request'
    name: Docker · Image amd64/arm64 · Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Beide Plattformen bauen (arm64 = Raspberry Pi); nur die Go-Stufe kompiliert je Plattform, keine Emulation nötig.
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t k3c-server:ci .
      - name: amd64-Image starten und prüfen
        run: |
          docker buildx build --platform linux/amd64 --load -t k3c-server:ci .
          docker run -d --name k3c -p 8080:8080 k3c-server:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          for page in / /game.html /gamepad-test.html; do curl -fsS -o /dev/null "http://localhost:8080$page"; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"version":1,"campaignId":"ci"}' http://localhost:8080/api/save)" = 200
          curl -fsS http://localhost:8080/api/save | grep -q '"campaignId":"ci"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = 404
          case "$(docker inspect --format '{{.Config.User}}' k3c-server:ci)" in nonroot | 65532 | 65532:65532) ;; *) exit 1 ;; esac
          docker logs k3c
          # Release-Image ohne Dev-Mode (B-273): Startzeile nennt dev=false
          docker logs k3c 2>&1 | grep -q 'dev=false'
      - name: Dev-Mode per K3C_DEV=1 einschaltbar
        run: |
          docker run -d --name k3c-workbench -e K3C_DEV=1 k3c-server:ci
          for i in $(seq 1 30); do docker exec k3c-workbench /app/k3c-server -health && break; sleep 1; done
          docker logs k3c-workbench 2>&1 | grep -q 'dev=true'
      # Diagnose-TUI im Image (SP10, B-002): ein zweiter Container mit Token, k3c-tui -once ohne Terminal.
      - name: k3c-tui im Image prüfen
        run: |
          docker run -d --name k3c-diag -e K3C_STATUS_TOKEN=ci-token k3c-server:ci
          for i in $(seq 1 30); do docker exec k3c-diag /app/k3c-server -health && break; sleep 1; done
          docker exec k3c-diag k3c-tui -once | tee tui.txt
          grep -q 'K3C ' tui.txt
          grep -q 'Keine Räume' tui.txt

  k3c-workbench:
    if: github.event_name != 'pull_request'
    name: k3c-workbench · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/k3c-workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-workbench/go.mod
          cache-dependency-path: tools/k3c-workbench/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/k3c-workbench/frontend/package-lock.json
      # Der Typecheck des Frontends prüft auch die Tests; vitest kommt aus dem Hauptprojekt, die Konfiguration
      # (Alias @webkit) aus tools/k3c-workbench/frontend/vitest.config.ts.
      - uses: go-task/setup-task@v1
      - run: npm ci
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck).
      - run: npm ci
        working-directory: tools/k3c-workbench/frontend
      - run: task k3c-workbench:frontend
        working-directory: .
      - run: npx vitest run --config vitest.config.ts
        working-directory: tools/k3c-workbench/frontend
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-workbench
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s

  # Asset-Studio (B-459, B-507): eigenes Fenster mit eigenem Server, keine Seite des Spielservers. Frontend (Typecheck,
  # Build nach tools/k3c-studio/frontend/dist, Vitest), die Asset-Logik tools/assetkit und das Modul tools/k3c-studio
  # samt Backend (go test, Lint). Windows wie k3c-workbench: das Modul bindet Wails ein.
  k3c-studio:
    if: github.event_name != 'pull_request'
    name: Asset-Studio · Frontend · Tests · Lint (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-studio/go.mod
          cache-dependency-path: tools/k3c-studio/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/k3c-studio/frontend/package-lock.json
      - uses: go-task/setup-task@v1
      - run: npm ci
      - run: npm ci
        working-directory: tools/k3c-studio/frontend
      - run: task k3c-studio:frontend
      # Komponententests des Studios mit dessen Vitest-Konfiguration (Aliase @game/@data); das Vitest der Wurzel nimmt
      # tools/k3c-studio aus.
      - run: npx vitest run --config tools/k3c-studio/frontend/vitest.config.ts
      - run: go test ./...
        working-directory: tools/assetkit
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/assetkit
      - run: go test ./...
        working-directory: tools/k3c-studio
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-studio

  # Windows-Starter (B-041, BT1.2): Frontend (React auf Radix Themes; Typecheck, Build nach tools/k3c-starter/frontend/dist, Vitest),
  # Go-Tests, Lint, Wails-Build. Windows wie k3c-workbench: das Modul bindet Wails ein.
  k3c-starter:
    if: github.event_name != 'pull_request'
    name: Windows-Starter · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/k3c-starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-starter/go.mod
          cache-dependency-path: tools/k3c-starter/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/k3c-starter/frontend/package-lock.json
      - uses: go-task/setup-task@v1
      - run: npm ci
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck); vitest kommt aus dem Hauptprojekt,
      # die Konfiguration (Alias @webkit) aus tools/k3c-starter/frontend/vitest.config.ts.
      - run: npm ci
        working-directory: tools/k3c-starter/frontend
      # Task aus der Wurzel: im Ordner tools/k3c-starter gälte dessen Taskfile ohne Namensraum.
      - run: task k3c-starter:frontend
        working-directory: .
      - run: npx vitest run --config vitest.config.ts
        working-directory: tools/k3c-starter/frontend
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-starter
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s
