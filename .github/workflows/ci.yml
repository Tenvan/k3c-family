# CI: Lint, Typecheck, Tests, Build (auch GitHub-Pages-Seite); Go: Tests (auch Heimnetz-Server), Lint, Cross-Build; Docker: Image amd64/arm64 mit Smoke-Test; natives Spiel: vet, Build, Tests unter Windows ohne cgo; k3c-workbench und Windows-Starter: Frontend, Tests, Lint, Wails-Build (Windows). Tests nur nach dem Merge (Push auf develop/main) oder von Hand (workflow_dispatch); im Pull Request nur Merge-Konflikt-Prüfung, Tests laufen lokal vor dem Push (task check).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go-Tests ohne Sim-, Balance- und Lasttest-Pakete: Ihre Tests sind gesperrt (Beschluss Ralf 2026-11-11) und laufen nur im
# Abnahme-Ticket; vet und Lint prüfen sie weiter. Gleiche Liste wie tools/checkdiff › simDirs (B-825). Alle Go-Tests mit -short.
env:
  GO_SIM_PKGS: '/(engine/balance|cmd/k3c-sim|cmd/k3c-load)$'
  WB_SIM_PKGS: '/internal/(balance|simrun|simexe|botdev)$'

jobs:
  # Pull Request: nur prüfen, ob der Branch sauber in die Zielbranch passt. Die übrigen Jobs laufen nur bei Push/Dispatch.
  merge-konflikte:
    name: Merge-Konflikte
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Zielbranch probeweise einmergen
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}"

  check:
    if: github.event_name != 'pull_request'
    name: Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      # Wie lokal: Client und Frontends von k3c-workbench und Starter, deren Komponententests (React, Radix) laufen in task test mit.
      - run: task install
      - run: task lint
      - run: task typecheck
      # Vitest (Client, Regel-Tests; rendert vorher gen:paper). Seit #531 aus, wieder an mit B-825.
      - run: task test
      # Produktions-Build (dist/); die GitHub-Pages-Seite site/ baut nichts (B-507).
      - run: task build

      # Den Heimnetz-Server prüfen seit SP03 die Go-Tests (engine/net, httptest) im Job go (B-020).

      - uses: actions/upload-artifact@v7
        with:
          name: k3c-dist
          path: dist/
          retention-days: 14

  go:
    if: github.event_name != 'pull_request'
    name: Go · Tests · Lint · Cross-Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Die Papierschnitt-Grafik ist nicht eingecheckt (B-737): Tests lesen sie aus public/grafik, hier rendern (B-756)
      - run: bun install --frozen-lockfile
      - run: task gen:paper
      - name: Go-Tests (-short, ohne Sim/Balance/Last)
        run: task go:test GO_TEST_FLAGS=-short GO_PKGS="$(go list ./... | grep -Ev "$GO_SIM_PKGS" | tr '\n' ' ')"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...

  # Golden-Tests auf arm64 (Raspberry Pi, B-071): Go darf dort x*y + z zu FMA fusionieren, dann weichen Gleitkommawerte
  # ab. Nativer GitHub-Runner (Repo öffentlich), Rückfall wäre qemu-Emulation.
  go-arm64:
    if: github.event_name != 'pull_request'
    name: Go · Tests arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Die Papierschnitt-Grafik ist nicht eingecheckt (B-737): Tests lesen sie aus public/grafik, hier rendern (B-756)
      - run: bun install --frozen-lockfile
      - run: task gen:paper
      - run: go env GOARCH
      - run: task go:test GO_TEST_FLAGS=-short GO_PKGS="$(go list ./... | grep -Ev "$GO_SIM_PKGS" | tr '\n' ' ')"

  # Natives Spiel (Projekt NAT, B-794): Go + Ebitengine, eigenes Modul native/k3c-game. Nur Windows ohne cgo (unter Linux
  # bräuchte Ebitengine cgo und X11); es laufen nur Tests ohne Fenster und GPU (-short).
  k3c-game:
    if: github.event_name != 'pull_request'
    name: Natives Spiel · vet · Build · Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: native/k3c-game
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/k3c-game/go.mod
          cache-dependency-path: native/k3c-game/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -short ./...

  docker:
    if: github.event_name != 'pull_request'
    name: Docker · Image amd64/arm64 · Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Beide Plattformen bauen (arm64 = Raspberry Pi); nur die Go-Stufe kompiliert je Plattform, keine Emulation nötig.
      - run: docker buildx build --platform linux/amd64,linux/arm64 -t k3c-server:ci .
      - name: amd64-Image starten und prüfen
        run: |
          docker buildx build --platform linux/amd64 --load -t k3c-server:ci .
          docker run -d --name k3c -e NO_COLOR=1 -p 8080:8080 k3c-server:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          for page in / /game.html; do curl -fsS -o /dev/null "http://localhost:8080$page"; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"version":1,"campaignId":"ci"}' http://localhost:8080/api/save)" = 200
          curl -fsS http://localhost:8080/api/save | grep -q '"campaignId":"ci"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/status)" = 404
          case "$(docker inspect --format '{{.Config.User}}' k3c-server:ci)" in nonroot | 65532 | 65532:65532) ;; *) exit 1 ;; esac
          docker logs k3c
          # Image mit Dev-Mode (Entwicklungsphase, RX1): Startzeile nennt dev=true (NO_COLOR=1: sonst steht ein Farbcode zwischen dev= und true)
          docker logs k3c 2>&1 | grep -q 'dev=true'
      - name: Dev-Mode per K3C_DEV=0 ausschaltbar
        run: |
          docker run -d --name k3c-workbench -e K3C_DEV=0 -e NO_COLOR=1 k3c-server:ci
          for i in $(seq 1 30); do docker exec k3c-workbench /app/k3c-server -health && break; sleep 1; done
          docker logs k3c-workbench 2>&1 | grep -q 'dev=false'
      # Diagnose-TUI im Image (SP10, B-002): ein zweiter Container mit Token, k3c-tui -once ohne Terminal.
      - name: k3c-tui im Image prüfen
        run: |
          docker run -d --name k3c-diag -e K3C_STATUS_TOKEN=ci-token k3c-server:ci
          for i in $(seq 1 30); do docker exec k3c-diag /app/k3c-server -health && break; sleep 1; done
          docker exec k3c-diag k3c-tui -once | tee tui.txt
          grep -q 'K3C ' tui.txt
          grep -q 'Keine Räume' tui.txt

  k3c-workbench:
    if: github.event_name != 'pull_request'
    name: k3c-workbench · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/k3c-workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-workbench/go.mod
          cache-dependency-path: tools/k3c-workbench/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Der Typecheck des Frontends prüft auch die Tests; vitest kommt aus dem Hauptprojekt, die Konfiguration
      # (Alias @webkit) aus tools/k3c-workbench/frontend/vitest.config.ts.
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Go-Tests von assetsui und datadoc lesen die gerenderte Grafik (B-756)
      - run: task gen:paper
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck).
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-workbench/frontend
      - run: task k3c-workbench:frontend
        working-directory: .
      # Vitest des Frontends und go test (-short) für k3c-workbench und tools/assetkit, ohne Sim/Balance-Pakete (B-825).
      - run: task k3c-workbench:vitest
        working-directory: .
      # Task aus der Wurzel (Namensraum), die Paketliste aus dem Modul tools/k3c-workbench.
      - name: Go-Tests (-short, ohne Sim/Balance)
        shell: bash
        working-directory: .
        run: task k3c-workbench:gotest GO_TEST_FLAGS=-short WB_PKGS="$(cd tools/k3c-workbench && go list ./... | grep -Ev "$WB_SIM_PKGS" | tr '\n' ' ')"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-workbench
      # Gemeinsame Asset-Logik (eigenes Modul, bis WB1 im Job des Asset-Studios geprüft).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/assetkit
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s

  # Windows-Starter (B-041, BT1.2): Frontend (React auf Radix Themes; Typecheck, Build nach tools/k3c-starter/frontend/dist, Vitest),
  # Go-Tests, Lint, Wails-Build. Windows wie k3c-workbench: das Modul bindet Wails ein.
  k3c-starter:
    if: github.event_name != 'pull_request'
    name: Windows-Starter · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/k3c-starter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-starter/go.mod
          cache-dependency-path: tools/k3c-starter/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck); vitest kommt aus dem Hauptprojekt,
      # die Konfiguration (Alias @webkit) aus tools/k3c-starter/frontend/vitest.config.ts.
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-starter/frontend
      # Task aus der Wurzel: im Ordner tools/k3c-starter gälte dessen Taskfile ohne Namensraum.
      - run: task k3c-starter:frontend
        working-directory: .
      # Vitest und go test (-short) des Starters, seit #531 aus (B-825).
      - run: task k3c-starter:test GO_TEST_FLAGS=-short
        working-directory: .
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-starter
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s
