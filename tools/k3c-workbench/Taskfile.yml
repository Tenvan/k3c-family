# Namespace `k3c-workbench`: die Workbench (Wails-Fenster, MCP-Server, React-Oberfläche in frontend/).
# `dev` ist der Client-Server-Betrieb: `k3c-workbench -dev` baut `-headless` als Kind (MCP-Server und Oberflächen-API ohne
# Fenster) und startet es bei jeder Go-Änderung in tools/k3c-workbench, tools/assetkit und engine/ neu (engine/devrun); Vite
# zeigt die Oberfläche mit Hot Reload im Browser (http://localhost:5191) und leitet /api an das Kind weiter.
# Der MCP-Port im dev ist DEV_MCP_PORT (5190), damit die laufende Workbench (5180) unberührt bleibt.
# `window` ist der alte Weg im Fenster (`wails dev`).
version: '3'

vars:
  DEV: '{{.ROOT_DIR}}/tools/k3c-workbench'
  DEV_MCP_PORT: '5190'
  DEV_UI_API_PORT: '8191'

tasks:
  dev:
    desc: "Workbench im Client-Server-Betrieb: Backend neu bei Go-Änderungen, Oberfläche mit Hot Reload unter http://localhost:5191"
    deps: [dev:server, dev:ui]

  dev:server:
    desc: "Backend ohne Fenster (k3c-workbench -dev): MCP auf DEV_MCP_PORT, Oberflächen-API auf DEV_UI_API_PORT, Neustart bei Go-Änderungen"
    deps: [':tmp', dist]
    dir: '{{.DEV}}'
    env:
      K3C_DEV_PORT: '{{.DEV_MCP_PORT}}'
      K3C_DEV_UI_API_PORT: '{{.DEV_UI_API_PORT}}'
      # k3c-workbench bettet data/*.json und frontend/dist ein, die devrun nicht beobachtet: immer erst bauen
      K3C_DEV_REBUILD: '1'
    # Bewusst `go build` (Konsolen-Subsystem), nie `wails build` (-H windowsgui): devrun beendet das Kind sauber per
    # CTRL_BREAK über die Konsole, aus einer GUI-EXE scheitert das und das Kind würde hart beendet. Das Kind baut devrun
    # ebenso mit `go build`.
    cmds:
      # je UI-Port eine eigene Supervisor-EXE (und Kind-EXE, headless.go): parallele Dev-Läufe stören sich nicht
      - go build -o build/bin/k3c-workbench-dev-{{.DEV_UI_API_PORT}}{{exeExt}} .
      - build/bin/k3c-workbench-dev-{{.DEV_UI_API_PORT}}{{exeExt}} -dev

  dist:
    internal: true
    desc: Stellt nur sicher, dass frontend/dist für go:embed existiert (Platzhalter; im dev liefert Vite die Oberfläche, Typfehler blockieren das Backend nicht)
    dir: '{{.DEV}}/frontend'
    status:
      - test -f dist/index.html
    cmds:
      - mkdir -p dist
      - echo '<!doctype html><title>K3C Workbench</title>' > dist/index.html
      - touch dist/.placeholder

  dev:ui:
    desc: Oberfläche mit Vite gegen das Backend von dev:server (Proxy /api)
    dir: '{{.DEV}}/frontend'
    env:
      K3C_DEV_API: 'http://127.0.0.1:{{.DEV_UI_API_PORT}}'
    cmds:
      - bunx vite

  window:
    desc: "Workbench als Fenster im Entwicklungsmodus (wails dev): Hot Reload der Oberfläche, Neubau bei Go-Änderungen in tools/k3c-workbench"
    deps: [':tmp']
    dir: '{{.DEV}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    cmds:
      - wails dev

  default:
    desc: Kurzform von k3c-workbench:dev
    cmds:
      - task: dev

  frontend:
    desc: Frontend von k3c-workbench bauen (go:embed braucht frontend/dist; nur bei geänderten Quellen)
    dir: '{{.DEV}}/frontend'
    cmds:
      - bunx tsc --noEmit
      - bunx vite build
    status:
      - test ! -f dist/.placeholder # Platzhalter aus dist: immer echt bauen, nie in die EXE
    sources:
      - src/**/*
      - index.html
      - package.json
      - vite.config.ts
      - paths.ts
      - ../../webkit/**/*
    generates:
      - dist/**/*

  test:
    desc: k3c-workbench testen (Frontend mit Vitest, go test)
    deps: [':tmp', frontend]
    dir: '{{.DEV}}'
    cmds:
      - cd frontend && bunx vitest run --config vitest.config.ts
      - go test ./...

  lint:
    desc: golangci-lint für k3c-workbench
    deps: [':tmp', frontend]
    dir: '{{.DEV}}'
    cmds:
      - golangci-lint run

  build:
    desc: "EXE von k3c-workbench bauen, feste EXE bin/k3c-workbench (wails build; nur bei geänderten Quellen, `--force` erzwingt; laufende Workbench vorher schließen, sonst scheitert die Kopie)"
    deps: [':tmp']
    dir: '{{.DEV}}'
    preconditions:
      - sh: command -v wails
        msg: 'Wails-CLI fehlt – go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 (requirements.md)'
    sources:
      - '*.go'
      - go.mod
      - go.sum
      - wails.json
      - internal/**/*
      - icon/*
      - frontend/src/**/*
      - frontend/index.html
      - frontend/package.json
      - frontend/vite.config.ts
      - frontend/paths.ts
      - ../webkit/**/*
      - ../assetkit/**/*.go
      - ../../engine/**/*.go
      - ../../data/**/*
      - ../../go.mod
      - ../../go.sum
      - exclude: '**/*_test.go'
    generates:
      - build/bin/k3c-workbench{{exeExt}}
      - ../../bin/k3c-workbench{{exeExt}}
    cmds:
      - mkdir -p build/windows
      - cp icon/appicon.png build/appicon.png
      - cp icon/icon.ico build/windows/icon.ico
      - wails build
      - mkdir -p ../../bin
      - cp build/bin/k3c-workbench{{exeExt}} ../../bin/k3c-workbench{{exeExt}}
