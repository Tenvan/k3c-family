# CI: Lint, Typecheck, Tests der Wurzel (Regeln, Planung, Papierschnitt); Go: Tests, Lint, Cross-Build; Rust-Spiel: fmt, clippy, Tests und Paket dist/k3c-game (EXE ≤ 40 MB, data, Grafik) unter Windows; k3c-workbench und k3c-studio (samt tools/workkit): Frontend, Tests, Lint, Wails-Build (Windows). Tests nur nach dem Merge (Push auf main) oder von Hand (workflow_dispatch); im Pull Request nur Merge-Konflikt-Prüfung, Tests laufen lokal vor dem Push (task check).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go-Tests ohne Sim-, Balance- und Lasttest-Pakete: Ihre Tests sind gesperrt (Beschluss Ralf 2026-11-11) und laufen nur im
# Abnahme-Ticket; vet und Lint prüfen sie weiter. Gleiche Liste wie tools/checkdiff › simDirs (B-825), aus der auch
# task check:go liest (checkdiff -gopkgs); tools/checkdiff/simlist_test.go prüft das (B-832). Alle Go-Tests mit -short.
env:
  GO_SIM_PKGS: '/(engine/balance|engine/simcli|cmd/k3c-sim)$'
  STUDIO_SIM_PKGS: '/internal/(balance|simrun)$'

jobs:
  # Pull Request: nur prüfen, ob der Branch sauber in die Zielbranch passt. Die übrigen Jobs laufen nur bei Push/Dispatch.
  merge-konflikte:
    name: Merge-Konflikte
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Zielbranch probeweise einmergen
        run: |
          git config user.email ci@example.invalid
          git config user.name ci
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}"

  check:
    if: github.event_name != 'pull_request'
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      # Wie lokal: Wurzel und Frontend von k3c-workbench, deren Komponententests (React, Radix) laufen in task test mit.
      - run: task install
      - run: task lint
      - run: task typecheck
      # Vitest (Regel-, Planungs- und Papierschnitt-Tests; rendert vorher gen:paper). Der Browser-Build entfällt (B-848),
      # das Rust-Spiel baut der Job rust; die GitHub-Pages-Seite site/ baut nichts (B-507).
      - run: task test

  go:
    if: github.event_name != 'pull_request'
    name: Go · Tests · Lint · Cross-Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Die Papierschnitt-Grafik ist nicht eingecheckt (B-737): Tests lesen sie aus public/grafik, hier rendern (B-756)
      - run: bun install --frozen-lockfile
      - run: task gen:paper
      - name: Go-Tests (-short, ohne Sim/Balance/Last)
        run: task go:test GO_TEST_FLAGS=-short GO_PKGS="$(go list ./... | grep -Ev "$GO_SIM_PKGS" | tr '\n' ' ')"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: GOOS=windows GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...

  # Rust-Workspace (Projekt RSU, RU1.3): nur Windows (MSVC), wie das Spiel. `rustup show` installiert die Toolchain aus
  # rust/rust-toolchain.toml; es laufen nur Tests ohne Fenster und GPU. Danach baut `task rust:game:build` das Paket
  # dist/k3c-game (RU35.3): Release-EXE, Grafik (gen:paper), data, LIZENZEN.txt; Go für tools/sync (Kopierwerkzeug) und tools/rustpaket.
  rust:
    if: github.event_name != 'pull_request'
    name: Rust · fmt · clippy · Tests · Paket (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Cheat-Fenster (RU56, B-1135): eigene EXE neben dem Spiel; Datei und Größe (höchstens 5 MB) prüft `task rust:game:dist:check`
      - run: cargo test -p k3c-devproto -p k3c-devwin
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: task rust:game:build
        working-directory: .
      # Paket prüfen (RU57, B-1137): Pflicht- und verbotene Dateien, EXE höchstens 40 MB (Schwelle G1, B-1016), LIZENZEN.txt
      # mit Crate-Abschnitten. Der Bau ruft dieselbe Prüfung schon; der eigene Schritt macht ein Scheitern sichtbar. Kein Artefakt-Upload.
      - name: Paket prüfen
        working-directory: .
        run: task rust:game:dist:check

  k3c-workbench:
    if: github.event_name != 'pull_request'
    name: k3c-workbench · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/k3c-workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-workbench/go.mod
          cache-dependency-path: tools/k3c-workbench/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Der Typecheck des Frontends prüft auch die Tests; vitest kommt aus dem Hauptprojekt, die Konfiguration
      # (Alias @webkit) aus tools/k3c-workbench/frontend/vitest.config.ts.
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Go-Tests von assetsui und datadoc lesen die gerenderte Grafik (B-756)
      - run: task gen:paper
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (mit Typecheck).
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-workbench/frontend
      - run: task k3c-workbench:frontend
        working-directory: .
      # Vitest des Frontends und go test (-short) für k3c-workbench und tools/assetkit, ohne Sim/Balance-Pakete (B-825).
      - run: task k3c-workbench:vitest
        working-directory: .
      # Task aus der Wurzel (Namensraum), die Paketliste aus dem Modul tools/k3c-workbench.
      - name: Go-Tests (-short, ohne Sim/Balance)
        shell: bash
        working-directory: .
        run: task k3c-workbench:gotest GO_TEST_FLAGS=-short
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-workbench
      # Gemeinsame Asset-Logik (eigenes Modul, bis WB1 im Job des Asset-Studios geprüft).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/assetkit
      # Gemeinsamer Code von Workbench und Studio (WZ63, eigenes Modul; go test läuft in k3c-workbench:gotest mit).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/workkit
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s

  k3c-studio:
    if: github.event_name != 'pull_request'
    name: k3c-studio · Frontend · Tests · Lint · Wails (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/k3c-studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/k3c-studio/go.mod
          cache-dependency-path: tools/k3c-studio/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: go-task/setup-task@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      # Go-Tests von assetsui lesen die gerenderte Grafik (B-756)
      - run: task gen:paper
        working-directory: .
      # go:embed braucht frontend/dist, deshalb zuerst das Frontend (Typecheck und vite build).
      - run: bun install --frozen-lockfile
        working-directory: tools/k3c-studio/frontend
      - run: task k3c-studio:frontend
        working-directory: .
      - run: task k3c-studio:vitest
        working-directory: .
      # Paketliste ohne Sim/Balance-Pakete (balance, simrun seit WZ63.5 im Studio, B-825).
      - name: Go-Tests Studio (-short, ohne Sim/Balance)
        shell: bash
        working-directory: .
        run: task k3c-studio:gotest GO_TEST_FLAGS=-short STUDIO_PKGS="$(cd tools/k3c-studio && go list ./... | grep -Ev "$STUDIO_SIM_PKGS" | tr '\n' ' ')"
      - run: task workkit:gotest GO_TEST_FLAGS=-short
        working-directory: .
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: tools/k3c-studio
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - run: wails build -s
